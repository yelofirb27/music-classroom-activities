<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Little Engine That Could – Tempos</title>
<style>
:root{
  --wood:#4b2e1c;
  --panel:#17191a;
  --panel2:#292b2c;
  --metal:#c9c1b0;
  --cream:#ead9b8;
  --text:#2f271f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eee8dc;color:var(--text);font-family:Georgia,"Times New Roman",serif}
body{padding:8px}
.app{max-width:1440px;margin:0 auto}
header{text-align:center;margin-bottom:8px}
h1{margin:0;color:#3b2a1d;font-size:clamp(24px,3vw,40px);line-height:1.05}
.subtitle{margin:2px 0 0;color:#6a5848;font:600 13px system-ui,sans-serif}

.main-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:12px;
  align-items:start;
}

.scene{
  position:relative;
  width:100%;
  aspect-ratio:1448/1086;
  overflow:hidden;
  border:12px solid var(--wood);
  border-radius:10px;
  background:#76845d;
  box-shadow:inset 0 0 0 3px #2b190f,0 7px 18px rgba(40,28,18,.22);
}
.scene-bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;z-index:0;
}
.train-layer{position:absolute;inset:0;z-index:2;pointer-events:none}
.car{
  position:absolute;left:0;top:0;display:block;
  transform:translate(-50%,-50%);
  transform-origin:center center;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
  will-change:left,top,transform;
}
.car.engine{width:5.95%}
.car.coal{width:3.32%}
.car.logs{width:4.28%}
.car.boxcar{width:4.83%}

.grade-label{
  position:absolute;z-index:4;top:3.5%;
  padding:6px 11px;border-radius:7px;
  background:rgba(246,229,194,.94);
  border:2px solid rgba(91,63,40,.8);
  box-shadow:0 2px 7px rgba(0,0,0,.2);
  font-weight:800;letter-spacing:.04em;
  font-size:clamp(12px,1.5vw,20px);
}
.grade-label small{
  display:block;font:600 .58em system-ui,sans-serif;
  letter-spacing:0;margin-top:2px;color:#40362e
}
.rall-label{left:12%;color:#752f25}
.accel-label{right:10%;color:#225985}
.status{
  position:absolute;left:50%;bottom:2.5%;z-index:5;
  transform:translateX(-50%);
  padding:6px 12px;border-radius:999px;
  background:rgba(20,20,20,.86);color:white;
  border:1px solid rgba(255,244,220,.65);
  white-space:nowrap;
  font:700 clamp(11px,1.2vw,15px) system-ui,sans-serif
}

.controller-wrap{
  background:linear-gradient(#51311d,#2c1a10);
  padding:9px;border-radius:12px;
  box-shadow:0 7px 18px rgba(30,20,12,.26);
  position:sticky;top:8px;
}
.controller{
  background:linear-gradient(var(--panel2),var(--panel));
  border:3px solid #777066;border-radius:11px;
  box-shadow:inset 0 0 0 2px #070808;
  padding:10px;display:grid;grid-template-columns:1fr;gap:10px;
}
.controller section{border-bottom:1px solid #4b4b46;padding-bottom:10px}
.controller section:last-child{border-bottom:0;padding-bottom:0}
.plate{
  text-align:center;background:linear-gradient(#e7dfcf,#b9ad98);
  color:#262019;border:2px solid #62584a;border-radius:3px;
  box-shadow:inset 0 0 0 1px #f8f3e9;
  padding:4px 6px;margin-bottom:7px;
  font-weight:800;letter-spacing:.06em;font-size:13px;
}
.gauge{
  position:relative;width:min(235px,100%);aspect-ratio:1.4/1;margin:auto;
  background:linear-gradient(#e8dfcd,#c6baa6);
  border:5px solid #6b6256;border-radius:50% 50% 22% 22%;
  color:#211d18;box-shadow:inset 0 0 16px rgba(55,45,36,.2)
}
.glabel{position:absolute;font:800 11px system-ui,sans-serif;text-align:center}
.gl1{left:3%;bottom:22%}.gl2{left:10%;top:25%}.gl3{left:50%;top:8%;transform:translateX(-50%)}
.gl4{right:8%;top:25%}.gl5{right:1%;bottom:22%}
.needle{
  position:absolute;left:50%;bottom:22%;
  width:5px;height:43%;background:#d23427;border-radius:5px;
  transform-origin:50% 100%;
  box-shadow:0 0 0 2px #3b2d25;
  transition:transform .2s ease
}
.knob{
  position:absolute;left:50%;bottom:13%;transform:translateX(-50%);
  width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#5a5650,#171716 70%);
  border:4px solid #090909;box-shadow:inset 0 0 0 3px #5b564f
}
.throttle-box{
  position:relative;height:210px;width:140px;margin:auto;
  background:linear-gradient(90deg,#aaa08d,#ded6c7,#aaa08d);
  border:3px solid #4f473e;border-radius:12px;
  box-shadow:inset 0 0 0 2px #f5efe3
}
.slot{
  position:absolute;left:50%;top:18px;bottom:18px;width:28px;
  transform:translateX(-50%);
  background:#161616;border:4px solid #5c554a;border-radius:18px
}
.throttle{
  position:absolute;left:50%;top:50%;width:165px;
  transform:translate(-50%,-50%) rotate(-90deg);
  accent-color:#252525
}
.marks{
  position:absolute;left:8px;top:18px;bottom:18px;
  display:flex;flex-direction:column;justify-content:space-between;
  font:800 11px system-ui,sans-serif;color:#43392f
}
.marks span:nth-child(1){color:#b53b2c}
.marks span:nth-child(2){color:#a67723}
.marks span:nth-child(3){color:#377d3c}
.marks span:nth-child(4){color:#2c608d}
.marks span:nth-child(5){color:#55418d}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{
  appearance:none;border:3px solid #080808;border-radius:50%;aspect-ratio:1;
  font:800 14px system-ui,sans-serif;color:white;text-shadow:0 1px 2px #000;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.08),0 4px 0 #070707;
  cursor:pointer
}
.go{background:radial-gradient(circle at 35% 30%,#73eb7e,#19892a 55%,#0e4d17)}
.stop{background:radial-gradient(circle at 35% 30%,#ff7b6b,#bb2b21 55%,#66150f)}
.readout{
  margin-top:7px;text-align:center;color:#f0ddb5;
  font:800 13px system-ui,sans-serif;min-height:20px
}
.whistlebtn,.fullbtn{
  width:100%;margin-top:7px;appearance:none;
  border:2px solid #090909;border-radius:8px;
  padding:8px 9px;font:800 12px system-ui,sans-serif;
  letter-spacing:.05em;cursor:pointer;box-shadow:0 3px 0 #080808
}
.whistlebtn{background:linear-gradient(#c94a36,#8e261b);color:#fff2d2}
.fullbtn{background:linear-gradient(#4a4c4d,#202223);color:#ead7ad}

@media(max-width:900px){
  .main-layout{grid-template-columns:minmax(0,1fr) 290px;gap:8px}
  .controller-wrap{padding:7px}
  .gauge{width:min(205px,100%)}
}

/* iPhone / narrow portrait */
@media(max-width:700px){
  body{padding:5px}
  header{margin-bottom:5px}
  h1{font-size:clamp(22px,7vw,30px)}
  .subtitle{font-size:11px}
  .main-layout{display:flex;flex-direction:column;gap:7px}
  .scene{width:100%;border-width:7px}
  .controller-wrap{position:static;width:100%;padding:6px}
  .controller{
    grid-template-columns:1fr 1fr;
    gap:6px;padding:6px;
  }
  .controller section:nth-child(3){grid-column:1/-1}
  .plate{font-size:10px;margin-bottom:4px}
  .gauge{width:min(155px,100%)}
  .glabel{font-size:8px}
  .knob{width:38px;height:38px}
  .throttle-box{height:145px;width:105px}
  .throttle{width:112px}
  .marks{font-size:9px}
  .buttons{max-width:260px;margin:auto}
  .bigbtn{font-size:12px}
  .whistlebtn,.fullbtn{font-size:11px;padding:7px 6px}
  .grade-label{font-size:10px;padding:4px 7px}
  .status{font-size:10px;padding:4px 8px}
}

@media(max-width:430px){
  .gauge{width:145px}
  .controller{gap:5px}
}

:fullscreen body{padding:5px}
:fullscreen .app{max-width:none}
:fullscreen .main-layout{
  grid-template-columns:minmax(0,1fr) 340px;
  height:calc(100vh - 55px)
}
:fullscreen .scene{
  height:100%;width:auto;max-width:100%;justify-self:center
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>The Little Engine That Could</h1>
    <p class="subtitle">Tempo Mountain Railway</p>
  </header>

  <div class="main-layout">
    <div class="scene">
      <img class="scene-bg" src="assets/train-table-background.png" alt="Realistic model railway table">
      <div class="grade-label rall-label">RALLENTANDO<small>up the mountain</small></div>
      <div class="grade-label accel-label">ACCELERANDO<small>down the mountain</small></div>
      <div id="status" class="status">Andante</div>

      <div class="train-layer" aria-hidden="true">
        <img id="car0" class="car engine" src="assets/train-1.png" alt="">
        <img id="car1" class="car coal" src="assets/train-2.png" alt="">
        <img id="car2" class="car logs" src="assets/train-3.png" alt="">
        <img id="car3" class="car boxcar" src="assets/train-4.png" alt="">
      </div>

      <svg width="0" height="0" viewBox="0 0 1448 1086" aria-hidden="true"
           style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
        <path id="motionPath"
          d="M 824 958
             C 650 960, 438 960, 255 956
             C 165 954, 116 930, 91 877
             C 72 835, 69 751, 70 652
             C 71 557, 74 462, 84 394
             C 94 326, 118 271, 161 240
             C 205 208, 252 211, 299 232
             C 342 251, 382 278, 428 281
             C 474 284, 514 263, 551 237
             C 589 211, 624 188, 668 176
             C 713 164, 759 170, 804 189
             C 849 208, 889 238, 931 267
             C 975 298, 1025 325, 1082 333
             C 1144 342, 1213 329, 1273 347
             C 1325 363, 1360 399, 1377 447
             C 1395 498, 1393 582, 1389 670
             C 1386 759, 1377 835, 1351 884
             C 1324 935, 1267 955, 1178 958
             C 1065 961, 948 959, 824 958 Z"
          fill="none"/>
      </svg>
    </div>

    <div class="controller-wrap">
      <div class="controller">
        <section>
          <div class="plate">TEMPO</div>
          <div class="gauge">
            <div class="glabel gl1">LARGO</div>
            <div class="glabel gl2">ADAGIO</div>
            <div class="glabel gl3">ANDANTE</div>
            <div class="glabel gl4">ALLEGRO</div>
            <div class="glabel gl5">PRESTO</div>
            <div id="needle" class="needle"></div>
            <div class="knob"></div>
          </div>
        </section>

        <section>
          <div class="plate">THROTTLE</div>
          <div class="throttle-box">
            <div class="slot"></div>
            <div class="marks">
              <span>PRESTO</span><span>ALLEGRO</span><span>ANDANTE</span><span>ADAGIO</span><span>LARGO</span>
            </div>
            <input id="throttle" class="throttle" type="range" min="0" max="4" step="1" value="2" aria-label="Tempo throttle">
          </div>
        </section>

        <section>
          <div class="plate">TRAIN CONTROL</div>
          <div class="buttons">
            <button id="goBtn" class="bigbtn go" type="button">GO</button>
            <button id="stopBtn" class="bigbtn stop" type="button">STOP</button>
          </div>
          <div id="readout" class="readout">Andante</div>
          <button id="whistleBtn" class="whistlebtn" type="button">WHISTLE</button>
          <button id="fullBtn" class="fullbtn" type="button">FULL SCREEN</button>
        </section>
      </div>
    </div>
  </div>
</div>

<audio id="whistleAudio" preload="auto" src="assets/train-whistle.mp3"></audio>

<script>
(() => {
  const tempos = [
    {name:'Largo', speed:18},
    {name:'Adagio', speed:44},
    {name:'Andante', speed:82},
    {name:'Allegro', speed:155},
    {name:'Presto', speed:420}
  ];

  const path = document.getElementById('motionPath');
  const cars = [0,1,2,3].map(i => document.getElementById('car'+i));
  const throttle = document.getElementById('throttle');
  const needle = document.getElementById('needle');
  const status = document.getElementById('status');
  const readout = document.getElementById('readout');
  const whistleBtn = document.getElementById('whistleBtn');
  const whistleAudio = document.getElementById('whistleAudio');
  const fullBtn = document.getElementById('fullBtn');

  const pathLen = path.getTotalLength();
  const gaps = [0,67,124,190];
  const needleAngles = [-68,-34,0,34,68];

  let tempoIndex = 2;
  let headDist = 0;
  let running = false;
  let motionState = 'stopped';
  let driveFactor = 0;
  let last = performance.now();

  function base(){ return tempos[tempoIndex]; }

  function pointAt(d){
    d = ((d % pathLen) + pathLen) % pathLen;
    return path.getPointAtLength(d);
  }

  function placeCar(group,d){
    const p = pointAt(d);
    const before = pointAt(d-3);
    const after = pointAt(d+3);
    const angle = Math.atan2(after.y-before.y,after.x-before.x)*180/Math.PI;
    group.style.left = (p.x/1448*100)+'%';
    group.style.top = (p.y/1086*100)+'%';
    group.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;
  }

  function placeTrain(){
    cars.forEach((car,i)=>placeCar(car,headDist-gaps[i]));
  }

  function mountainFactor(p){
    if(p.y<320 && p.x>=190 && p.x<700){
      let u=(p.x-190)/(700-190);
      u=Math.max(0,Math.min(1,u));
      const smooth=u*u*(3-2*u);
      status.textContent='Rallentando';
      return 1-0.955*smooth;
    }
    if(p.y<360 && p.x>=700 && p.x<=1140){
      let u=(p.x-700)/(1140-700);
      u=Math.max(0,Math.min(1,u));
      const smooth=u*u*(3-2*u);
      status.textContent='Accelerando';
      return 0.045+0.955*smooth;
    }
    status.textContent=base().name;
    return 1;
  }

  function updateControls(){
    throttle.value=tempoIndex;
    needle.style.transform=`translateX(-50%) rotate(${needleAngles[tempoIndex]}deg)`;
    if(motionState==='stopped') readout.textContent=base().name;
  }

  throttle.addEventListener('input',()=>{
    tempoIndex=Number(throttle.value);
    updateControls();
    if(motionState==='running') readout.textContent=base().name;
  });

  document.getElementById('goBtn').addEventListener('click',()=>{
    if(motionState==='stopped'||motionState==='stopping'){
      motionState='starting';
      running=true;
      readout.textContent='Accelerando';
    }
  });

  document.getElementById('stopBtn').addEventListener('click',()=>{
    if(motionState!=='stopped'){
      motionState='stopping';
      running=true;
      readout.textContent='Rallentando';
    }
  });

  whistleBtn.addEventListener('click',()=>{
    whistleAudio.pause();
    whistleAudio.currentTime=0;
    whistleAudio.play().catch(()=>{});
  });

  fullBtn.addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  });

  document.addEventListener('fullscreenchange',()=>{
    fullBtn.textContent=document.fullscreenElement?'EXIT FULL SCREEN':'FULL SCREEN';
  });

  function frame(now){
    const dt=Math.min(.04,(now-last)/1000);
    last=now;

    if(motionState==='starting'){
      driveFactor=Math.min(1,driveFactor+dt*.34);
      readout.textContent='Accelerando';
      if(driveFactor>=1){
        driveFactor=1;
        motionState='running';
        readout.textContent=base().name;
      }
    }else if(motionState==='stopping'){
      driveFactor=Math.max(0,driveFactor-dt*.30);
      readout.textContent='Rallentando';
      if(driveFactor<=0){
        driveFactor=0;
        motionState='stopped';
        running=false;
        status.textContent='Stopped';
        readout.textContent=base().name;
      }
    }

    if(running && driveFactor>0){
      const headPoint=pointAt(headDist);
      const terrain=mountainFactor(headPoint);
      const effectiveSpeed=base().speed*terrain*driveFactor;
      headDist=(headDist+dt*effectiveSpeed*.82)%pathLen;
      placeTrain();
    }

    requestAnimationFrame(frame);
  }

  updateControls();
  placeTrain();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
