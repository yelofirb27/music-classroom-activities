<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firefly Rhythms</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010304;
    font-family: Arial, Helvetica, sans-serif;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(circle at 52% 65%, rgba(9,18,23,.30), transparent 42%),
      linear-gradient(#010304 0%, #020507 62%, #010302 100%);
  }

  /* Tiny, very faint stationary stars. */
  .stars,
  .stars::before,
  .stars::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
  }
  .stars {
    opacity: .30;
    background-image:
      radial-gradient(circle at 8% 11%, rgba(225,235,220,.40) 0 1px, transparent 1.2px),
      radial-gradient(circle at 16% 28%, rgba(225,235,220,.28) 0 1px, transparent 1.2px),
      radial-gradient(circle at 24% 14%, rgba(225,235,220,.35) 0 1px, transparent 1.2px),
      radial-gradient(circle at 31% 34%, rgba(225,235,220,.20) 0 1px, transparent 1.2px),
      radial-gradient(circle at 39% 18%, rgba(225,235,220,.28) 0 1px, transparent 1.2px),
      radial-gradient(circle at 47% 10%, rgba(225,235,220,.34) 0 1px, transparent 1.2px),
      radial-gradient(circle at 55% 30%, rgba(225,235,220,.20) 0 1px, transparent 1.2px),
      radial-gradient(circle at 64% 16%, rgba(225,235,220,.32) 0 1px, transparent 1.2px),
      radial-gradient(circle at 72% 37%, rgba(225,235,220,.24) 0 1px, transparent 1.2px),
      radial-gradient(circle at 79% 13%, rgba(225,235,220,.34) 0 1px, transparent 1.2px),
      radial-gradient(circle at 88% 26%, rgba(225,235,220,.22) 0 1px, transparent 1.2px),
      radial-gradient(circle at 95% 9%, rgba(225,235,220,.28) 0 1px, transparent 1.2px),
      radial-gradient(circle at 12% 42%, rgba(225,235,220,.18) 0 1px, transparent 1.2px),
      radial-gradient(circle at 43% 42%, rgba(225,235,220,.18) 0 1px, transparent 1.2px),
      radial-gradient(circle at 68% 45%, rgba(225,235,220,.18) 0 1px, transparent 1.2px),
      radial-gradient(circle at 91% 44%, rgba(225,235,220,.16) 0 1px, transparent 1.2px);
  }

  /* Barely-there distant tree line. */
  .tree-line {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 10%;
    height: 8%;
    opacity: .18;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 5% 100%, #07100b 0 32%, transparent 34%),
      radial-gradient(ellipse at 13% 100%, #07100b 0 38%, transparent 40%),
      radial-gradient(ellipse at 24% 100%, #06100a 0 29%, transparent 31%),
      radial-gradient(ellipse at 35% 100%, #07100b 0 40%, transparent 42%),
      radial-gradient(ellipse at 47% 100%, #06100a 0 30%, transparent 32%),
      radial-gradient(ellipse at 58% 100%, #07100b 0 37%, transparent 39%),
      radial-gradient(ellipse at 70% 100%, #06100a 0 27%, transparent 29%),
      radial-gradient(ellipse at 81% 100%, #07100b 0 38%, transparent 40%),
      radial-gradient(ellipse at 93% 100%, #06100a 0 32%, transparent 34%),
      linear-gradient(to top, #050b07 0 25%, transparent 26%);
    filter: blur(1px);
  }

  /* Dark stationary foreground plants, kept below the firefly field. */
  .foreground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 18%;
    pointer-events: none;
    opacity: .62;
  }
  .foreground::before,
  .foreground::after {
    content: "";
    position: absolute;
    bottom: -2px;
    width: 34%;
    height: 100%;
    background:
      linear-gradient(76deg, transparent 45%, #061008 46% 48%, transparent 49%) 0 100% / 38px 100% repeat-x,
      linear-gradient(102deg, transparent 45%, #050d07 46% 48%, transparent 49%) 0 100% / 51px 88% repeat-x,
      linear-gradient(to top, #020603 0 18%, transparent 19%);
  }
  .foreground::before { left: 0; }
  .foreground::after { right: 0; transform: scaleX(-1); }

  .title {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    color: rgba(255,255,230,.92);
    font-weight: 600;
    font-size: clamp(24px, 2.7vw, 38px);
    letter-spacing: .035em;
    text-shadow: 0 2px 14px #000;
    pointer-events: none;
    z-index: 20;
  }

  .tempo-note {
    position: absolute;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,220,.55);
    font-size: 12px;
    letter-spacing: .04em;
    z-index: 20;
    pointer-events: none;
  }

  .controls {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 9px 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.54);
    border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(6px);
    z-index: 30;
  }

  button {
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    background: rgba(255,245,190,.94);
    color: #182000;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }

  .bug {
    --size: 18px;
    position: absolute;
    width: var(--size);
    height: calc(var(--size) * 1.7);
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 1px #000);
    pointer-events: none;
    z-index: 10;
  }

  .bug .body {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 6px;
    height: 12px;
    transform: translate(-50%, -50%);
    background: #0b0906;
    border-radius: 50%;
    box-shadow: 0 -5px 0 -1px #130d08;
    opacity: .12;
    z-index: 3;
    transition: opacity .08s linear;
  }

  .bug .wing {
    position: absolute;
    top: 26%;
    width: 11px;
    height: 6px;
    border-radius: 80% 20% 80% 20%;
    background: rgba(120,130,115,.035);
    border: 1px solid rgba(145,155,138,.03);
    opacity: .12;
    transition: opacity .08s linear;
    z-index: 2;
  }
  .bug .wing.left { left: -1px; transform: rotate(-28deg); }
  .bug .wing.right { right: -1px; transform: scaleX(-1) rotate(-28deg); }

  .bug .lamp {
    position: absolute;
    left: 50%;
    top: 67%;
    width: 7px;
    height: 12px;
    transform: translate(-50%, -50%);
    border-radius: 45% 45% 58% 58%;
    background: #1e1d0d;
    opacity: .035;
    z-index: 4;
    transition: opacity .08s linear, background .08s linear, box-shadow .08s linear, transform .08s linear;
  }

  .bug .halo {
    position: absolute;
    left: 50%;
    top: 68%;
    width: 74px;
    height: 74px;
    transform: translate(-50%, -50%) scale(.55);
    border-radius: 50%;
    opacity: 0;
    background: radial-gradient(circle, rgba(255,255,155,.78) 0%, rgba(230,255,55,.32) 24%, rgba(180,230,0,.08) 47%, rgba(0,0,0,0) 73%);
    filter: blur(1px);
    transition: opacity .08s linear, transform .08s linear;
    z-index: 1;
  }

  .bug.on .body { opacity: .60; }
  .bug.on .wing { opacity: .68; }
  .bug.on .lamp {
    opacity: 1;
    background: #ffff89;
    box-shadow: 0 0 7px #ffff70, 0 0 18px #eaff35, 0 0 36px rgba(210,255,30,.78);
    transform: translate(-50%, -50%) scale(1.08);
  }
  .bug.on .halo { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .label {
    position: absolute;
    left: 50%;
    top: calc(100% + 5px);
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,220,.72);
    text-shadow: 0 1px 4px #000, 0 0 8px #000;
    white-space: nowrap;
    opacity: .74;
  }

  /* Eight widely spaced fireflies. */
  #bug1 { left: 10%; top: 24%; animation: drift1 6.8s ease-in-out infinite alternate; }
  #bug2 { left: 88%; top: 22%; animation: drift2 7.6s ease-in-out -1.4s infinite alternate; }
  #bug3 { left: 28%; top: 58%; animation: drift3 6.1s ease-in-out -2.2s infinite alternate; }
  #bug4 { left: 83%; top: 62%; animation: drift4 8.2s ease-in-out -.7s infinite alternate; }
  #bug5 { left: 53%; top: 39%; animation: drift5 7.1s ease-in-out -1.8s infinite alternate; }
  #bug6 { left: 12%; top: 70%; animation: drift6 8.7s ease-in-out -2.7s infinite alternate; }
  #bug7 { left: 65%; top: 69%; animation: drift7 7.9s ease-in-out -1.1s infinite alternate; }
  #bug8 { left: 50%; top: 24%; animation: drift8 8.4s ease-in-out -2.0s infinite alternate; }

  @keyframes drift1 { 0%{transform:translate(-50%,-50%) translate(-4px,2px) rotate(-2deg)}35%{transform:translate(-50%,-50%) translate(7px,-6px) rotate(2deg)}70%{transform:translate(-50%,-50%) translate(2px,7px) rotate(-1deg)}100%{transform:translate(-50%,-50%) translate(-7px,-3px) rotate(2deg)} }
  @keyframes drift2 { 0%{transform:translate(-50%,-50%) translate(5px,-3px) rotate(2deg)}40%{transform:translate(-50%,-50%) translate(-6px,5px) rotate(-2deg)}75%{transform:translate(-50%,-50%) translate(8px,3px) rotate(1deg)}100%{transform:translate(-50%,-50%) translate(-3px,-7px) rotate(-1deg)} }
  @keyframes drift3 { 0%{transform:translate(-50%,-50%) translate(-5px,-4px) rotate(-1deg)}30%{transform:translate(-50%,-50%) translate(4px,7px) rotate(2deg)}65%{transform:translate(-50%,-50%) translate(8px,-2px) rotate(-2deg)}100%{transform:translate(-50%,-50%) translate(-4px,5px) rotate(1deg)} }
  @keyframes drift4 { 0%{transform:translate(-50%,-50%) translate(4px,5px) rotate(1deg)}35%{transform:translate(-50%,-50%) translate(-7px,-3px) rotate(-2deg)}70%{transform:translate(-50%,-50%) translate(3px,-8px) rotate(2deg)}100%{transform:translate(-50%,-50%) translate(7px,4px) rotate(-1deg)} }
  @keyframes drift5 { 0%{transform:translate(-50%,-50%) translate(-3px,4px) rotate(1deg)}38%{transform:translate(-50%,-50%) translate(6px,-5px) rotate(-2deg)}72%{transform:translate(-50%,-50%) translate(-5px,-2px) rotate(2deg)}100%{transform:translate(-50%,-50%) translate(7px,5px) rotate(-1deg)} }
  @keyframes drift6 { 0%{transform:translate(-50%,-50%) translate(6px,2px) rotate(-1deg)}33%{transform:translate(-50%,-50%) translate(-4px,-7px) rotate(2deg)}68%{transform:translate(-50%,-50%) translate(-7px,4px) rotate(-2deg)}100%{transform:translate(-50%,-50%) translate(4px,6px) rotate(1deg)} }
  @keyframes drift7 { 0%{transform:translate(-50%,-50%) translate(-5px,3px) rotate(2deg)}32%{transform:translate(-50%,-50%) translate(5px,-6px) rotate(-1deg)}66%{transform:translate(-50%,-50%) translate(7px,5px) rotate(1deg)}100%{transform:translate(-50%,-50%) translate(-6px,-2px) rotate(-2deg)} }
  @keyframes drift8 { 0%{transform:translate(-50%,-50%) translate(3px,-4px) rotate(-1deg)}34%{transform:translate(-50%,-50%) translate(-6px,5px) rotate(2deg)}69%{transform:translate(-50%,-50%) translate(6px,3px) rotate(-2deg)}100%{transform:translate(-50%,-50%) translate(-3px,-6px) rotate(1deg)} }

  @media (prefers-reduced-motion: reduce) {
    #bug1,#bug2,#bug3,#bug4,#bug5,#bug6,#bug7,#bug8 { animation: none; }
  }

  @media (max-width: 700px) {
    .title { top: 10px; }
    .tempo-note { top: 50px; }
    .controls { bottom: 8px; width: calc(100% - 16px); justify-content: center; flex-wrap: wrap; border-radius: 16px; }
    button { padding: 9px 12px; font-size: 13px; }
    .label { font-size: 9px; }
    #bug1 { left: 10%; top: 22%; }
    #bug2 { left: 88%; top: 23%; }
    #bug3 { left: 24%; top: 53%; }
    #bug4 { left: 83%; top: 56%; }
    #bug5 { left: 53%; top: 36%; }
    #bug6 { left: 12%; top: 66%; }
    #bug7 { left: 63%; top: 67%; }
    #bug8 { left: 50%; top: 20%; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="stars"></div>
  <div class="tree-line"></div>
  <div class="foreground"></div>

  <h1 class="title">Firefly Rhythms</h1>
  <div class="tempo-note">ta = 1 beat · 80 BPM</div>

  <div class="bug" id="bug1" aria-label="Firefly 1: ta-a ta-a">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">ta-a &nbsp; ta-a</div>
  </div>

  <div class="bug" id="bug2" aria-label="Firefly 2: ti-ti ti-ti ti-ti ta ti-ti ti-ti ta rest">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">ti-ti &nbsp; ti-ti &nbsp; ti-ti &nbsp; ta &nbsp; ti-ti &nbsp; ti-ti &nbsp; ta &nbsp; rest</div>
  </div>

  <div class="bug" id="bug3" aria-label="Firefly 3: ti-ti ta ti-ti ta">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">ti-ti &nbsp; ta &nbsp; ti-ti &nbsp; ta</div>
  </div>

  <div class="bug" id="bug4" aria-label="Firefly 4: rest rest rest ta">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">rest &nbsp; rest &nbsp; rest &nbsp; ta</div>
  </div>

  <div class="bug" id="bug5" aria-label="Firefly 5: ta ta ta rest">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">ta &nbsp; ta &nbsp; ta &nbsp; rest</div>
  </div>

  <div class="bug" id="bug6" aria-label="Firefly 6: ta-a ta ti-ti">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">ta-a &nbsp; ta &nbsp; ti-ti</div>
  </div>

  <div class="bug" id="bug7" aria-label="Firefly 7: ta rest ta rest">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">ta &nbsp; rest &nbsp; ta &nbsp; rest</div>
  </div>


  <div class="bug" id="bug8" aria-label="Firefly 8: ta-a-a-a">
    <div class="halo"></div><div class="wing left"></div><div class="wing right"></div><div class="body"></div><div class="lamp"></div>
    <div class="label">ta-a-a-a</div>
  </div>

  <div class="controls">
    <button id="soloBtn">Lonely Firefly</button>
    <button id="groupBtn">Whole Group</button>
    <button id="stopBtn">Stop</button>
    <button id="hideRhythmsBtn" aria-pressed="true">Show Rhythms</button>
  </div>
</div>

<script>
(() => {
  const bugs = {
    b1: document.getElementById('bug1'),
    b2: document.getElementById('bug2'),
    b3: document.getElementById('bug3'),
    b4: document.getElementById('bug4'),
    b5: document.getElementById('bug5'),
    b6: document.getElementById('bug6'),
    b7: document.getElementById('bug7'),
    b8: document.getElementById('bug8')
  };

  const GAP = 0.10;
  const patterns = {
    // Firefly 1: ta-a ta-a
    b1: [
      ['on',2-GAP],['off',GAP],
      ['on',2-GAP],['off',GAP]
    ],

    // Firefly 2: ti-ti ti-ti ti-ti ta ti-ti ti-ti ta rest
    b2: [
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP],
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP],
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP],
      ['on',1-GAP],['off',GAP],
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP],
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP],
      ['on',1-GAP],['off',GAP],
      ['off',1]
    ],

    // Firefly 3: ti-ti ta ti-ti ta
    b3: [
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP],
      ['on',1-GAP],['off',GAP],
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP],
      ['on',1-GAP],['off',GAP]
    ],

    // Firefly 4: rest rest rest ta
    b4: [
      ['off',1],['off',1],['off',1],
      ['on',1-GAP],['off',GAP]
    ],

    // Firefly 5: ta ta ta rest
    b5: [
      ['on',1-GAP],['off',GAP],
      ['on',1-GAP],['off',GAP],
      ['on',1-GAP],['off',GAP],
      ['off',1]
    ],

    // Firefly 6: ta-a ta ti-ti
    b6: [
      ['on',2-GAP],['off',GAP],
      ['on',1-GAP],['off',GAP],
      ['on',.5-GAP],['off',GAP],['on',.5-GAP],['off',GAP]
    ],

    // Firefly 7: ta rest ta rest
    b7: [
      ['on',1-GAP],['off',GAP],
      ['off',1],
      ['on',1-GAP],['off',GAP],
      ['off',1]
    ],

    // Firefly 8: ta-a-a-a (4 beats)
    b8: [
      ['on',4-GAP],['off',GAP]
    ]
  };

  const bpm = 80;
  let running = false;
  let generation = 0;
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function runPattern(name, startGeneration) {
    const el = bugs[name];
    const pattern = patterns[name];
    while (running && generation === startGeneration) {
      for (const [state, beats] of pattern) {
        if (!running || generation !== startGeneration) break;
        el.classList.toggle('on', state === 'on');
        await sleep(beats * (60000 / bpm));
      }
    }
    el.classList.remove('on');
  }

  function stop() {
    running = false;
    generation++;
    Object.values(bugs).forEach(el => el.classList.remove('on'));
  }

  function startNames(names) {
    stop();
    running = true;
    const g = generation;
    names.forEach(name => runPattern(name, g));
  }

  document.getElementById('soloBtn').addEventListener('click', () => {
    startNames(['b8']);
  });

  document.getElementById('groupBtn').addEventListener('click', () => {
    startNames(Object.keys(patterns));
  });

  document.getElementById('stopBtn').addEventListener('click', stop);

  const hideRhythmsBtn = document.getElementById('hideRhythmsBtn');
  let rhythmsHidden = true;
  document.querySelectorAll('.label').forEach(label => {
    label.style.display = 'none';
  });

  hideRhythmsBtn.addEventListener('click', () => {
    rhythmsHidden = !rhythmsHidden;
    document.querySelectorAll('.label').forEach(label => {
      label.style.display = rhythmsHidden ? 'none' : '';
    });
    hideRhythmsBtn.textContent = rhythmsHidden ? 'Show Rhythms' : 'Hide Rhythms';
    hideRhythmsBtn.setAttribute('aria-pressed', String(rhythmsHidden));
  });

  // Opening state: every firefly stopped, dark, and rhythm labels hidden.
  stop();
})();
</script>
</body>
</html>
