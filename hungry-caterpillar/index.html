<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Very Hungry Caterpillar Rhythm</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
  }

  body {
    user-select: none;
    -webkit-user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #fff url("assets/background.png") center center / contain no-repeat;
    overflow: hidden;
  }

  /* This inner canvas always matches the exact 16:9 proportions of the background PNG. */
  .canvas {
    position: absolute;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .basket-hotspot {
    position: absolute;
    left: 1.5%;
    top: .5%;
    width: 33.5%;
    height: 46.5%;
    cursor: pointer;
    border-radius: 18px;
  }

  .basket-hotspot:hover::after {
    content: "Click to choose a food";
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(255,255,255,.94);
    border: 1.5px solid #111;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: clamp(11px, 1vw, 17px);
    font-weight: 700;
    pointer-events: none;
  }

  .plate-slot {
    position: absolute;
    width: 20.9%;
    height: 37.3%;
    border-radius: 50%;
    cursor: pointer;
  }

  .plate-slot[data-i="0"] { left: 1.75%; top: 58.4%; }
  .plate-slot[data-i="1"] { left: 26.8%; top: 58.4%; }
  .plate-slot[data-i="2"] { left: 51.8%; top: 58.4%; }
  .plate-slot[data-i="3"] { left: 76.8%; top: 58.4%; }

  .plate-slot.has-food:hover::after {
    content: "Click to remove";
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(255,255,255,.94);
    border: 1px solid #111;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: clamp(9px, .8vw, 14px);
    z-index: 10;
  }

  /* The selected item appears on a small white vocabulary card on the plate. */
  .plate-card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 68%;
    height: 72%;
    transform: translate(-50%, -50%);
    background: #fff;
    border: 2px solid #222;
    border-radius: 10px;
    box-shadow: 0 5px 11px rgba(0,0,0,.22);
    padding: 5% 5% 4%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .plate-card img {
    width: 100%;
    height: 77%;
    object-fit: contain;
  }

  .plate-card .label {
    width: 100%;
    text-align: center;
    font-size: clamp(10px, 1.05vw, 18px);
    line-height: 1.02;
    font-weight: 700;
    color: #111;
    padding-top: 2px;
  }

  .reset {
    position: absolute;
    right: 1.7%;
    top: 50.6%;
    z-index: 20;
    border: 2px solid #111;
    border-radius: 10px;
    background: rgba(255,255,255,.96);
    padding: 7px 14px;
    font-size: clamp(12px, 1.05vw, 18px);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .reset:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  .chooser-backdrop {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.24);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .chooser-backdrop.open { display: flex; }

  .chooser {
    width: 91%;
    background: rgba(255,250,240,.985);
    border: 3px solid #111;
    border-radius: 22px;
    padding: 1.25% 1.4% 1.1%;
    box-shadow: 0 18px 45px rgba(0,0,0,.35);
  }

  .chooser-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 1%;
  }

  .chooser-title {
    font-size: clamp(19px, 1.8vw, 31px);
    font-weight: 800;
  }

  .chooser-sub {
    font-size: clamp(12px, 1vw, 17px);
    font-weight: 600;
  }

  .close {
    border: 2px solid #111;
    background: #fff;
    border-radius: 9px;
    padding: 6px 11px;
    font-size: clamp(12px, .95vw, 16px);
    font-weight: 800;
    cursor: pointer;
  }

  /* All 14 options visible at once: two rows of seven cards. */
  .food-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 9px;
  }

  .food-choice {
    min-width: 0;
    aspect-ratio: .86 / 1;
    border: 2px solid #222;
    border-radius: 11px;
    background: #fff;
    padding: 5px 5px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }

  .food-choice:hover {
    transform: translateY(-3px) scale(1.025);
    box-shadow: 0 7px 14px rgba(0,0,0,.17);
  }

  .food-choice img {
    width: 100%;
    height: 78%;
    object-fit: contain;
    pointer-events: none;
  }

  .food-choice span {
    width: 100%;
    text-align: center;
    font-size: clamp(9px, .78vw, 13px);
    line-height: 1.02;
    font-weight: 700;
    color: #111;
    pointer-events: none;
  }

  .next-plate {
    margin-top: 8px;
    text-align: center;
    font-size: clamp(11px, .95vw, 16px);
    font-weight: 700;
  }

  @media (max-aspect-ratio: 4/3) {
    .chooser { width: 94%; }
    .food-grid { gap: 6px; }
    .food-choice span { font-size: clamp(8px, .9vw, 12px); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="canvas">
    <div class="basket-hotspot" id="basketHotspot" aria-label="Open the food basket"></div>

    <div class="plate-slot" data-i="0"></div>
    <div class="plate-slot" data-i="1"></div>
    <div class="plate-slot" data-i="2"></div>
    <div class="plate-slot" data-i="3"></div>

    <button class="reset" id="resetBtn" type="button">RESET</button>

    <div class="chooser-backdrop" id="chooserBackdrop">
      <div class="chooser" role="dialog" aria-modal="true" aria-label="Choose a food">
        <div class="chooser-head">
          <div>
            <div class="chooser-title">Choose a food</div>
            <div class="chooser-sub">Click one card. You may choose the same food more than once.</div>
          </div>
          <button class="close" id="closeChooser" type="button">CLOSE</button>
        </div>

        <div class="food-grid" id="foodGrid"></div>
        <div class="next-plate" id="nextPlateText"></div>
      </div>
    </div>
  </div>
</div>

<script>
const foods = [
  ["Apple", "assets/apple.png"],
  ["Cherry Pie", "assets/cherry-pie.png"],
  ["Chocolate Cake", "assets/chocolate-cake.png"],
  ["Cupcake", "assets/cupcake.png"],
  ["Ice Cream Cone", "assets/ice-cream-cone.png"],
  ["Leaf", "assets/leaf.png"],
  ["Lollipop", "assets/lollipop.png"],
  ["Orange", "assets/orange.png"],
  ["Pear", "assets/pear.png"],
  ["Pickle", "assets/pickle.png"],
  ["Plum", "assets/plum.png"],
  ["Sausage", "assets/sausage.png"],
  ["Swiss Cheese", "assets/swiss-cheese.png"],
  ["Watermelon", "assets/watermelon.png"]
];

const basket = document.getElementById("basketHotspot");
const chooserBackdrop = document.getElementById("chooserBackdrop");
const closeChooser = document.getElementById("closeChooser");
const foodGrid = document.getElementById("foodGrid");
const plates = [...document.querySelectorAll(".plate-slot")];
const resetBtn = document.getElementById("resetBtn");
const nextPlateText = document.getElementById("nextPlateText");

function firstEmptyPlateIndex() {
  return plates.findIndex(p => !p.querySelector(".plate-card"));
}

function updateNextPlateText() {
  const i = firstEmptyPlateIndex();
  if (i === -1) {
    nextPlateText.textContent =
      "All four plates are filled. Click a plate to remove its card if you want to change it.";
  } else {
    nextPlateText.textContent = `This choice will go on plate ${i + 1}.`;
  }
}

function openChooser() {
  updateNextPlateText();
  chooserBackdrop.classList.add("open");
}

function hideChooser() {
  chooserBackdrop.classList.remove("open");
}

function addCardToPlate(plate, label, src) {
  const existing = plate.querySelector(".plate-card");
  if (existing) existing.remove();

  const card = document.createElement("div");
  card.className = "plate-card";
  card.innerHTML = `
    <img src="${src}" alt="${label}">
    <div class="label">${label}</div>
  `;
  plate.appendChild(card);
  plate.classList.add("has-food");
}

basket.addEventListener("click", openChooser);
closeChooser.addEventListener("click", hideChooser);

chooserBackdrop.addEventListener("click", e => {
  if (e.target === chooserBackdrop) hideChooser();
});

foods.forEach(([label, src]) => {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "food-choice";
  card.innerHTML = `
    <img src="${src}" alt="${label}">
    <span>${label}</span>
  `;

  card.addEventListener("click", () => {
    const targetIndex = firstEmptyPlateIndex();

    if (targetIndex === -1) {
      hideChooser();
      return;
    }

    addCardToPlate(plates[targetIndex], label, src);
    hideChooser();
  });

  foodGrid.appendChild(card);
});

plates.forEach(plate => {
  plate.addEventListener("click", () => {
    const card = plate.querySelector(".plate-card");
    if (card) {
      card.remove();
      plate.classList.remove("has-food");
    }
  });
});

resetBtn.addEventListener("click", () => {
  plates.forEach(plate => {
    const card = plate.querySelector(".plate-card");
    if (card) card.remove();
    plate.classList.remove("has-food");
  });
  hideChooser();
});
</script>
</body>
</html>
