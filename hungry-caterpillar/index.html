<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Very Hungry Caterpillar Rhythm</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
  }

  body {
    user-select: none;
    -webkit-user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-image: url("assets/background.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: contain;
    background-color: #fff;
    overflow: hidden;
  }

  /* Everything is positioned relative to the 16:9 background. */
  .canvas {
    position: absolute;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .basket-hotspot {
    position: absolute;
    left: 1.8%;
    top: 1.1%;
    width: 33.5%;
    height: 45.5%;
    cursor: pointer;
    border-radius: 18px;
  }

  .basket-hotspot:hover::after {
    content: "Click to choose food";
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(255,255,255,.92);
    border: 1.5px solid #111;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: clamp(12px, 1.1vw, 18px);
    font-weight: 700;
    pointer-events: none;
  }

  .plate-slot {
    position: absolute;
    width: 20.9%;
    height: 37.3%;
    border-radius: 50%;
    cursor: pointer;
  }

  .plate-slot[data-i="0"] { left: 1.75%; top: 58.4%; }
  .plate-slot[data-i="1"] { left: 26.8%; top: 58.4%; }
  .plate-slot[data-i="2"] { left: 51.8%; top: 58.4%; }
  .plate-slot[data-i="3"] { left: 76.8%; top: 58.4%; }

  .plate-slot.has-food:hover::after {
    content: "Click to remove";
    position: absolute;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(255,255,255,.9);
    border: 1px solid #111;
    border-radius: 999px;
    padding: 4px 9px;
    font-size: clamp(10px, .9vw, 15px);
    z-index: 5;
  }

  .placed-food {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.25));
  }

  .reset {
    position: absolute;
    right: 1.6%;
    top: 50.5%;
    z-index: 20;
    border: 2px solid #111;
    border-radius: 10px;
    background: rgba(255,255,255,.94);
    padding: 8px 15px;
    font-size: clamp(13px, 1.15vw, 19px);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .reset:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  .chooser-backdrop {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.22);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .chooser-backdrop.open { display: flex; }

  .chooser {
    width: 88%;
    max-height: 79%;
    background: rgba(255,250,240,.98);
    border: 3px solid #111;
    border-radius: 24px;
    padding: 1.5% 1.5% 1.2%;
    box-shadow: 0 18px 45px rgba(0,0,0,.35);
  }

  .chooser-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 1.2%;
  }

  .chooser-title {
    font-size: clamp(20px, 2vw, 34px);
    font-weight: 800;
  }

  .chooser-sub {
    font-size: clamp(13px, 1.1vw, 18px);
    font-weight: 600;
  }

  .close {
    border: 2px solid #111;
    background: #fff;
    border-radius: 10px;
    padding: 7px 12px;
    font-size: clamp(13px, 1vw, 17px);
    font-weight: 800;
    cursor: pointer;
  }

  .food-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }

  .food-choice {
    min-width: 0;
    aspect-ratio: 1 / 1;
    border: 2px solid rgba(0,0,0,.45);
    border-radius: 14px;
    background: #fff;
    padding: 5px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .food-choice:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 7px 14px rgba(0,0,0,.16);
  }

  .food-choice img {
    width: 76%;
    height: 72%;
    object-fit: contain;
    pointer-events: none;
  }

  .food-choice span {
    display: block;
    width: 100%;
    text-align: center;
    font-size: clamp(9px, .8vw, 14px);
    line-height: 1.05;
    font-weight: 700;
    pointer-events: none;
  }

  .next-plate {
    margin-top: 10px;
    text-align: center;
    font-size: clamp(12px, 1vw, 17px);
    font-weight: 700;
  }

  @media (max-width: 850px) {
    .food-grid { grid-template-columns: repeat(5, 1fr); }
    .chooser { max-height: 86%; overflow: auto; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="canvas">
    <div class="basket-hotspot" id="basketHotspot" aria-label="Choose a food from the basket"></div>

    <div class="plate-slot" data-i="0"></div>
    <div class="plate-slot" data-i="1"></div>
    <div class="plate-slot" data-i="2"></div>
    <div class="plate-slot" data-i="3"></div>

    <button class="reset" id="resetBtn" type="button">RESET</button>

    <div class="chooser-backdrop" id="chooserBackdrop">
      <div class="chooser" role="dialog" aria-modal="true" aria-label="Choose a food">
        <div class="chooser-head">
          <div>
            <div class="chooser-title">Choose a food</div>
            <div class="chooser-sub">Pick one food for the next plate. Foods may be used more than once.</div>
          </div>
          <button class="close" id="closeChooser" type="button">CLOSE</button>
        </div>
        <div class="food-grid" id="foodGrid"></div>
        <div class="next-plate" id="nextPlateText"></div>
      </div>
    </div>
  </div>
</div>

<script>
const foods = [
  ["Apple", "assets/apple.png"],
  ["Pear", "assets/pear.png"],
  ["Plum", "assets/plum.png"],
  ["Orange", "assets/orange.png"],
  ["Cupcake", "assets/cupcake.png"],
  ["Ice Cream", "assets/ice-cream.png"],
  ["Pickle", "assets/pickle.png"],
  ["Swiss Cheese", "assets/cheese.png"],
  ["Lollipop", "assets/lollipop.png"],
  ["Cherry Pie", "assets/cherry-pie.png"],
  ["Sausage", "assets/sausage.png"],
  ["Chocolate Cake", "assets/chocolate-cake.png"],
  ["Watermelon", "assets/watermelon.png"],
  ["Leaf", "assets/leaf.png"]
];

const basket = document.getElementById("basketHotspot");
const chooserBackdrop = document.getElementById("chooserBackdrop");
const closeChooser = document.getElementById("closeChooser");
const foodGrid = document.getElementById("foodGrid");
const plates = [...document.querySelectorAll(".plate-slot")];
const resetBtn = document.getElementById("resetBtn");
const nextPlateText = document.getElementById("nextPlateText");

function firstEmptyPlateIndex() {
  return plates.findIndex(p => !p.querySelector(".placed-food"));
}

function updateNextPlateText() {
  const i = firstEmptyPlateIndex();
  if (i === -1) {
    nextPlateText.textContent = "All four plates are filled. Click a plate to remove its food if you want to change it.";
  } else {
    nextPlateText.textContent = `Your next choice will go on plate ${i + 1}.`;
  }
}

function openChooser() {
  updateNextPlateText();
  chooserBackdrop.classList.add("open");
}

function hideChooser() {
  chooserBackdrop.classList.remove("open");
}

basket.addEventListener("click", openChooser);
closeChooser.addEventListener("click", hideChooser);

chooserBackdrop.addEventListener("click", (e) => {
  if (e.target === chooserBackdrop) hideChooser();
});

foods.forEach(([label, src]) => {
  const card = document.createElement("button");
  card.className = "food-choice";
  card.type = "button";
  card.innerHTML = `<img src="${src}" alt="${label}"><span>${label}</span>`;
  card.addEventListener("click", () => {
    const targetIndex = firstEmptyPlateIndex();

    if (targetIndex === -1) {
      hideChooser();
      return;
    }

    const plate = plates[targetIndex];
    const img = document.createElement("img");
    img.className = "placed-food";
    img.src = src;
    img.alt = label;
    img.dataset.label = label;
    plate.appendChild(img);
    plate.classList.add("has-food");

    // Candy-Rondo-style choice: one selection, then return to the main screen.
    hideChooser();
  });
  foodGrid.appendChild(card);
});

plates.forEach(plate => {
  plate.addEventListener("click", () => {
    const food = plate.querySelector(".placed-food");
    if (food) {
      food.remove();
      plate.classList.remove("has-food");
    }
  });
});

resetBtn.addEventListener("click", () => {
  plates.forEach(plate => {
    const food = plate.querySelector(".placed-food");
    if (food) food.remove();
    plate.classList.remove("has-food");
  });
  hideChooser();
});
</script>
</body>
</html>
