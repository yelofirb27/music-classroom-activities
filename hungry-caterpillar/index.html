<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Very Hungry Caterpillar Rhythm</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    overscroll-behavior: none;
  }

  body {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #ffffff;
    overflow: hidden;
  }

  /* The background and all clickable hotspots share the exact same 16:9 box.
     This keeps everything lined up on iPhone, iPad, Chromebook, and touch displays. */
  .canvas {
    position: absolute;
    width: min(100vw, calc(100dvh * 16 / 9));
    height: min(100dvh, calc(100vw * 9 / 16));
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background:
      #ffffff
      url("assets/background-polished.png")
      center center / 100% 100%
      no-repeat;
    overflow: hidden;
  }

  /* Clickable basket area only */
  .basket-hotspot {
    position: absolute;
    left: 1.5%;
    top: 0.5%;
    width: 33.5%;
    height: 46.5%;
    cursor: pointer;
    border-radius: 18px;
  }

  .basket-hotspot:hover::after {
    content: "Click to choose a food";
    position: absolute;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(255,255,255,.96);
    border: 1.5px solid #111;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: clamp(11px, 1vw, 17px);
    font-weight: 700;
    pointer-events: none;
  }

  /* Plate targets line up with the four plates already in the background */
  .plate-slot {
    position: absolute;
    width: 20.9%;
    height: 37.3%;
    border-radius: 50%;
    cursor: pointer;
  }

  .plate-slot[data-i="0"] { left: 1.75%; top: 58.4%; }
  .plate-slot[data-i="1"] { left: 26.8%; top: 58.4%; }
  .plate-slot[data-i="2"] { left: 51.8%; top: 58.4%; }
  .plate-slot[data-i="3"] { left: 76.8%; top: 58.4%; }

  .plate-slot.has-food:hover::after {
    content: "Click to remove";
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(255,255,255,.95);
    border: 1px solid #111;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: clamp(9px, .8vw, 14px);
    z-index: 10;
  }

  /* White card placed on each plate */
  .plate-card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 68%;
    height: 72%;
    transform: translate(-50%, -50%);
    background: #fff;
    border: 2px solid #222;
    border-radius: 10px;
    box-shadow: 0 5px 11px rgba(0,0,0,.22);
    padding: 5% 5% 4%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .plate-card img {
    width: 100%;
    height: 77%;
    object-fit: contain;
  }

  .plate-card .label {
    width: 100%;
    text-align: center;
    font-size: clamp(10px, 1.05vw, 18px);
    line-height: 1.02;
    font-weight: 700;
    color: #111;
    padding-top: 2px;
  }

  .reset {
    position: absolute;
    right: 1.7%;
    top: 50.6%;
    z-index: 20;
    border: 2px solid #111;
    border-radius: 10px;
    background: rgba(255,255,255,.96);
    padding: 7px 14px;
    font-size: clamp(12px, 1.05vw, 18px);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
  }

  .reset:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  /* Food chooser appears ONLY after clicking the basket */
  .chooser-backdrop {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.24);
    display: none;
    align-items: center;
    justify-content: center;
  }

  .chooser-backdrop.open {
    display: flex;
  }

  .chooser {
    width: 91%;
    background: rgba(255,250,240,.985);
    border: 3px solid #111;
    border-radius: 22px;
    padding: 1.25% 1.4% 1.1%;
    box-shadow: 0 18px 45px rgba(0,0,0,.35);
  }

  .chooser-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 1%;
  }

  .chooser-title {
    font-size: clamp(19px, 1.8vw, 31px);
    font-weight: 800;
  }

  .chooser-sub {
    font-size: clamp(12px, 1vw, 17px);
    font-weight: 600;
  }

  .close {
    border: 2px solid #111;
    background: #fff;
    border-radius: 9px;
    padding: 6px 11px;
    font-size: clamp(12px, .95vw, 16px);
    font-weight: 800;
    cursor: pointer;
  }

  /* 14 foods: two rows of seven, all visible at once */
  .food-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 9px;
  }

  .food-choice {
    min-width: 0;
    aspect-ratio: .86 / 1;
    border: 2px solid #222;
    border-radius: 11px;
    background: #fff;
    padding: 5px 5px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }

  .food-choice:hover {
    transform: translateY(-3px) scale(1.025);
    box-shadow: 0 7px 14px rgba(0,0,0,.17);
  }

  .food-choice img {
    width: 100%;
    height: 78%;
    object-fit: contain;
    pointer-events: none;
  }

  .food-choice span {
    width: 100%;
    text-align: center;
    font-size: clamp(9px, .78vw, 13px);
    line-height: 1.02;
    font-weight: 700;
    color: #111;
    pointer-events: none;
  }

  .next-plate {
    margin-top: 8px;
    text-align: center;
    font-size: clamp(11px, .95vw, 16px);
    font-weight: 700;
  }

  @media (hover: none), (pointer: coarse) {
    .basket-hotspot:hover::after,
    .plate-slot.has-food:hover::after {
      content: none;
    }

    .basket-hotspot,
    .plate-slot,
    .food-choice,
    .reset,
    .close {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .reset,
    .close {
      min-height: 42px;
      min-width: 64px;
    }
  }

  .rotate-message {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #fffaf0;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px;
  }

  .rotate-card {
    max-width: 420px;
    background: #fff;
    border: 3px solid #111;
    border-radius: 22px;
    padding: 28px 24px;
    box-shadow: 0 14px 32px rgba(0,0,0,.18);
  }

  .rotate-icon {
    font-size: 54px;
    margin-bottom: 12px;
  }

  .rotate-card h2 {
    margin: 0 0 10px;
    font-size: 26px;
  }

  .rotate-card p {
    margin: 0;
    font-size: 17px;
    line-height: 1.4;
  }

  /* Phones use landscape so the game board stays large and readable. */
  @media (orientation: portrait) and (max-width: 600px) {
    .rotate-message {
      display: flex;
    }
  }

  /* Tablet portrait remains usable, with a taller chooser grid. */
  @media (orientation: portrait) and (min-width: 601px) {
    .chooser {
      width: 96%;
      max-height: 88%;
      overflow-y: auto;
    }

    .food-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }
  }

  /* Compact landscape phones: keep all choices visible and tappable. */
  @media (orientation: landscape) and (max-height: 500px) {
    .chooser {
      width: 96%;
      max-height: 94%;
      overflow-y: auto;
      padding: 1% 1.2%;
    }

    .chooser-head {
      margin-bottom: .5%;
    }

    .chooser-title {
      font-size: 18px;
    }

    .chooser-sub {
      font-size: 11px;
    }

    .food-grid {
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .food-choice {
      padding: 3px;
    }

    .food-choice span {
      font-size: 9px;
    }

    .next-plate {
      margin-top: 5px;
      font-size: 11px;
    }

    .reset {
      padding: 5px 10px;
    }
  }


  .rhythm-toggle {
    position: absolute;
    right: 13.5%;
    top: 50.6%;
    z-index: 20;
    border: 2px solid #111;
    border-radius: 10px;
    background: rgba(183,207,242,.97);
    padding: 7px 14px;
    font-size: clamp(12px, 1.05vw, 18px);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
  }

  .rhythm-toggle:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  .plate-card {
    perspective: 900px;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    padding: 0 !important;
  }

  .card-flipper {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .48s ease;
  }

  body.show-rhythm .card-flipper {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #fff;
    border: 2px solid #222;
    border-radius: 10px;
    box-shadow: 0 5px 11px rgba(0,0,0,.22);
    padding: 5% 5% 4%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
  }

  .card-front img {
    width: 100%;
    height: 77%;
    object-fit: contain;
  }

  .card-front .label {
    width: 100%;
    text-align: center;
    font-size: clamp(10px, 1.05vw, 18px);
    line-height: 1.02;
    font-weight: 700;
    color: #111;
    padding-top: 2px;
  }

  .card-back {
    transform: rotateY(180deg);
    justify-content: center;
    padding: 8%;
  }

  .card-back img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  @media (hover: none), (pointer: coarse) {
    .rhythm-toggle {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      min-height: 42px;
    }
  }

  @media (orientation: landscape) and (max-height: 500px) {
    .rhythm-toggle {
      padding: 5px 8px;
      right: 14.5%;
      font-size: 11px;
    }

    .reset {
      padding: 5px 8px;
      right: 1.7%;
      font-size: 11px;
    }
  }


  .fullscreen-btn {
    position: absolute;
    right: 1.7%;
    top: 2.2%;
    z-index: 25;
    border: 2px solid #111;
    border-radius: 10px;
    background: rgba(255,255,255,.96);
    padding: 7px 13px;
    font-size: clamp(11px, .95vw, 17px);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .fullscreen-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  @media (orientation: landscape) and (max-height: 500px) {
    .fullscreen-btn {
      top: 1.5%;
      right: 1.2%;
      padding: 5px 8px;
      font-size: 10px;
    }
  }


  /* --- Final polish: crisp napkin text + unified control strip --- */

  .napkin-live {
    position: absolute;
    left: 35.35%;
    top: 15.55%;
    width: 14.55%;
    height: 20.8%;
    z-index: 16;
    background: #b7cff2;
    border: 2px solid #111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.0% 1.05%;
    color: #111;
    font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(14px, 1.62vw, 27px);
    line-height: 1.12;
    text-align: left;
    letter-spacing: .01em;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  /* Covers the baked yellow reminder in the PNG and replaces it with one clean row. */
  .control-strip-bg {
    position: absolute;
    left: 1.55%;
    top: 49.75%;
    width: 97%;
    height: 8.2%;
    z-index: 17;
    background: rgba(255,255,255,0);
    pointer-events: none;
  }

  .control-strip {
    position: absolute;
    left: 1.65%;
    top: 49.95%;
    width: 96.7%;
    height: 7.5%;
    z-index: 24;
    display: flex;
    align-items: center;
    gap: .65%;
    pointer-events: none;
  }

  .instruction-live {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 1.05%;
    background: rgba(255,242,198,.98);
    border: 2px solid #111;
    border-radius: 8px;
    color: #111;
    font-size: clamp(12px, 1.2vw, 20px);
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    pointer-events: auto;
  }

  .control-strip button {
    position: static !important;
    right: auto !important;
    top: auto !important;
    flex: 0 0 auto;
    height: 100%;
    min-height: 0;
    margin: 0;
    padding: 0 13px;
    border: 2px solid #111;
    border-radius: 8px;
    font-size: clamp(11px, 1.02vw, 17px);
    font-weight: 800;
    line-height: 1;
    box-shadow: 0 2px 0 rgba(0,0,0,.18);
    pointer-events: auto;
    white-space: nowrap;
  }

  .control-strip .rhythm-toggle {
    background: rgba(183,207,242,.98);
  }

  .control-strip .reset,
  .control-strip .fullscreen-btn {
    background: rgba(255,255,255,.97);
  }

  .control-strip button:active {
    transform: translateY(1px);
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
  }

  @media (orientation: landscape) and (max-height: 500px) {
    .control-strip {
      top: 49.7%;
      height: 7.9%;
      gap: .45%;
    }

    .instruction-live {
      font-size: 10px;
      padding: 0 .7%;
    }

    .control-strip button {
      padding: 0 7px;
      font-size: 9px;
    }

    .napkin-live {
      font-size: clamp(12px, 1.55vw, 20px);
    }
  }

  @media (orientation: portrait) and (min-width: 601px) {
    .control-strip {
      gap: .45%;
    }

    .instruction-live {
      font-size: clamp(10px, 1.1vw, 15px);
    }

    .control-strip button {
      padding: 0 8px;
      font-size: clamp(9px, .9vw, 13px);
    }
  }

</style>
</head>

<body>
<div class="rotate-message" aria-live="polite">
  <div class="rotate-card">
    <div class="rotate-icon" aria-hidden="true">📱↔️</div>
    <h2>Turn your phone sideways</h2>
    <p>The Very Hungry Caterpillar activity works best in landscape view.</p>
  </div>
</div>

<div class="stage">
  <div class="canvas">

    <div
      class="basket-hotspot"
      id="basketHotspot"
      aria-label="Open the food basket">
    </div>

    <div class="plate-slot" data-i="0"></div>
    <div class="plate-slot" data-i="1"></div>
    <div class="plate-slot" data-i="2"></div>
    <div class="plate-slot" data-i="3"></div>

    <div class="chooser-backdrop" id="chooserBackdrop">
      <div
        class="chooser"
        role="dialog"
        aria-modal="true"
        aria-label="Choose a food">

        <div class="chooser-head">
          <div>
            <div class="chooser-title">Choose a food</div>
            <div class="chooser-sub">
              Click one card. You may choose the same food more than once.
            </div>
          </div>

          <button class="close" id="closeChooser" type="button">
            CLOSE
          </button>
        </div>

        <div class="food-grid" id="foodGrid"></div>

        <div class="next-plate" id="nextPlateText"></div>
      </div>
    </div>

  </div>
</div>

<script>
const foods = [
  ["Apple", "assets/apple.png", "assets/rhythm-two-beat.png"],
  ["Cherry Pie", "assets/cherry-pie.png", "assets/rhythm-four-syllable.png"],
  ["Chocolate Cake", "assets/chocolate-cake.png", "assets/rhythm-four-syllable.png"],
  ["Cupcake", "assets/cupcake.png", "assets/rhythm-two-beat.png"],
  ["Ice Cream Cone", "assets/ice-cream-cone.png", "assets/rhythm-four-syllable.png"],
  ["Leaf", "assets/leaf.png", "assets/rhythm-leaf-pear-plum.png"],
  ["Lollipop", "assets/lollipop.png", "assets/rhythm-four-syllable.png"],
  ["Orange", "assets/orange.png", "assets/rhythm-two-beat.png"],
  ["Pear", "assets/pear.png", "assets/rhythm-leaf-pear-plum.png"],
  ["Pickle", "assets/pickle.png", "assets/rhythm-two-beat.png"],
  ["Plum", "assets/plum.png", "assets/rhythm-leaf-pear-plum.png"],
  ["Sausage", "assets/sausage.png", "assets/rhythm-two-beat.png"],
  ["Swiss Cheese", "assets/swiss-cheese.png", "assets/rhythm-two-beat.png"],
  ["Watermelon", "assets/watermelon.png", "assets/rhythm-watermelon.png"]
];

const basket = document.getElementById("basketHotspot");
const chooserBackdrop = document.getElementById("chooserBackdrop");
const closeChooser = document.getElementById("closeChooser");
const foodGrid = document.getElementById("foodGrid");
const plates = [...document.querySelectorAll(".plate-slot")];
const resetBtn = document.getElementById("resetBtn");
const rhythmToggle = document.getElementById("rhythmToggle");
const nextPlateText = document.getElementById("nextPlateText");

function firstEmptyPlateIndex() {
  return plates.findIndex(
    plate => !plate.querySelector(".plate-card")
  );
}

function updateNextPlateText() {
  const i = firstEmptyPlateIndex();

  if (i === -1) {
    nextPlateText.textContent =
      "All four plates are filled. Click a plate to remove its card if you want to change it.";
  } else {
    nextPlateText.textContent =
      `This choice will go on plate ${i + 1}.`;
  }
}

function openChooser() {
  updateNextPlateText();
  chooserBackdrop.classList.add("open");
}

function hideChooser() {
  chooserBackdrop.classList.remove("open");
}

function addCardToPlate(plate, label, src, rhythmSrc) {
  const existing = plate.querySelector(".plate-card");

  if (existing) {
    existing.remove();
  }

  const card = document.createElement("div");
  card.className = "plate-card";

  card.innerHTML = `
    <div class="card-flipper">
      <div class="card-face card-front">
        <img src="${src}" alt="${label}">
        <div class="label">${label}</div>
      </div>
      <div class="card-face card-back">
        <img src="${rhythmSrc}" alt="${label} rhythm">
      </div>
    </div>
  `;

  plate.appendChild(card);
  plate.classList.add("has-food");
}

/* Basket opens food choices */
basket.addEventListener("click", openChooser);

/* Close chooser */
closeChooser.addEventListener("click", hideChooser);

/* Click outside chooser closes it */
chooserBackdrop.addEventListener("click", event => {
  if (event.target === chooserBackdrop) {
    hideChooser();
  }
});

/* Build the 14 food cards */
foods.forEach(([label, src, rhythmSrc]) => {
  const card = document.createElement("button");

  card.type = "button";
  card.className = "food-choice";

  card.innerHTML = `
    <img src="${src}" alt="${label}">
    <span>${label}</span>
  `;

  card.addEventListener("click", () => {
    const targetIndex = firstEmptyPlateIndex();

    if (targetIndex === -1) {
      hideChooser();
      return;
    }

    addCardToPlate(
      plates[targetIndex],
      label,
      src,
      rhythmSrc
    );

    /* One choice at a time, like Candy Rondo */
    hideChooser();
  });

  foodGrid.appendChild(card);
});

/* Clicking an occupied plate removes its food card */
plates.forEach(plate => {
  plate.addEventListener("click", () => {
    const card = plate.querySelector(".plate-card");

    if (card) {
      card.remove();
      plate.classList.remove("has-food");
    }
  });
});


/* Flip every selected food card between food/name and rhythm notation. */
rhythmToggle.addEventListener("click", () => {
  const showingRhythm = document.body.classList.toggle("show-rhythm");
  rhythmToggle.textContent = showingRhythm ? "SHOW FOOD" : "SHOW RHYTHM";
});

/* RESET clears all four plates */
resetBtn.addEventListener("click", () => {
  plates.forEach(plate => {
    const card = plate.querySelector(".plate-card");

    if (card) {
      card.remove();
    }

    plate.classList.remove("has-food");
  });

  hideChooser();
  document.body.classList.remove("show-rhythm");
  rhythmToggle.textContent = "SHOW RHYTHM";
});

function fullscreenElementNow() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

async function toggleFullscreen() {
  try {
    if (!fullscreenElementNow()) {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        await el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  } catch (err) {
    console.log("Fullscreen is not available in this browser.", err);
  }
}

const fullscreenBtn = document.getElementById("fullscreenBtn");
fullscreenBtn.addEventListener("click", toggleFullscreen);

function updateFullscreenButton() {
  fullscreenBtn.textContent = fullscreenElementNow() ? "EXIT FULL SCREEN" : "FULL SCREEN";
}

document.addEventListener("fullscreenchange", updateFullscreenButton);
document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

</script>

</body>
</html>
