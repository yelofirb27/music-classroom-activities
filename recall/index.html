<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECALL</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --pink:#ff3b9d; --yellow:#ffd400; --green:#74e51f;
    --cyan:#22c7ff; --purple:#b84cff; --orange:#ff7b22;
  }
  html, body { width:100%; height:100%; }
  body {
    margin:0; min-height:100vh; color:#fff; font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    background:
      radial-gradient(circle at 16% 8%, rgba(255,59,157,.12), transparent 22%),
      radial-gradient(circle at 84% 10%, rgba(34,199,255,.12), transparent 24%),
      radial-gradient(circle at 50% 95%, rgba(184,76,255,.13), transparent 30%),
      #020204;
  }
  .app {
    width:min(1500px,96vw);
    height:100vh;
    margin:0 auto;
    padding:10px 12px 10px;
    display:flex;
    flex-direction:column;
  }
  .topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:12px; }
  .corner-btn {
    border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.04); color:#fff;
    border-radius:999px; padding:11px 18px; font-size:clamp(15px,1.5vw,21px); font-weight:700;
    cursor:pointer; backdrop-filter:blur(4px); transition:.18s ease; margin-top:4px;
  }
  .corner-btn:hover { border-color:#fff; transform:translateY(-1px); background:rgba(255,255,255,.09); }
  #helpBtn { justify-self:end; }
  .brand { text-align:center; min-width:0; }
  h1 {
    margin:0; font-size:clamp(54px,7vw,108px); line-height:.88; letter-spacing:.03em;
    font-weight:900; color:#fff;
    text-shadow:0 0 7px #fff, 0 0 18px var(--pink), 0 0 34px var(--purple);
  }
  .tagline { margin:8px 0 0; font-size:clamp(14px,1.65vw,24px); font-weight:800; letter-spacing:.035em; }
  .music-sparkle { height:7px; margin:8px auto 2px; max-width:760px; border-radius:50%;
    background:linear-gradient(90deg,transparent,var(--pink),var(--yellow),var(--green),var(--cyan),var(--purple),transparent);
    filter:blur(8px); opacity:.7; }
  .stage {
    margin-top:8px;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .canvas-shell {
    position:relative;
    width:min(100%, calc((100dvh - 350px) * 3.2558));
    min-width:760px;
    aspect-ratio:1400 / 430;
    height:auto;
    flex:0 0 auto;
    border:2px solid rgba(255,255,255,.2);
    border-radius:24px;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    box-shadow:0 22px 65px rgba(0,0,0,.55), inset 0 0 35px rgba(60,120,255,.035);
  }
  canvas {
    width:100%;
    height:auto;
    aspect-ratio:1400 / 430;
    display:block;
    touch-action:manipulation;
    cursor:pointer;
  }
  .status { min-height:22px; text-align:center; margin:5px 0 0; font-size:clamp(15px,1.4vw,20px); font-weight:700; color:#dfe8ff; }
  .main-controls { display:flex; justify-content:center; margin:4px 0 8px; }
  .play-btn {
    border:2px solid #7cff34; color:#fff; background:linear-gradient(#30c615,#0d8d06);
    border-radius:16px; padding:11px 28px; font-size:clamp(18px,2vw,28px); font-weight:900;
    cursor:pointer; box-shadow:0 0 22px rgba(74,255,52,.3), inset 0 1px 0 rgba(255,255,255,.35);
    transition:.18s ease;
  }
  .play-btn:hover { transform:translateY(-2px) scale(1.01); box-shadow:0 0 34px rgba(74,255,52,.46); }
  .play-btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }
  .score-row { display:flex; justify-content:center; gap:clamp(14px,4vw,56px); flex-wrap:wrap; }
  .score-card { width:min(300px,42vw); min-width:200px; padding:8px 20px; border-radius:20px; text-align:center;
    background:rgba(0,0,0,.35); box-shadow:inset 0 0 22px rgba(255,255,255,.025); }
  .score-card.score { border:2px solid var(--pink); }
  .score-card.best { border:2px solid var(--yellow); }
  .score-label { font-size:clamp(16px,1.8vw,25px); font-weight:900; letter-spacing:.04em; }
  .score .score-label { color:var(--pink); } .best .score-label { color:var(--yellow); }
  .score-value { font-size:clamp(34px,4vw,56px); font-weight:900; line-height:1; margin-top:5px; }
  .bottom { display:flex; justify-content:center; margin-top:8px; }
  .new-btn {
    border:2px solid var(--purple); background:rgba(12,8,22,.78); color:#fff; border-radius:999px;
    padding:9px 24px; font-size:clamp(16px,1.7vw,23px); font-weight:900; cursor:pointer;
    box-shadow:0 0 20px rgba(184,76,255,.22); transition:.18s ease;
  }
  .new-btn:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(184,76,255,.38); }
  dialog { width:min(560px,90vw); border:2px solid rgba(255,255,255,.25); border-radius:22px; color:#fff;
    background:#0b0b13; padding:24px; box-shadow:0 24px 80px #000; }
  dialog::backdrop { background:rgba(0,0,0,.76); }
  dialog h2 { margin-top:0; font-size:30px; } dialog p { font-size:18px; line-height:1.5; }
  .close-help { float:right; border:0; border-radius:10px; padding:9px 14px; font-weight:800; cursor:pointer; }

  @media (max-height:820px) and (min-width:761px) {
    .app { padding-top:6px; padding-bottom:6px; }
    .corner-btn { padding:8px 15px; font-size:16px; }
    h1 { font-size:clamp(48px,6vw,82px); }
    .tagline { margin-top:4px; font-size:clamp(13px,1.3vw,19px); }
    .music-sparkle { margin-top:4px; height:5px; }
    .stage { margin-top:4px; }
    .canvas-shell {
      width:min(100%, calc((100dvh - 315px) * 3.2558));
      border-radius:18px;
    }
    .status { margin-top:3px; min-height:19px; font-size:14px; }
    .main-controls { margin:2px 0 5px; }
    .play-btn { padding:8px 23px; font-size:20px; }
    .score-row { gap:clamp(14px,3vw,40px); }
    .score-card { padding:5px 18px; }
    .score-label { font-size:15px; }
    .score-value { font-size:35px; margin-top:1px; }
    .bottom { margin-top:5px; }
    .new-btn { padding:7px 22px; font-size:17px; }
  }

  @media (max-height:700px) and (min-width:761px) {
    .corner-btn { padding:6px 13px; font-size:14px; }
    h1 { font-size:58px; }
    .tagline { font-size:14px; }
    .music-sparkle { margin:3px auto 0; }
    .canvas-shell { width:min(100%, calc((100dvh - 270px) * 3.2558)); }
    .status { font-size:13px; min-height:17px; }
    .play-btn { padding:7px 20px; font-size:18px; }
    .score-card { width:min(250px,40vw); min-width:180px; padding:4px 14px; }
    .score-label { font-size:14px; }
    .score-value { font-size:30px; }
    .new-btn { padding:6px 18px; font-size:15px; }
  }

  @media (max-width:760px) {
    .topbar { grid-template-columns:1fr 1fr; }
    .brand { grid-column:1 / -1; grid-row:1; }
    #soundBtn { grid-column:1; grid-row:2; justify-self:start; }
    #helpBtn { grid-column:2; grid-row:2; }
    body { overflow:auto; }
    .app { width:100%; height:auto; min-height:100vh; padding:12px 8px 22px; }
    .canvas-shell {
      width:100%;
      min-width:0;
      aspect-ratio:1400 / 430;
      border-radius:16px;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <button id="soundBtn" class="corner-btn" type="button">🔊 Sound</button>
    <div class="brand">
      <h1>RECALL</h1>
      <div class="tagline">MEMORIZE THE NOTES. RECALL THE MELODY.</div>
      <div class="music-sparkle"></div>
    </div>
    <button id="helpBtn" class="corner-btn" type="button">? &nbsp;How to Play</button>
  </header>

  <section class="stage">
    <div class="canvas-shell">
      <canvas id="staffCanvas" width="1400" height="430" aria-label="Interactive musical staff"></canvas>
    </div>
    <div id="status" class="status">Press Play Melody to begin.</div>
    <div class="main-controls">
      <button id="playBtn" class="play-btn" type="button">▶ &nbsp;PLAY MELODY</button>
    </div>
    <div class="score-row">
      <div class="score-card score"><div class="score-label">SCORE</div><div id="scoreValue" class="score-value">0</div></div>
      <div class="score-card best"><div class="score-label">BEST SCORE</div><div id="bestValue" class="score-value">0</div></div>
    </div>
    <div class="bottom"><button id="newBtn" class="new-btn" type="button">↻ &nbsp;NEW GAME</button></div>
  </section>
</main>

<dialog id="helpDialog">
  <button class="close-help" id="closeHelp" type="button">Close</button>
  <h2>How to Play</h2>
  <p>Press <strong>Play Melody</strong> and listen while the notes light up. Then click the same notes on the staff in the same order.</p>
  <p>Each correct round adds one new note. A wrong note begins a new game.</p>
</dialog>

  clefImage.onload = () => drawStaff();

  function drawStaff(highlight = -1) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#020204';
    ctx.fillRect(0, 0, W, H);

    // subtle inner glow behind the staff
    const grad = ctx.createRadialGradient(W*.52,H*.45,20,W*.52,H*.45,W*.68);
    grad.addColorStop(0,'rgba(35,65,120,.12)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    for (let i=0;i<5;i++) {
      const y = baseY - i*spacing;
      ctx.beginPath(); ctx.moveTo(105,y); ctx.lineTo(1328,y); ctx.stroke();
    }

    // White treble clef image placed on top of the far-left side of the staff.
    if (clefImage.complete && clefImage.naturalWidth) {
      ctx.save();
      ctx.filter = 'invert(1) brightness(2)';
      ctx.globalAlpha = .98;
      ctx.drawImage(clefImage, 58, 24, 292, 385);
      ctx.restore();
    }

    // Ledger line for middle C.
    const c = notes[0];
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(c.x-62,c.y); ctx.lineTo(c.x+62,c.y); ctx.stroke();

    notes.forEach((note,i) => {
      const active = i === highlight;
      ctx.save();
      if (active) {
        ctx.shadowColor = note.flashColor;
        ctx.shadowBlur = 34;
      }
      ctx.beginPath();
      ctx.ellipse(note.x,note.y,43,34,0,0,Math.PI*2);
      ctx.fillStyle = active ? note.flashColor : '#fff';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = active ? '#fff' : '#202020';
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = active && (note.name==='E' || note.name==='F') ? '#101010' : '#111';
      ctx.font = '900 34px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(note.name,note.x,note.y+1);
    });
  }

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq) {
    if (muted) return;
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(.24,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.48);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+.5);
  }

  function flashNote(index, duration=420) {
    drawStaff(index);
    playTone(notes[index].freq);
    return new Promise(resolve => setTimeout(() => { drawStaff(); resolve(); }, duration));
  }

  async function playSequence() {
    if (!sequence.length) return;
    sequencePlaying = true; acceptingInput = false;
    playBtn.disabled = true;
    statusEl.textContent = 'Listen and watch…';
    await new Promise(r => setTimeout(r,250));
    for (const index of sequence) {
      await flashNote(index,430);
      await new Promise(r => setTimeout(r,220));
    }
    sequencePlaying = false; acceptingInput = true; userInput = [];
    playBtn.disabled = false;
    statusEl.textContent = 'Your turn — click the notes in order.';
  }

  function addNextNote() {
    sequence.push(Math.floor(Math.random()*notes.length));
    userInput = [];
    setTimeout(playSequence,450);
  }

  function newGame() {
    sequence = []; userInput = []; score = 0;
    acceptingInput = false; sequencePlaying = false;
    scoreEl.textContent = '0';
    statusEl.textContent = 'New game! Listen to the first note.';
    addNextNote();
  }

  async function handleChoice(index) {
    if (!acceptingInput || sequencePlaying) return;
    acceptingInput = false;
    await flashNote(index,300);
    userInput.push(index);
    const pos = userInput.length-1;

    if (userInput[pos] !== sequence[pos]) {
      statusEl.textContent = 'Not quite — starting a new game.';
      setTimeout(newGame,900);
      return;
    }

    if (userInput.length === sequence.length) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('recallBest',String(best)); }
      statusEl.textContent = `Correct! Score ${score}. One more note is being added.`;
      setTimeout(addNextNote,800);
    } else {
      acceptingInput = true;
      statusEl.textContent = `Good — ${sequence.length-userInput.length} note${sequence.length-userInput.length===1?'':'s'} left.`;
    }
  }

  function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*(canvas.width/r.width), y:(p.clientY-r.top)*(canvas.height/r.height) };
  }

  function chooseFromEvent(e) {
    e.preventDefault();
    const p = canvasPoint(e);
    const index = notes.findIndex(n => Math.hypot(p.x-n.x,(p.y-n.y)*1.15) < 54);
    if (index >= 0) handleChoice(index);
  }

  canvas.addEventListener('click',chooseFromEvent);
  canvas.addEventListener('touchstart',chooseFromEvent,{passive:false});

  playBtn.addEventListener('click',() => {
    ensureAudio();
    if (!sequence.length) newGame(); else if (!sequencePlaying) playSequence();
  });
  newBtn.addEventListener('click',() => { ensureAudio(); newGame(); });
  soundBtn.addEventListener('click',() => {
    muted = !muted;
    soundBtn.textContent = muted ? '🔇 Sound Off' : '🔊 Sound';
  });
  helpBtn.addEventListener('click',() => helpDialog.showModal());
  closeHelp.addEventListener('click',() => helpDialog.close());
  helpDialog.addEventListener('click',e => { if (e.target===helpDialog) helpDialog.close(); });

  drawStaff();
})();
