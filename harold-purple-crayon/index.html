<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Harold and the Purple Crayon - Melodic Adventures</title>
<style>
  :root{
    --purple:#7430a6;
    --purple-dark:#54207e;
    --paper:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
  body{display:grid;place-items:center;touch-action:none}

  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    aspect-ratio:16/9;
    background:#fff url('activity-background.png') center/100% 100% no-repeat;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* Main white story area from the mockup. */
  #drawingArea{
    position:absolute;
    left:28.4%;
    top:7.7%;
    width:68.4%;
    height:54.4%;
    overflow:hidden;
    touch-action:none;
  }

  #pathSvg,#drawCanvas{position:absolute;inset:0;width:100%;height:100%}
  #pathSvg{overflow:visible;pointer-events:none}
  #drawCanvas{display:none;cursor:crosshair;touch-action:none}

  #guidePath{
    fill:none;
    stroke:var(--purple);
    stroke-width:8;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.08));
  }

  #crayonMarker{
    position:absolute;
    width:64px;
    height:18px;
    border-radius:10px 4px 4px 10px;
    background:linear-gradient(90deg,#5e2194 0 12%,#9f69c6 12% 80%,#6f2aa4 80% 100%);
    transform:translate(-14px,-9px) rotate(-12deg);
    transform-origin:14px 9px;
    pointer-events:none;
    opacity:0;
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  #crayonMarker::before{
    content:"";position:absolute;left:-15px;top:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:16px solid #54207e;
  }

  /* Top action row lives ABOVE the drawing area so the animated crayon never crosses it. */
  #topActionRow{
    position:absolute;
    left:31.2%;
    top:1.25%;
    width:66.3%;
    height:5.6%;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    align-items:center;
    gap:clamp(6px,.8vw,14px);
    z-index:20;
    pointer-events:none;
  }

  #prompt{
    min-width:0;
    padding:.42em .8em;
    border:2px solid var(--purple);
    border-radius:14px;
    background:rgba(255,255,255,.98);
    color:var(--purple-dark);
    font-weight:800;
    font-size:clamp(12px,1.12vw,20px);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    opacity:0;
    transition:opacity .2s ease;
  }
  #prompt.show{opacity:1}

  #controls{
    display:flex;
    align-items:center;
    gap:clamp(6px,.55vw,10px);
    opacity:0;
    transition:opacity .2s ease;
  }
  #controls.show{opacity:1;pointer-events:auto}
  .controlBtn{
    border:2px solid var(--purple);
    background:#fff;
    color:var(--purple-dark);
    border-radius:999px;
    padding:.5em .9em;
    font-weight:800;
    font-size:clamp(12px,1.05vw,18px);
    cursor:pointer;
  }
  .controlBtn:active{transform:scale(.97)}

  /* Transparent hit zones over the seven printed cards on the background. */
  .adventure{
    position:absolute;
    top:66.9%;
    height:20.1%;
    border:0;
    background:transparent;
    cursor:pointer;
    border-radius:14px;
    touch-action:manipulation;
  }
  .adventure:hover,.adventure:focus-visible{outline:4px solid rgba(116,48,166,.28);outline-offset:-4px}
  #mountainBtn{left:1.7%;width:13.8%}
  #oceanBtn{left:16.6%;width:13.7%}
  #rollerBtn{left:31.3%;width:12.2%}
  #slideBtn{left:44.6%;width:12.2%}
  #flatBtn{left:57.9%;width:12.5%}
  #stairsBtn{left:71.5%;width:12.7%}
  #drawBtn{left:85.1%;width:13.0%}

  #drawingModeBanner{
    position:absolute;
    left:29%;bottom:13.4%;
    padding:.45em .8em;
    border-radius:999px;
    color:#fff;
    background:rgba(84,32,126,.93);
    font-size:clamp(12px,1vw,17px);
    font-weight:700;
    opacity:0;pointer-events:none;
  }
  #drawingModeBanner.show{opacity:1}

  /* Hide the decorative Instructions and Settings buttons baked into the mockup. */
  .backgroundCover{
    position:absolute;
    bottom:0;
    height:10.2%;
    background:#fff;
    z-index:8;
    pointer-events:none;
  }
  #coverInstructions{left:0;width:16.2%;}
  #coverSettings{right:0;width:13.2%;}

  @media (max-aspect-ratio: 4/5){
    body{background:#fff}
  }
</style>
</head>
<body>
<div id="stage" aria-label="Harold and the Purple Crayon melodic contour activity">
  <div id="drawingArea">
    <svg id="pathSvg" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
      <path id="guidePath" d=""></path>
    </svg>
    <canvas id="drawCanvas"></canvas>
    <div id="crayonMarker" aria-hidden="true"></div>
  </div>

  <div id="topActionRow">
    <div id="prompt"></div>
    <div id="controls">
      <button id="playBtn" class="controlBtn" type="button">▶ Play Again</button>
      <button id="clearBtn" class="controlBtn" type="button">↺ Clear</button>
    </div>
  </div>

  <div id="coverInstructions" class="backgroundCover" aria-hidden="true"></div>
  <div id="coverSettings" class="backgroundCover" aria-hidden="true"></div>

  <button class="adventure" id="mountainBtn" aria-label="Harold Draws a Mountain"></button>
  <button class="adventure" id="oceanBtn" aria-label="Harold Draws Ocean Waves"></button>
  <button class="adventure" id="rollerBtn" aria-label="Harold Draws a Roller Coaster"></button>
  <button class="adventure" id="slideBtn" aria-label="Harold Draws a Slide"></button>
  <button class="adventure" id="flatBtn" aria-label="Harold Draws Flat Ground"></button>
  <button class="adventure" id="stairsBtn" aria-label="Harold Draws Stairs"></button>
  <button class="adventure" id="drawBtn" aria-label="Draw Your Own Adventure"></button>
  <div id="drawingModeBanner">Draw your own purple path — then have the class follow it with their voices!</div>
</div>

<script>
(() => {
  const svg = document.getElementById('pathSvg');
  const path = document.getElementById('guidePath');
  const crayon = document.getElementById('crayonMarker');
  const prompt = document.getElementById('prompt');
  const controls = document.getElementById('controls');
  const playBtn = document.getElementById('playBtn');
  const clearBtn = document.getElementById('clearBtn');
  const canvas = document.getElementById('drawCanvas');
  const area = document.getElementById('drawingArea');
  const drawingModeBanner = document.getElementById('drawingModeBanner');

  let animationFrame = null;
  let currentAdventure = null;
  let drawing = false;
  let ctx;
  let drawPoints = [];
  let drawPlayback = false;

  /* ------------------------------------------------------------
     Gentle "OO" vocal model
     ------------------------------------------------------------
     No audio file is required. Web Audio builds a soft vowel-like tone
     from a harmonic source, fixed vocal formants, and a tiny vibrato.
     Vertical crayon position controls pitch continuously.
  ------------------------------------------------------------- */
  let audioCtx = null;
  let voice = null;

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function yToFrequency(y, height){
    const t = 1 - Math.max(0, Math.min(1, y / height));
    // Comfortable, useful vocal-exploration range: about F3 to C5.
    const low = 175;
    const high = 523.25;
    return low * Math.pow(high / low, t);
  }

  function startVoice(y, height){
    ensureAudio();
    stopVoice(0.01);

    const now = audioCtx.currentTime;
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.23, now + 0.05);
    master.connect(audioCtx.destination);

    // Fundamental gives the sound a clear, singable center.
    const fundamental = audioCtx.createOscillator();
    fundamental.type = 'sine';
    const fundamentalGain = audioCtx.createGain();
    fundamentalGain.gain.value = 0.62;
    fundamental.connect(fundamentalGain).connect(master);

    // A quiet harmonic source passed through two "oo" formants.
    const buzz = audioCtx.createOscillator();
    buzz.type = 'sawtooth';
    const buzzGain = audioCtx.createGain();
    buzzGain.gain.value = 0.13;
    buzz.connect(buzzGain);

    const formant1 = audioCtx.createBiquadFilter();
    formant1.type = 'bandpass';
    formant1.frequency.value = 360;
    formant1.Q.value = 5.5;
    const f1Gain = audioCtx.createGain();
    f1Gain.gain.value = 1.15;
    buzzGain.connect(formant1).connect(f1Gain).connect(master);

    const formant2 = audioCtx.createBiquadFilter();
    formant2.type = 'bandpass';
    formant2.frequency.value = 820;
    formant2.Q.value = 7;
    const f2Gain = audioCtx.createGain();
    f2Gain.gain.value = 0.45;
    buzzGain.connect(formant2).connect(f2Gain).connect(master);

    // Very small vibrato keeps the model from sounding like a plain beep.
    const vibrato = audioCtx.createOscillator();
    vibrato.frequency.value = 5.1;
    const vibratoGain = audioCtx.createGain();
    vibratoGain.gain.value = 2.0;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(fundamental.detune);
    vibratoGain.connect(buzz.detune);

    const freq = yToFrequency(y, height);
    fundamental.frequency.setValueAtTime(freq, now);
    buzz.frequency.setValueAtTime(freq, now);

    fundamental.start(now);
    buzz.start(now);
    vibrato.start(now);

    voice = {master, fundamental, buzz, vibrato};
  }

  function updateVoice(y, height){
    if(!voice || !audioCtx) return;
    const now = audioCtx.currentTime;
    const freq = yToFrequency(y, height);
    voice.fundamental.frequency.setTargetAtTime(freq, now, 0.015);
    voice.buzz.frequency.setTargetAtTime(freq, now, 0.015);
  }

  function stopVoice(release=0.055){
    if(!voice || !audioCtx) return;
    const v = voice;
    voice = null;
    const now = audioCtx.currentTime;
    try{
      v.master.gain.cancelScheduledValues(now);
      v.master.gain.setValueAtTime(Math.max(0.0001, v.master.gain.value), now);
      v.master.gain.exponentialRampToValueAtTime(0.0001, now + release);
      v.fundamental.stop(now + release + 0.03);
      v.buzz.stop(now + release + 0.03);
      v.vibrato.stop(now + release + 0.03);
    }catch(e){}
  }

  const adventures = {
    mountain: {
      label:'Mountain',
      prompt:'Follow the mountain with your voice: LOW → HIGH → LOW',
      d:'M 30 420 L 150 420 L 360 90 L 570 420 L 960 420',
      duration:6500
    },
    ocean: {
      label:'Ocean Waves',
      prompt:'Let your voice rise and fall smoothly with the ocean waves.',
      d:'M 20 290 C 90 130,160 130,230 290 S 370 450,440 290 S 580 130,650 290 S 790 450,860 290 S 950 145,985 250',
      duration:7600
    },
    roller: {
      label:'Roller Coaster',
      prompt:'Hold on! Follow every hill, drop, and loop with your voice.',
      d:'M 20 360 C 120 360,120 120,235 120 C 320 120,320 340,395 340 C 470 340,440 180,530 180 C 620 180,635 420,530 420 C 425 420,420 215,540 215 C 675 215,670 345,745 345 C 835 345,850 145,980 145',
      duration:9000
    },
    slide: {
      label:'Slide',
      prompt:'Start HIGH and let your voice slide all the way DOWN.',
      d:'M 70 85 L 240 85 C 390 85,410 390,650 400 C 770 405,880 405,970 405',
      duration:5600
    },
    flat: {
      label:'Flat Ground',
      prompt:'Keep your voice on the SAME pitch all the way across.',
      d:'M 35 300 L 970 300',
      duration:5000
    },
    stairs: {
      label:'Stairs',
      prompt:'Move your voice one step at a time: UP, UP, UP!',
      d:'M 40 410 L 170 410 L 170 350 L 300 350 L 300 290 L 430 290 L 430 230 L 560 230 L 560 170 L 690 170 L 690 110 L 970 110',
      duration:7200
    }
  };

  function stopAnimation(){
    if(animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = null;
    drawPlayback = false;
    stopVoice();
  }

  function selectAdventure(name){
    ensureAudio();
    exitDrawingMode();
    currentAdventure = adventures[name];
    path.setAttribute('d', currentAdventure.d);
    prompt.textContent = currentAdventure.prompt;
    prompt.classList.add('show');
    controls.classList.add('show');
    playBtn.style.display='inline-block';
    playBtn.textContent='▶ Play Again';
    clearBtn.textContent='↺ Clear';
    animateCurrent();
  }

  function animateCurrent(){
    if(!currentAdventure) return;
    ensureAudio();
    stopAnimation();
    svg.style.display='block';
    canvas.style.display='none';
    const len = path.getTotalLength();
    path.style.strokeDasharray = `${len} ${len}`;
    path.style.strokeDashoffset = `${len}`;
    crayon.style.opacity='1';
    const start = performance.now();
    const first = path.getPointAtLength(0);
    startVoice(first.y, 500);

    function tick(now){
      const p = Math.min(1,(now-start)/currentAdventure.duration);
      path.style.strokeDashoffset = `${len*(1-p)}`;
      const pt = path.getPointAtLength(len*p);
      crayon.style.left = `${pt.x/10}%`;
      crayon.style.top = `${pt.y/5}%`;
      updateVoice(pt.y, 500);
      if(p < 1){
        animationFrame = requestAnimationFrame(tick);
      } else {
        animationFrame = null;
        crayon.style.opacity='0';
        stopVoice();
      }
    }
    animationFrame=requestAnimationFrame(tick);
  }

  function clearAll(){
    stopAnimation();
    if(canvas.style.display==='block'){
      fitCanvas(false);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawPoints=[];
      playBtn.style.display='none';
      crayon.style.opacity='0';
    } else {
      path.setAttribute('d','');
      crayon.style.opacity='0';
      prompt.classList.remove('show');
      controls.classList.remove('show');
      currentAdventure=null;
    }
  }

  function fitCanvas(clear=true){
    const r=canvas.getBoundingClientRect();
    const dpr=Math.max(1,window.devicePixelRatio||1);
    if(clear || canvas.width === 0){
      canvas.width=Math.round(r.width*dpr);
      canvas.height=Math.round(r.height*dpr);
    }
    ctx=canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=Math.max(5,r.width*0.007);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.strokeStyle='#7430a6';
  }

  function enterDrawingMode(){
    ensureAudio();
    stopAnimation();
    currentAdventure=null;
    path.setAttribute('d','');
    svg.style.display='none';
    canvas.style.display='block';
    fitCanvas();
    drawPoints=[];
    prompt.textContent='Create your own melodic adventure with the purple crayon!';
    prompt.classList.add('show');
    controls.classList.add('show');
    playBtn.style.display='none';
    playBtn.textContent='▶ Play Drawing';
    clearBtn.textContent='↺ Clear Drawing';
    drawingModeBanner.classList.add('show');
  }

  function exitDrawingMode(){
    drawing=false;
    stopVoice();
    drawingModeBanner.classList.remove('show');
    canvas.style.display='none';
    svg.style.display='block';
  }

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }

  function redrawDrawPath(){
    const r=canvas.getBoundingClientRect();
    fitCanvas();
    ctx.clearRect(0,0,r.width,r.height);
    if(drawPoints.length<2) return;
    ctx.beginPath();
    ctx.moveTo(drawPoints[0].x*r.width, drawPoints[0].y*r.height);
    for(let i=1;i<drawPoints.length;i++){
      ctx.lineTo(drawPoints[i].x*r.width, drawPoints[i].y*r.height);
    }
    ctx.stroke();
  }

  function playDrawnPath(){
    if(drawPoints.length < 2 || drawPlayback) return;
    ensureAudio();
    stopAnimation();
    drawPlayback = true;
    const r=canvas.getBoundingClientRect();

    // Build cumulative distances so playback travels at a steady visual speed.
    const dist=[0];
    let total=0;
    for(let i=1;i<drawPoints.length;i++){
      const dx=(drawPoints[i].x-drawPoints[i-1].x)*r.width;
      const dy=(drawPoints[i].y-drawPoints[i-1].y)*r.height;
      total += Math.hypot(dx,dy);
      dist.push(total);
    }
    if(total<1){ drawPlayback=false; return; }
    const duration=Math.max(3000, Math.min(9000, total*7.5));
    const start=performance.now();
    crayon.style.opacity='1';
    startVoice(drawPoints[0].y*r.height, r.height);

    function tick(now){
      const p=Math.min(1,(now-start)/duration);
      const target=total*p;
      let i=1;
      while(i<dist.length && dist[i]<target) i++;
      i=Math.min(i,dist.length-1);
      const d0=dist[i-1], d1=dist[i];
      const local=d1>d0 ? (target-d0)/(d1-d0) : 0;
      const a=drawPoints[i-1], b=drawPoints[i];
      const x=(a.x+(b.x-a.x)*local)*r.width;
      const y=(a.y+(b.y-a.y)*local)*r.height;
      crayon.style.left=`${(x/r.width)*100}%`;
      crayon.style.top=`${(y/r.height)*100}%`;
      updateVoice(y,r.height);
      if(p<1 && drawPlayback){
        animationFrame=requestAnimationFrame(tick);
      }else{
        animationFrame=null;
        drawPlayback=false;
        crayon.style.opacity='0';
        stopVoice();
      }
    }
    animationFrame=requestAnimationFrame(tick);
  }

  canvas.addEventListener('pointerdown',e=>{
    stopAnimation();
    ensureAudio();
    drawing=true;
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    const p=pointFromEvent(e);

    // A new stroke becomes the new melodic path.
    drawPoints=[{x:p.x/r.width,y:p.y/r.height}];
    fitCanvas();
    ctx.clearRect(0,0,r.width,r.height);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    crayon.style.opacity='1';
    crayon.style.left=`${(p.x/r.width)*100}%`;
    crayon.style.top=`${(p.y/r.height)*100}%`;
    startVoice(p.y,r.height);
  });

  canvas.addEventListener('pointermove',e=>{
    if(!drawing) return;
    const r=canvas.getBoundingClientRect();
    const p=pointFromEvent(e);
    const last=drawPoints[drawPoints.length-1];
    const nx=p.x/r.width, ny=p.y/r.height;
    if(!last || Math.hypot((nx-last.x)*r.width,(ny-last.y)*r.height)>2){
      drawPoints.push({x:nx,y:ny});
    }
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    crayon.style.left=`${nx*100}%`;
    crayon.style.top=`${ny*100}%`;
    updateVoice(p.y,r.height);
  });

  function finishDrawing(){
    if(!drawing) return;
    drawing=false;
    stopVoice();
    crayon.style.opacity='0';
    if(drawPoints.length>1){
      playBtn.style.display='inline-block';
      playBtn.textContent='▶ Play Drawing';
    }
  }
  canvas.addEventListener('pointerup',finishDrawing);
  canvas.addEventListener('pointercancel',finishDrawing);

  document.getElementById('mountainBtn').onclick=()=>selectAdventure('mountain');
  document.getElementById('oceanBtn').onclick=()=>selectAdventure('ocean');
  document.getElementById('rollerBtn').onclick=()=>selectAdventure('roller');
  document.getElementById('slideBtn').onclick=()=>selectAdventure('slide');
  document.getElementById('flatBtn').onclick=()=>selectAdventure('flat');
  document.getElementById('stairsBtn').onclick=()=>selectAdventure('stairs');
  document.getElementById('drawBtn').onclick=enterDrawingMode;
  playBtn.onclick=()=>{
    if(canvas.style.display==='block') playDrawnPath();
    else animateCurrent();
  };
  clearBtn.onclick=clearAll;

  window.addEventListener('resize',()=>{
    if(canvas.style.display==='block') redrawDrawPath();
  });
})();
</script>
</body>
</html>
