<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melodic Reading</title>
<style>
:root{
  --blue:#073b9b;
  --deep:#052b73;
  --yellow:#ffe45c;
  --sky:#c7eaff;
  --lav:#d9c8ff;
  --ink:#111;
  --cream:#fff8cf;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:var(--cream);
}
header{
  min-height:132px;
  background:linear-gradient(180deg,var(--blue),var(--deep));
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  padding:18px 175px 18px 24px;
  border-bottom:8px solid #fff0a7;
}
h1{
  margin:0;
  font-size:clamp(42px,5vw,72px);
  line-height:1;
  font-weight:900;
}
#subtitle{
  margin-top:10px;
  color:white;
  font-size:clamp(20px,2.4vw,34px);
  font-weight:800;
}
#settingsButton{
  position:absolute;
  top:20px;
  right:22px;
  border:3px solid #111;
  border-radius:18px;
  background:var(--yellow);
  padding:13px 18px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.2);
}
main{
  width:min(1500px,100%);
  margin:0 auto;
  padding:18px;
}
.card{
  background:white;
  border:7px solid var(--blue);
  border-radius:34px;
  padding:20px 28px 25px;
  min-height:650px;
  box-shadow:0 5px 0 rgba(0,0,0,.08);
}
.hand-row{
  margin-left:76px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  min-height:175px;
  align-items:end;
  gap:10px;
}
.beat{
  text-align:center;
}
.hand-wrap{
  height:118px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hand-img{
  max-width:155px;
  max-height:105px;
  width:auto;
  height:auto;
  object-fit:contain;
}
.beat-number{
  font-size:clamp(34px,4vw,58px);
  color:var(--blue);
  font-weight:900;
  line-height:1;
}
.staff-area{
  display:grid;
  grid-template-columns:76px 1fr;
  align-items:stretch;
  margin-top:4px;
}
.labels{
  height:300px;
  position:relative;
}
.pitch-label{
  position:absolute;
  right:10px;
  transform:translateY(-50%);
  font-size:clamp(15px,1.45vw,22px);
  font-weight:900;
  white-space:nowrap;
}
.staff{
  height:300px;
  position:relative;
  border-left:7px solid #111;
  border-right:7px solid #111;
}
.staff-line{
  position:absolute;
  left:0;
  right:0;
  height:6px;
  background:#111;
  transform:translateY(-50%);
  z-index:1;
}
.note{
  position:absolute;
  width:clamp(52px,5.6vw,78px);
  aspect-ratio:1/1;
  border:7px solid #111;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:3;
}
.note.open{background:white}
.note.filled{background:#111}
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:26px;
}
.ctrl{
  border:4px solid var(--blue);
  border-radius:18px;
  padding:13px 24px;
  font-size:clamp(18px,2vw,28px);
  font-weight:900;
  cursor:pointer;
  background:var(--sky);
}
.ctrl.shuffle{
  background:var(--lav);
  border-color:#5b2ea6;
}
#counter{
  min-width:180px;
  text-align:center;
  font-size:clamp(18px,2vw,27px);
  font-weight:900;
}
.hint{
  text-align:center;
  margin-top:14px;
  font-size:18px;
}
.panel{
  position:fixed;
  top:0;
  right:-430px;
  width:min(430px,94vw);
  height:100vh;
  overflow:auto;
  z-index:30;
  background:#f7f9fd;
  border-left:5px solid var(--blue);
  box-shadow:-8px 0 25px rgba(0,0,0,.25);
  padding:18px;
  transition:right .25s ease;
}
.panel.open{right:0}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  z-index:25;
  display:none;
}
.overlay.show{display:block}
.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.panel h2{margin:0;font-size:28px}
.close{
  border:2px solid #111;
  border-radius:10px;
  background:white;
  font-size:22px;
  padding:5px 10px;
  cursor:pointer;
}
.section{
  border-top:2px solid #d4d9e5;
  margin-top:14px;
  padding-top:13px;
}
.section-title{
  font-size:19px;
  font-weight:900;
  margin-bottom:8px;
}
select{
  width:100%;
  border:2px solid #777;
  border-radius:10px;
  background:white;
  padding:10px;
  font-size:16px;
}
.option{
  display:flex;
  align-items:center;
  gap:9px;
  margin:8px 0;
  font-size:17px;
}
input[type=checkbox],input[type=radio]{
  width:20px;
  height:20px;
  accent-color:var(--blue);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px 12px;
}
.apply{
  width:100%;
  margin-top:17px;
  border:3px solid #111;
  border-radius:14px;
  background:var(--yellow);
  padding:12px;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
}
.small{
  font-size:13px;
  line-height:1.35;
  color:#555;
}
@media(max-width:760px){
  header{padding:76px 18px 16px}
  #settingsButton{top:12px;right:12px}
  .card{padding:14px 10px 20px}
  .hand-row{margin-left:54px;min-height:140px}
  .hand-wrap{height:90px}
  .hand-img{max-width:95px;max-height:80px}
  .staff-area{grid-template-columns:54px 1fr}
  .staff,.labels{height:250px}
  .pitch-label{right:6px;font-size:clamp(16px,4vw,22px)}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Melodic Reading</h1>
    <div id="subtitle">Mi · So · La — Four Beats</div>
  </div>
  <button id="settingsButton">⚙ Teacher Settings</button>
</header>

<main>
  <section class="card">
    <div id="handRow" class="hand-row"></div>
    <div class="staff-area">
      <div id="labels" class="labels"></div>
      <div id="staff" class="staff"></div>
    </div>
    <div class="controls">
      <button id="back" class="ctrl">◀ Back</button>
      <div id="counter">Card 1</div>
      <button id="next" class="ctrl">Next ▶</button>
      <button id="shuffle" class="ctrl shuffle">⤨ Shuffle</button>
    </div>
    <div class="hint">Press the space bar or right arrow for the next card.</div>
  </section>
</main>

<div id="overlay" class="overlay"></div>
<aside id="panel" class="panel">
  <div class="panel-head">
    <h2>Teacher Settings</h2>
    <button id="close" class="close">✕</button>
  </div>

  <div class="section">
    <div class="section-title">Curriculum preset</div>
    <select id="preset">
      <option value="g1-msl">Grade 1 — Mi, So, La</option>
      <option value="g2-msl">Grade 2 — Mi, So, La</option>
      <option value="g2-drm">Grade 2 — Do, Re, Mi</option>
      <option value="g3-review">Grade 3 — Do, Re, Mi Review</option>
      <option value="g3-expanded">Grade 3 — Expanded Five-Line Staff</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">Practice mode</div>
    <label class="option"><input type="radio" name="mode" value="unlimited" checked> Unlimited four-beat practice</label>
    <label class="option"><input type="radio" name="mode" value="curriculum"> Curriculum-style three-note cards</label>
  </div>

  <div class="section">
    <div class="section-title">Staff</div>
    <label class="option"><input type="radio" name="staffType" value="auto" checked> Automatic for preset</label>
    <label class="option"><input type="radio" name="staffType" value="3"> 3-line staff</label>
    <label class="option"><input type="radio" name="staffType" value="5"> 5-line staff</label>
  </div>

  <div class="section">
    <div class="section-title">Noteheads</div>
    <label class="option"><input type="radio" name="notehead" value="auto" checked> Automatic for preset</label>
    <label class="option"><input type="radio" name="notehead" value="open"> Open</label>
    <label class="option"><input type="radio" name="notehead" value="filled"> Filled</label>
  </div>

  <div class="section">
    <div class="section-title">Available pitches</div>
    <div id="pitchChoices" class="grid"></div>
    <div class="small">At least one pitch must remain selected.</div>
  </div>

  <div class="section">
    <div class="section-title">Solfège labels</div>
    <label class="option"><input type="checkbox" id="labelsOn" checked> Show selected labels</label>
    <div id="labelChoices" class="grid"></div>
  </div>

  <div class="section">
    <div class="section-title">Hand signs and beat numbers</div>
    <label class="option"><input type="checkbox" id="handsOn" checked> Show hand signs</label>
    <label class="option"><input type="checkbox" id="beatsOn" checked> Show beat numbers</label>
  </div>

  <div class="section">
    <div class="section-title">Melody rules</div>
    <label class="option"><input type="checkbox" id="repeatsOn" checked> Allow repeated notes</label>
  </div>

  <button id="apply" class="apply">Apply & Hide Settings</button>
</aside>

const state={
  preset:"g1-msl",
  mode:"unlimited",
  staffOverride:"auto",
  noteheadOverride:"auto",
  selected:["mi","so","la"],
  labels:["mi","so","la"],
  showHands:true,
  showBeats:true,
  allowRepeats:true,
  deck:[],
  index:0
};

const $=id=>document.getElementById(id);

function preset(){return PRESETS[state.preset]}
function staffType(){return state.staffOverride==="auto"?preset().staff:Number(state.staffOverride)}
function notehead(){return state.noteheadOverride==="auto"?preset().notehead:state.noteheadOverride}

function pitchY(p){
  if(staffType()===3){
    if(preset().map3 && preset().map3[p]!==undefined)return preset().map3[p];
    return ({lowLa:94,do:82,re:50,mi:34,fa:18,so:50,la:34,ti:18,highDo:8})[p];
  }
  return (preset().map5||{lowLa:94,do:74,re:66,mi:58,fa:50,so:42,la:34,ti:26,highDo:18})[p];
}

function buildChecklists(){
  ORDER.forEach(key=>{
    const p=PITCHES[key];
    const a=document.createElement("label");
    a.className="option";
    a.innerHTML=`<input type="checkbox" class="pitch-check" data-pitch="${key}"> ${p.short}`;
    $("pitchChoices").appendChild(a);

    const b=document.createElement("label");
    b.className="option";
    b.innerHTML=`<input type="checkbox" class="label-check" data-label="${key}"> ${p.short}`;
    $("labelChoices").appendChild(b);
  });
}

function syncControls(){
  $("preset").value=state.preset;
  document.querySelector(`input[name=mode][value="${state.mode}"]`).checked=true;
  document.querySelector(`input[name=staffType][value="${state.staffOverride}"]`).checked=true;
  document.querySelector(`input[name=notehead][value="${state.noteheadOverride}"]`).checked=true;
  document.querySelectorAll(".pitch-check").forEach(c=>c.checked=state.selected.includes(c.dataset.pitch));
  document.querySelectorAll(".label-check").forEach(c=>c.checked=state.labels.includes(c.dataset.label));
  $("labelsOn").checked=state.labels.length>0;
  $("handsOn").checked=state.showHands;
  $("beatsOn").checked=state.showBeats;
  $("repeatsOn").checked=state.allowRepeats;
}

function applyPreset(key){
  state.preset=key;
  state.staffOverride="auto";
  state.noteheadOverride="auto";
  state.selected=[...PRESETS[key].pitches];
  state.labels=[...PRESETS[key].pitches];
  syncControls();
}

function readControls(){
  state.preset=$("preset").value;
  state.mode=document.querySelector("input[name=mode]:checked").value;
  state.staffOverride=document.querySelector("input[name=staffType]:checked").value;
  state.noteheadOverride=document.querySelector("input[name=notehead]:checked").value;

  const selected=[...document.querySelectorAll(".pitch-check:checked")].map(c=>c.dataset.pitch);
  if(selected.length)state.selected=selected;

  state.labels=$("labelsOn").checked
    ? [...document.querySelectorAll(".label-check:checked")].map(c=>c.dataset.label)
    : [];
  state.showHands=$("handsOn").checked;
  state.showBeats=$("beatsOn").checked;
  state.allowRepeats=$("repeatsOn").checked;
}

function makeUnlimited(){
  const result=[];
  function add(prefix){
    if(prefix.length===4){result.push([...prefix]);return}
    state.selected.forEach(p=>{
      if(!state.allowRepeats && prefix.length && prefix[prefix.length-1]===p)return;
      prefix.push(p);add(prefix);prefix.pop();
    });
  }
  add([]);
  return result;
}
function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function rebuild(){
  state.deck=state.mode==="curriculum"
    ? preset().curriculum.map(x=>[...x])
    : shuffleArray(makeUnlimited());
  state.index=0;
  render();
}

function renderStaff(){
  $("staff").innerHTML="";
  $("labels").innerHTML="";
  const positions=staffType()===3?[18,50,82]:[18,34,50,66,82];
  positions.forEach(y=>{
    const line=document.createElement("div");
    line.className="staff-line";
    line.style.top=`${y}%`;
    $("staff").appendChild(line);
  });
  state.labels.filter(p=>state.selected.includes(p)).forEach(p=>{
    const label=document.createElement("div");
    label.className="pitch-label";
    label.textContent=PITCHES[p].short;
    label.style.top=`${pitchY(p)}%`;
    $("labels").appendChild(label);
  });
}

function renderCard(){
  $("staff").querySelectorAll(".note").forEach(n=>n.remove());
  if(!state.deck.length)return;
  const melody=state.deck[state.index];
  melody.forEach((p,i)=>{
    const n=document.createElement("div");
    n.className=`note ${notehead()}`;
    n.style.left=`${((i+.5)/melody.length)*100}%`;
    n.style.top=`${pitchY(p)}%`;
    $("staff").appendChild(n);
  });

  $("handRow").innerHTML="";
  $("handRow").style.gridTemplateColumns=`repeat(${melody.length},1fr)`;
  melody.forEach((p,i)=>{
    const beat=document.createElement("div");
    beat.className="beat";
    const handKey=PITCHES[p].hand;
    beat.innerHTML=`
      <div class="hand-wrap">
        ${state.showHands?`<img class="hand-img" src="${HAND_IMAGES[handKey]}" alt="${PITCHES[p].name} hand sign">`:""}
      </div>
      ${state.showBeats?`<div class="beat-number">${i+1}</div>`:""}
    `;
    $("handRow").appendChild(beat);
  });

  $("counter").textContent=`Card ${state.index+1} of ${state.deck.length}`;
}

function render(){
  $("subtitle").textContent=preset().title;
  renderStaff();
  renderCard();
}
function next(){state.index=(state.index+1)%state.deck.length;renderCard()}
function back(){state.index=(state.index-1+state.deck.length)%state.deck.length;renderCard()}
function openPanel(){$("panel").classList.add("open");$("overlay").classList.add("show")}
function closePanel(){$("panel").classList.remove("open");$("overlay").classList.remove("show")}

buildChecklists();
syncControls();
rebuild();

$("preset").addEventListener("change",e=>applyPreset(e.target.value));
$("settingsButton").addEventListener("click",openPanel);
$("close").addEventListener("click",closePanel);
$("overlay").addEventListener("click",closePanel);
$("apply").addEventListener("click",()=>{readControls();rebuild();closePanel()});
$("next").addEventListener("click",next);
$("back").addEventListener("click",back);
$("shuffle").addEventListener("click",()=>{state.deck=shuffleArray(state.deck);state.index=0;renderCard()});
document.addEventListener("keydown",e=>{
  if($("panel").classList.contains("open"))return;
  if(e.code==="Space"||e.code==="ArrowRight"){e.preventDefault();next()}
  if(e.code==="ArrowLeft"){e.preventDefault();back()}
});
</script>
</body>
</html>
