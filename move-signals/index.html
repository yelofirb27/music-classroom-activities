<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Move Signals</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    #game {
      position: fixed;
      inset: 0;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 35px;
      text-align: center;

      background-color: #e53935;

      transition:
        background-color 0.22s ease,
        color 0.22s ease;
    }

    #command {
      margin: 0;

      width: 100%;
      max-width: calc(100vw - 40px);

      color: white;
      font-size: clamp(58px, 16vw, 245px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 2px;

      text-transform: uppercase;
      overflow-wrap: anywhere;

      text-shadow:
        5px 5px 0 rgba(0, 0, 0, 0.3);

      transition:
        opacity 0.12s ease,
        transform 0.12s ease,
        color 0.2s ease;
    }

    #command.changing {
      opacity: 0;
      transform: scale(0.96);
    }

    #instruction {
      position: fixed;
      left: 0;
      bottom: 24px;
      z-index: 3;

      width: 100%;
      margin: 0;
      padding: 0 20px;

      color: white;
      font-size: clamp(17px, 2.4vw, 28px);
      font-weight: bold;
      text-align: center;

      pointer-events: none;

      text-shadow:
        2px 2px 0 rgba(0, 0, 0, 0.35);
    }

    .dark-text {
      color: #111 !important;

      text-shadow:
        3px 3px 0 rgba(255, 255, 255, 0.65) !important;
    }

    #sidebar {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;

      width: 255px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;

      padding: 15px;

      background: rgba(255, 255, 255, 0.98);
      color: #111;

      border: 3px solid #222;
      border-radius: 14px;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35);

      opacity: 1;
      transform: translateX(0);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    #sidebar.hidden {
      opacity: 0;
      transform: translateX(25px);
      pointer-events: none;
    }

    #sidebar h2 {
      margin: 0 0 12px;
      font-size: 22px;
      text-align: center;
    }

    .signal-option {
      display: flex;
      align-items: center;
      gap: 8px;

      margin: 7px 0;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    .signal-option input {
      width: 18px;
      height: 18px;
      margin: 0;

      cursor: pointer;
    }

    .dot {
      width: 19px;
      height: 19px;
      flex-shrink: 0;

      border: 2px solid #333;
      border-radius: 50%;
    }

    .green  { background: #28a745; }
    .red    { background: #e53935; }
    .yellow { background: #ffd92f; }
    .blue   { background: #1687d9; }
    .purple { background: #8e44ad; }
    .pink   { background: #ff69b4; }
    .brown  { background: #8b5a2b; }
    .orange { background: #ff8c00; }
    .black  { background: #000; }
    .white  { background: #fff; }

    .section {
      margin-top: 14px;
      padding-top: 12px;

      border-top: 1px solid #aaa;
    }

    .section-title {
      margin: 0 0 8px;

      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 2px solid #222;
      border-radius: 8px;

      padding: 8px 10px;

      background: #f1f1f1;
      color: #111;

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }

    button:active {
      transform: translateY(1px);
    }

    .button-row button {
      flex: 1;
    }

    .wide-button {
      width: 100%;
      margin-top: 8px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin: 8px 0;

      font-size: 13px;
      font-weight: bold;
    }

    .setting-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .setting-row select {
      min-width: 95px;
      padding: 5px;

      border: 1px solid #555;
      border-radius: 6px;

      background: white;
    }

    #autoButton.active {
      background: #d7f5dc;
      border-color: #247a35;
    }

    #showButton {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 19;

      padding: 6px 9px;

      background: rgba(255, 255, 255, 0.94);
      color: #111;

      border: 1px solid rgba(0, 0, 0, 0.55);
      border-radius: 7px;

      font-size: 11px;
      font-weight: bold;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.3);

      opacity: 0;
      transform: translateY(-6px);

      pointer-events: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        background-color 0.15s ease;
    }

    #showButton.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #showButton:hover {
      background: white;
    }

    #modeBadge {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 4;

      display: none;

      padding: 5px 8px;

      background: rgba(255, 255, 255, 0.9);
      color: #111;

      border: 1px solid rgba(0, 0, 0, 0.45);
      border-radius: 7px;

      font-size: 11px;
      font-weight: bold;

      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.25);
    }

    #modeBadge.visible {
      display: block;
    }

    #help {
      margin: 12px 0 0;
      padding-top: 10px;

      border-top: 1px solid #aaa;

      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 600px) {
      #sidebar {
        top: 7px;
        right: 7px;

        width: 225px;
        max-height: calc(100vh - 14px);
      }

      #command {
        max-width: calc(100vw - 25px);
        font-size: clamp(50px, 15vw, 150px);
      }

      #showButton {
        top: 7px;
        right: 7px;

        padding: 5px 7px;
        font-size: 10px;
      }

      #modeBadge {
        top: 7px;
        left: 7px;
      }
    }
  </style>
</head>

<body>
  <main id="game" aria-live="polite">
    <h1 id="command">STOP</h1>
  </main>

  <p id="instruction">
    Choose your signals, then press the spacebar
  </p>

  <div id="modeBadge">
    AUTO MODE
  </div>

  <aside id="sidebar">
    <h2>Choose Signals</h2>

    <label class="signal-option">
      <input type="checkbox" value="green" checked>
      <span class="dot green"></span>
      Green — Walk
    </label>

    <label class="signal-option">
      <input type="checkbox" value="red" checked>
      <span class="dot red"></span>
      Red — Stop
    </label>

    <label class="signal-option">
      <input type="checkbox" value="yellow" checked>
      <span class="dot yellow"></span>
      Yellow — Jog
    </label>

    <label class="signal-option">
      <input type="checkbox" value="blue" checked>
      <span class="dot blue"></span>
      Blue — Tiptoe
    </label>

    <label class="signal-option">
      <input type="checkbox" value="purple" checked>
      <span class="dot purple"></span>
      Purple — Jump
    </label>

    <label class="signal-option">
      <input type="checkbox" value="pink" checked>
      <span class="dot pink"></span>
      Pink — Hop
    </label>

    <label class="signal-option">
      <input type="checkbox" value="brown" checked>
      <span class="dot brown"></span>
      Brown — Gallop
    </label>

    <label class="signal-option">
      <input type="checkbox" value="orange" checked>
      <span class="dot orange"></span>
      Orange — Scarecrow
    </label>

    <label class="signal-option">
      <input type="checkbox" value="black" checked>
      <span class="dot black"></span>
      Black — Cat
    </label>

    <label class="signal-option">
      <input type="checkbox" value="white" checked>
      <span class="dot white"></span>
      White — Ghost
    </label>

    <div class="button-row">
      <button id="allButton" type="button">
        Select All
      </button>

      <button id="clearButton" type="button">
        Clear
      </button>
    </div>

    <div class="section">
      <p class="section-title">Game Settings</p>

      <label class="setting-row">
        <span>Sound</span>
        <input id="soundToggle" type="checkbox">
      </label>

      <label class="setting-row">
        <span>Auto speed</span>

        <select id="speedSelect">
          <option value="3000">3 seconds</option>
          <option value="4000">4 seconds</option>
          <option value="5000" selected>5 seconds</option>
          <option value="6000">6 seconds</option>
          <option value="8000">8 seconds</option>
          <option value="10000">10 seconds</option>
        </select>
      </label>

      <button id="autoButton" class="wide-button" type="button">
        Start Auto Mode
      </button>

      <button id="fullscreenButton" class="wide-button" type="button">
        Fullscreen
      </button>

      <button id="resetButton" class="wide-button" type="button">
        Reset Game
      </button>

      <button id="hideButton" class="wide-button" type="button">
        Hide Choices
      </button>
    </div>

    <div id="help">
      Space or screen tap = next signal<br>
      H = show or hide choices<br>
      A = start or stop auto mode<br>
      F = fullscreen &nbsp;•&nbsp; R = reset
    </div>
  </aside>

  <button id="showButton" type="button">
    Show Choices
  </button>

  <script>
    const signals = [
      {
        id: "green",
        command: "WALK",
        color: "#28a745",
        darkText: false,
        soundFrequency: 440
      },
      {
        id: "red",
        command: "STOP",
        color: "#e53935",
        darkText: false,
        soundFrequency: 220
      },
      {
        id: "yellow",
        command: "JOG",
        color: "#ffd92f",
        darkText: true,
        soundFrequency: 520
      },
      {
        id: "blue",
        command: "TIPTOE",
        color: "#1687d9",
        darkText: false,
        soundFrequency: 660
      },
      {
        id: "purple",
        command: "JUMP",
        color: "#8e44ad",
        darkText: false,
        soundFrequency: 780
      },
      {
        id: "pink",
        command: "HOP",
        color: "#ff69b4",
        darkText: true,
        soundFrequency: 700
      },
      {
        id: "brown",
        command: "GALLOP",
        color: "#8b5a2b",
        darkText: false,
        soundFrequency: 340
      },
      {
        id: "orange",
        command: "SCARECROW",
        color: "#ff8c00",
        darkText: true,
        soundFrequency: 580
      },
      {
        id: "black",
        command: "CAT",
        color: "#000000",
        darkText: false,
        soundFrequency: 300
      },
      {
        id: "white",
        command: "GHOST",
        color: "#ffffff",
        darkText: true,
        soundFrequency: 850
      }
    ];

    const game = document.getElementById("game");
    const command = document.getElementById("command");
    const instruction = document.getElementById("instruction");

    const sidebar = document.getElementById("sidebar");
    const showButton = document.getElementById("showButton");
    const hideButton = document.getElementById("hideButton");

    const allButton = document.getElementById("allButton");
    const clearButton = document.getElementById("clearButton");

    const soundToggle = document.getElementById("soundToggle");
    const speedSelect = document.getElementById("speedSelect");
    const autoButton = document.getElementById("autoButton");
    const fullscreenButton =
      document.getElementById("fullscreenButton");
    const resetButton = document.getElementById("resetButton");
    const modeBadge = document.getElementById("modeBadge");

    const checkboxes = Array.from(
      document.querySelectorAll(
        '.signal-option input[type="checkbox"]'
      )
    );

    let currentSignalId = "red";
    let recentSignalIds = ["red"];
    let gameStarted = false;

    let autoTimer = null;
    let autoModeRunning = false;

    let audioContext = null;

    function saveSettings() {
      const selectedIds = checkboxes
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);

      const settings = {
        selectedIds,
        soundEnabled: soundToggle.checked,
        speed: speedSelect.value
      };

      localStorage.setItem(
        "moveSignalsSettingsV2",
        JSON.stringify(settings)
      );
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(
          localStorage.getItem("moveSignalsSettingsV2")
        );

        if (!saved) {
          return;
        }

        if (Array.isArray(saved.selectedIds)) {
          checkboxes.forEach(checkbox => {
            checkbox.checked =
              saved.selectedIds.includes(checkbox.value);
          });
        }

        soundToggle.checked = Boolean(saved.soundEnabled);

        const validSpeed = Array.from(speedSelect.options)
          .some(option => option.value === String(saved.speed));

        if (validSpeed) {
          speedSelect.value = String(saved.speed);
        }
      } catch (error) {
        console.warn("Saved settings could not be loaded.");
      }
    }

    function getSelectedSignals() {
      const selectedIds = checkboxes
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);

      return signals.filter(signal =>
        selectedIds.includes(signal.id)
      );
    }

    function chooseRandomSignal() {
      const selectedSignals = getSelectedSignals();

      if (selectedSignals.length === 0) {
        return null;
      }

      if (selectedSignals.length === 1) {
        return selectedSignals[0];
      }

      const avoidCount =
        selectedSignals.length >= 4 ? 2 : 1;

      const recentToAvoid =
        recentSignalIds.slice(-avoidCount);

      let choices = selectedSignals.filter(
        signal => !recentToAvoid.includes(signal.id)
      );

      if (choices.length === 0) {
        choices = selectedSignals.filter(
          signal => signal.id !== currentSignalId
        );
      }

      if (choices.length === 0) {
        choices = selectedSignals;
      }

      const randomIndex = Math.floor(
        Math.random() * choices.length
      );

      return choices[randomIndex];
    }

    function playSound(frequency) {
      if (!soundToggle.checked) {
        return;
      }

      try {
        if (!audioContext) {
          audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
          0.0001,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.12,
          audioContext.currentTime + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioContext.currentTime + 0.22
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.24);
      } catch (error) {
        console.warn("Sound could not be played.");
      }
    }

    function displaySignal(signal) {
      command.classList.add("changing");

      window.setTimeout(() => {
        game.style.backgroundColor = signal.color;
        command.textContent = signal.command;

        command.classList.toggle(
          "dark-text",
          signal.darkText
        );

        instruction.classList.toggle(
          "dark-text",
          signal.darkText
        );

        instruction.style.display = "none";

        currentSignalId = signal.id;
        recentSignalIds.push(signal.id);

        if (recentSignalIds.length > 3) {
          recentSignalIds.shift();
        }

        playSound(signal.soundFrequency);

        command.classList.remove("changing");
      }, 110);
    }

    function hideSidebar() {
      sidebar.classList.add("hidden");
      showButton.classList.add("visible");
    }

    function showSidebar() {
      sidebar.classList.remove("hidden");
      showButton.classList.remove("visible");
    }

    function toggleSidebar() {
      if (sidebar.classList.contains("hidden")) {
        showSidebar();
      } else {
        hideSidebar();
      }
    }

    function showNoSelectionMessage() {
      stopAutoMode();

      game.style.backgroundColor = "#cccccc";

      command.textContent = "CHOOSE A SIGNAL";
      command.classList.add("dark-text");

      instruction.textContent =
        "Select at least one signal";

      instruction.classList.add("dark-text");
      instruction.style.display = "block";

      showSidebar();
    }

    function showNextSignal() {
      const signal = chooseRandomSignal();

      if (!signal) {
        showNoSelectionMessage();
        return;
      }

      if (!gameStarted) {
        hideSidebar();
        gameStarted = true;
      }

      displaySignal(signal);
    }

    function startAutoMode() {
      if (getSelectedSignals().length === 0) {
        showNoSelectionMessage();
        return;
      }

      stopAutoMode();

      autoModeRunning = true;

      autoButton.textContent = "Stop Auto Mode";
      autoButton.classList.add("active");

      modeBadge.classList.add("visible");

      hideSidebar();

      if (!gameStarted) {
        gameStarted = true;
      }

      showNextSignal();

      autoTimer = window.setInterval(
        showNextSignal,
        Number(speedSelect.value)
      );
    }

    function stopAutoMode() {
      if (autoTimer) {
        window.clearInterval(autoTimer);
        autoTimer = null;
      }

      autoModeRunning = false;

      autoButton.textContent = "Start Auto Mode";
      autoButton.classList.remove("active");

      modeBadge.classList.remove("visible");
    }

    function toggleAutoMode() {
      if (autoModeRunning) {
        stopAutoMode();
      } else {
        startAutoMode();
      }
    }

    function resetGame() {
      stopAutoMode();

      currentSignalId = "red";
      recentSignalIds = ["red"];
      gameStarted = false;

      game.style.backgroundColor = "#e53935";

      command.textContent = "STOP";
      command.classList.remove("dark-text");
      command.classList.remove("changing");

      instruction.textContent =
        "Choose your signals, then press the spacebar";

      instruction.classList.remove("dark-text");
      instruction.style.display = "block";

      showSidebar();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement
          .requestFullscreen()
          .catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if (event.code === "Space") {
        event.preventDefault();

        if (autoModeRunning) {
          stopAutoMode();
        }

        showNextSignal();
      }

      if (key === "h") {
        toggleSidebar();
      }

      if (key === "a") {
        toggleAutoMode();
      }

      if (key === "r") {
        resetGame();
      }

      if (key === "f") {
        toggleFullscreen();
      }
    });

    game.addEventListener("click", () => {
      if (autoModeRunning) {
        return;
      }

      showNextSignal();
    });

    checkboxes.forEach(checkbox => {
      checkbox.addEventListener("change", () => {
        saveSettings();

        if (
          autoModeRunning &&
          getSelectedSignals().length === 0
        ) {
          showNoSelectionMessage();
        }
      });
    });

    soundToggle.addEventListener(
      "change",
      saveSettings
    );

    speedSelect.addEventListener("change", () => {
      saveSettings();

      if (autoModeRunning) {
        startAutoMode();
      }
    });

    allButton.addEventListener("click", () => {
      checkboxes.forEach(checkbox => {
        checkbox.checked = true;
      });

      saveSettings();
    });

    clearButton.addEventListener("click", () => {
      checkboxes.forEach(checkbox => {
        checkbox.checked = false;
      });

      saveSettings();

      if (autoModeRunning) {
        showNoSelectionMessage();
      }
    });

    autoButton.addEventListener(
      "click",
      toggleAutoMode
    );

    fullscreenButton.addEventListener(
      "click",
      toggleFullscreen
    );

    resetButton.addEventListener(
      "click",
      resetGame
    );

    hideButton.addEventListener(
      "click",
      hideSidebar
    );

    showButton.addEventListener(
      "click",
      showSidebar
    );

    loadSettings();
  </script>
</body>
</html>
