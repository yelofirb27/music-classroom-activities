<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coppernickel Goes Mondrian, Music in Art</title>
<style>
:root{
  --red:#e3342f; --blue:#6f95c8; --yellow:#fff59a; --white:#fff; --black:#050505;
  --wall1:#e8e2d8; --wall2:#d8d0c4; --label:#f7f1e7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#202020}
body{
  min-height:100dvh;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,rgba(0,0,0,.018) 2px,rgba(0,0,0,.018) 4px),
    linear-gradient(180deg,var(--wall1),var(--wall2));
}
.app{
  height:100dvh;width:100%;display:grid;grid-template-rows:auto 1fr;
  gap:clamp(6px,1vh,10px);padding:clamp(6px,1vh,11px) clamp(8px,1.5vw,16px)
}
.museum-header{
  width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center
}
.exhibit-card{
  background:var(--label);border:1px solid rgba(60,50,40,.28);box-shadow:0 4px 12px rgba(51,43,35,.14);
  padding:clamp(6px,.9vh,10px) clamp(10px,1.7vw,17px)
}
.kicker{
  font-family:Georgia,"Times New Roman",serif;font-size:clamp(.6rem,1.2vw,.74rem);
  letter-spacing:.18em;text-transform:uppercase;color:#6a6259;margin-bottom:2px
}
h1{
  margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:500;
  font-size:clamp(1.25rem,2.9vw,2.25rem);line-height:1.02;color:#1f1b18
}
.subtitle{
  margin:3px 0 0;font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(.73rem,1.5vw,.94rem);line-height:1.15;color:#5b554f
}
.controls{display:grid;grid-template-columns:repeat(3,auto);gap:7px}
button{font:inherit;font-weight:700;border:0;cursor:pointer;touch-action:manipulation}
.control{
  border-radius:4px;padding:8px 11px;min-height:38px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.13)
}
#rhythmToggle{background:#1f1f1f;color:#fff}
#resetBtn,#fullscreenBtn{background:var(--label);color:#1f1f1f;border:1px solid #6b655e}

.gallery{min-height:0;display:flex;align-items:center;justify-content:center}
.frame{
  height:100%;max-height:100%;aspect-ratio:4/3;padding:clamp(6px,1.1vh,12px);
  background:linear-gradient(145deg,#4b4037,#211c18 52%,#3a312a);
  box-shadow:0 12px 24px rgba(0,0,0,.21),inset 0 0 0 2px rgba(255,255,255,.08),inset 0 0 0 7px rgba(0,0,0,.22)
}
.canvas{width:100%;height:100%;background:#fff}
.grid{
  width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  gap:clamp(6px,1.25vh,12px);background:#000;border:2px solid #2d2d2d
}
.cell{
  position:relative;border:0;border-radius:0;box-shadow:none;padding:0;min-width:0;min-height:0;
  background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden
}
.cell.red{background:var(--red)} .cell.blue{background:var(--blue)} .cell.yellow{background:var(--yellow)} .cell.white{background:#fff}
.rhythm-mark{display:none;width:82%;height:82%;align-items:center;justify-content:center;flex-direction:column;gap:0;pointer-events:none}
body.show-rhythm .rhythm-mark{display:flex}
.note-svg{width:56%;height:56%;max-width:88px;max-height:78px}
.rhythm-label{font-size:clamp(.7rem,1.95vw,1.25rem);line-height:1;font-weight:900;letter-spacing:-.04em}
.cell.red .rhythm-label{color:#fff}.cell.blue .rhythm-label{color:#3152a0}.cell.yellow .rhythm-label{color:#657028}.cell.white .rhythm-label{display:none}
.rest-png{object-fit:contain}

.backdrop{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(25,22,19,.58);padding:16px
}
.backdrop.open{display:flex}
.picker{width:min(700px,95vw);background:var(--label);border:1px solid rgba(60,50,40,.38);padding:14px;box-shadow:0 18px 60px rgba(0,0,0,.36)}
.picker h2{margin:0 0 10px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(1.1rem,2.8vw,1.6rem)}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.choice{
  aspect-ratio:1.2/1;min-height:100px;border-radius:0;border:2px solid #171717;box-shadow:none;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;padding:8px
}
.choice.red{background:var(--red);color:#fff}.choice.blue{background:var(--blue);color:#3152a0}.choice.yellow{background:var(--yellow);color:#657028}.choice.white{background:#fff;color:#111}
.choice .note-svg{width:60%;height:60%}.choice .rhythm-label{font-size:clamp(.85rem,2.4vw,1.35rem)}
.choice>.note-svg,.choice>.rhythm-label{display:none}
body.show-rhythm .choice>.note-svg,body.show-rhythm .choice>.rhythm-label{display:block}
body.show-rhythm .choice.white>.rhythm-label{display:none}
.cancel{display:block;margin:10px auto 0;background:#e7e1d7;color:#222;border:1px solid #81786f;padding:8px 16px}

@media(max-width:760px){
  .app{padding:6px;gap:5px}.museum-header{grid-template-columns:1fr;gap:5px}.controls{grid-template-columns:repeat(3,1fr)}
  .control{padding:7px 4px;min-height:34px;font-size:.78rem}.gallery{align-items:flex-start}
  .frame{width:min(96vw,760px);height:auto;max-height:100%;aspect-ratio:4/3;padding:6px}.grid{gap:6px}
  .choices{grid-template-columns:repeat(2,1fr)}
}
@media(orientation:landscape) and (max-height:700px){
  .app{padding:4px 7px;gap:4px}.museum-header{grid-template-columns:minmax(0,1fr) auto;gap:6px}
  .exhibit-card{padding:4px 8px}.kicker{font-size:.54rem}h1{font-size:clamp(.96rem,2.4vw,1.48rem)}
  .subtitle{font-size:.65rem;margin-top:1px}.control{min-height:30px;padding:4px 6px;font-size:.7rem}
  .frame{width:auto;height:100%;padding:5px}.grid{gap:5px}.choice{min-height:76px}
}
</style>
</head>
<body>
<div class="app">
  <div class="museum-header">
    <div class="exhibit-card">
      <div class="kicker">Interactive Gallery</div>
      <h1>Coppernickel Goes Mondrian, Music in Art</h1>
      <p class="subtitle">Touch a rectangle to add color. Reveal the rhythms to turn your artwork into music.</p>
    </div>
    <div class="controls">
      <button id="rhythmToggle" class="control" type="button">Show Rhythm</button>
      <button id="resetBtn" class="control" type="button">Clear Canvas</button>
      <button id="fullscreenBtn" class="control" type="button">Full Screen</button>
    </div>
  </div>

  <div class="gallery">
    <div class="frame">
      <div class="canvas">
        <div class="grid" id="grid" aria-label="4 by 4 musical Mondrian canvas"></div>
      </div>
    </div>
  </div>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="picker">
    <h2 id="pickerTitle">Choose a Color</h2>
    <div class="choices">
      <button class="choice red" data-color="red" type="button"></button>
      <button class="choice blue" data-color="blue" type="button"></button>
      <button class="choice yellow" data-color="yellow" type="button"></button>
      <button class="choice white" data-color="white" type="button"></button>
    </div>
    <button class="cancel" id="closePicker" type="button">Cancel</button>
  </div>
</div>

<script>
const grid=document.getElementById('grid');
const backdrop=document.getElementById('backdrop');
const rhythmToggle=document.getElementById('rhythmToggle');
const resetBtn=document.getElementById('resetBtn');
const fullscreenBtn=document.getElementById('fullscreenBtn');
const closePicker=document.getElementById('closePicker');

let selectedCell=null;
let showRhythm=false;

function quarterNoteSVG(){
  return `<svg class="note-svg" viewBox="0 0 100 120" aria-hidden="true">
    <line x1="65" y1="15" x2="65" y2="78" stroke="#111" stroke-width="5"/>
    <ellipse cx="48" cy="82" rx="17" ry="12" transform="rotate(-18 48 82)" fill="#111"/>
  </svg>`;
}
function eighthPairSVG(){
  return `<svg class="note-svg" viewBox="0 0 120 110" aria-hidden="true">
    <line x1="32" y1="22" x2="32" y2="77" stroke="#111" stroke-width="5"/>
    <line x1="88" y1="22" x2="88" y2="77" stroke="#111" stroke-width="5"/>
    <line x1="32" y1="22" x2="88" y2="22" stroke="#111" stroke-width="8"/>
    <ellipse cx="20" cy="82" rx="16" ry="11" transform="rotate(-18 20 82)" fill="#111"/>
    <ellipse cx="76" cy="82" rx="16" ry="11" transform="rotate(-18 76 82)" fill="#111"/>
  </svg>`;
}
function quarterRestPNG(){return `<img class="note-svg rest-png" src="quarter-rest.png" alt="" aria-hidden="true">`}

function rhythmMarkup(color){
  if(color==='red') return `<div class="rhythm-mark">${quarterNoteSVG()}<div class="rhythm-label">Red</div></div>`;
  if(color==='blue') return `<div class="rhythm-mark">${quarterNoteSVG()}<div class="rhythm-label">Blue</div></div>`;
  if(color==='yellow') return `<div class="rhythm-mark">${eighthPairSVG()}<div class="rhythm-label">Yellow</div></div>`;
  return `<div class="rhythm-mark">${quarterRestPNG()}</div>`;
}
function choiceMarkup(color){
  if(color==='red') return `${quarterNoteSVG()}<div class="rhythm-label">Red</div>`;
  if(color==='blue') return `${quarterNoteSVG()}<div class="rhythm-label">Blue</div>`;
  if(color==='yellow') return `${eighthPairSVG()}<div class="rhythm-label">Yellow</div>`;
  return `${quarterRestPNG()}`;
}
function makeGrid(){
  grid.innerHTML='';
  for(let i=0;i<16;i++){
    const cell=document.createElement('button');
    cell.type='button';
    cell.className='cell white';
    cell.dataset.color='white';
    cell.setAttribute('aria-label',`Rectangle ${i+1}, blank`);
    cell.addEventListener('click',()=>{
      selectedCell=cell;
      document.getElementById('pickerTitle').textContent=showRhythm?'Choose a Color and Rhythm':'Choose a Color';
      backdrop.classList.add('open');
    });
    grid.appendChild(cell);
  }
}
function setCellColor(cell,color){
  cell.classList.remove('red','blue','yellow','white');
  cell.classList.add(color);
  cell.dataset.color=color;
  cell.innerHTML=rhythmMarkup(color);
}
document.querySelectorAll('.choice').forEach(choice=>{
  const color=choice.dataset.color;
  choice.innerHTML=choiceMarkup(color);
  choice.addEventListener('click',()=>{
    if(selectedCell) setCellColor(selectedCell,color);
    selectedCell=null;
    backdrop.classList.remove('open');
  });
});
rhythmToggle.addEventListener('click',()=>{
  showRhythm=!showRhythm;
  document.body.classList.toggle('show-rhythm',showRhythm);
  rhythmToggle.textContent=showRhythm?'Hide Rhythm':'Show Rhythm';
});
resetBtn.addEventListener('click',makeGrid);
fullscreenBtn.addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
});
document.addEventListener('fullscreenchange',()=>{
  fullscreenBtn.textContent=document.fullscreenElement?'Exit Full Screen':'Full Screen';
});
closePicker.addEventListener('click',()=>{selectedCell=null;backdrop.classList.remove('open')});
backdrop.addEventListener('click',e=>{if(e.target===backdrop){selectedCell=null;backdrop.classList.remove('open')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selectedCell=null;backdrop.classList.remove('open')}});
makeGrid();
</script>
</body>
</html>
