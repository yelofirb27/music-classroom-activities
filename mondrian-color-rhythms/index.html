<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coppernickel Goes Mondrian, Music in Art</title>

<style>
  :root{
    --red:#e3342f;
    --blue:#6f95c8;
    --yellow:#fff59a;
    --white:#ffffff;
    --black:#050505;
    --ink:#1d2430;
    --page:#f7f5ef;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    min-height:100%;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--page);
    color:var(--ink);
  }

  body{
    display:flex;
    justify-content:center;
    padding:18px;
    overscroll-behavior:none;
  }

  .app{
    width:min(1120px,100%);
  }

  h1{
    margin:4px 0 6px;
    text-align:center;
    font-size:clamp(1.7rem,4vw,3rem);
    line-height:1.05;
    color:#172033;
  }

  .subtitle{
    text-align:center;
    margin:0 0 14px;
    font-size:clamp(.95rem,2vw,1.15rem);
    color:#4c5568;
  }

  .controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 16px;
  }

  button{
    font:inherit;
    font-weight:800;
    border:0;
    border-radius:14px;
    padding:12px 18px;
    cursor:pointer;
    touch-action:manipulation;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
  }

  #rhythmToggle{
    background:#172033;
    color:white;
  }

  #resetBtn{
    background:white;
    color:#172033;
    border:2px solid #172033;
  }

  .canvas-wrap{
    width:min(820px,94vw);
    margin:0 auto;
  }

  .mondrian{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    width:100%;
    aspect-ratio:4 / 3;
    background:var(--black);
    border:3px solid #333;
    gap:14px;
    padding:0;
    box-shadow:0 12px 28px rgba(0,0,0,.16);
  }

  .cell{
    position:relative;
    border:0;
    border-radius:0;
    box-shadow:none;
    padding:0;
    min-width:0;
    min-height:0;
    background:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .cell:focus-visible{
    outline:6px solid #7d5cff;
    outline-offset:-6px;
    z-index:2;
  }

  .cell.red{background:var(--red);}
  .cell.blue{background:var(--blue);}
  .cell.yellow{background:var(--yellow);}
  .cell.white{background:var(--white);}

  .rhythm-mark{
    display:none;
    width:82%;
    height:82%;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:2px;
    pointer-events:none;
  }

  body.show-rhythm .rhythm-mark{
    display:flex;
  }

  .note-svg{
    width:58%;
    height:58%;
    max-width:92px;
    max-height:92px;
  }

  .rhythm-label{
    font-size:clamp(.85rem,2.5vw,1.55rem);
    line-height:1;
    font-weight:900;
    letter-spacing:-.04em;
  }

  .cell.red .rhythm-label{color:white;}
  .cell.blue .rhythm-label{color:#3152a0;}
  .cell.yellow .rhythm-label{color:#657028;}
  .cell.white .rhythm-label{display:none;}

  .picker-backdrop{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(12,16,24,.48);
    padding:18px;
  }

  .picker-backdrop.open{
    display:flex;
  }

  .picker{
    width:min(720px,96vw);
    background:white;
    border-radius:22px;
    padding:18px;
    box-shadow:0 18px 60px rgba(0,0,0,.35);
  }

  .picker h2{
    margin:0 0 14px;
    text-align:center;
    font-size:clamp(1.25rem,3vw,1.8rem);
  }

  .choices{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }

  .choice{
    aspect-ratio:1.18 / 1;
    min-height:120px;
    border-radius:14px;
    border:3px solid #171717;
    box-shadow:none;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:2px;
    padding:8px;
  }

  .choice.red{background:var(--red);color:white;}
  .choice.blue{background:var(--blue);color:#3152a0;}
  .choice.yellow{background:var(--yellow);color:#657028;}
  .choice.white{background:white;color:#111;}

  .choice .note-svg{
    width:62%;
    height:62%;
  }

  .choice .rhythm-label{
    font-size:clamp(1rem,3vw,1.55rem);
  }

  .choice.white .rhythm-label{visibility:hidden;}

  .choice > .note-svg,
  .choice > .rhythm-label{
    display:none;
  }

  body.show-rhythm .choice > .note-svg{
    display:block;
  }

  body.show-rhythm .choice > .rhythm-label{
    display:block;
  }

  body.show-rhythm .choice.white > .rhythm-label{
    display:none;
  }

  .rest-png{
    object-fit:contain;
  }

  .close-picker{
    display:block;
    margin:14px auto 0;
    background:#eceef3;
    color:#222;
  }

  @media (max-width:700px){
    body{padding:10px;}
    .mondrian{
      gap:9px;
      border-width:2px;
    }
    .choices{
      grid-template-columns:repeat(2,1fr);
    }
    .choice{
      min-height:118px;
    }
  }

  @media (orientation:landscape) and (max-height:650px){
    body{padding:7px;}
    h1{font-size:1.45rem;margin:0 0 2px;}
    .subtitle{font-size:.85rem;margin-bottom:7px;}
    .controls{margin-bottom:8px;}
    button{padding:8px 13px;}
    .canvas-wrap{width:min(710px,78vw);}
    .picker{width:min(650px,92vw);}
    .choice{min-height:90px;}
  }
</style>
</head>

<body>
<div class="app">
  <h1>Coppernickel Goes Mondrian, Music in Art</h1>
  <p class="subtitle">Touch any rectangle to choose a color and build your own musical Mondrian.</p>

  <div class="controls">
    <button id="rhythmToggle" type="button">Show Rhythm</button>
    <button id="resetBtn" type="button">Clear Canvas</button>
  </div>

  <div class="canvas-wrap">
    <div class="mondrian" id="grid" aria-label="4 by 4 musical Mondrian canvas"></div>
  </div>
</div>

<div class="picker-backdrop" id="pickerBackdrop" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="picker">
    <h2 id="pickerTitle">Choose a Color</h2>
    <div class="choices">
      <button class="choice red" data-color="red" type="button" aria-label="Red quarter note">
        <span class="choice-rhythm"></span>
      </button>

      <button class="choice blue" data-color="blue" type="button" aria-label="Blue quarter note">
        <span class="choice-rhythm"></span>
      </button>

      <button class="choice yellow" data-color="yellow" type="button" aria-label="Yellow two eighth notes">
        <span class="choice-rhythm"></span>
      </button>

      <button class="choice white" data-color="white" type="button" aria-label="White quarter rest">
        <span class="choice-rhythm"></span>
      </button>
    </div>

    <button class="close-picker" id="closePicker" type="button">Cancel</button>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const backdrop = document.getElementById('pickerBackdrop');
  const rhythmToggle = document.getElementById('rhythmToggle');
  const resetBtn = document.getElementById('resetBtn');
  const closePicker = document.getElementById('closePicker');

  let selectedCell = null;
  let showRhythm = false;

  function quarterNoteSVG() {
    return `
      <svg class="note-svg" viewBox="0 0 100 120" aria-hidden="true">
        <line x1="65" y1="15" x2="65" y2="78" stroke="#111" stroke-width="5"/>
        <ellipse cx="48" cy="82" rx="17" ry="12" transform="rotate(-18 48 82)" fill="#111"/>
      </svg>`;
  }

  function eighthPairSVG() {
    return `
      <svg class="note-svg" viewBox="0 0 120 110" aria-hidden="true">
        <line x1="32" y1="22" x2="32" y2="77" stroke="#111" stroke-width="5"/>
        <line x1="88" y1="22" x2="88" y2="77" stroke="#111" stroke-width="5"/>
        <line x1="32" y1="22" x2="88" y2="22" stroke="#111" stroke-width="8"/>
        <ellipse cx="20" cy="82" rx="16" ry="11" transform="rotate(-18 20 82)" fill="#111"/>
        <ellipse cx="76" cy="82" rx="16" ry="11" transform="rotate(-18 76 82)" fill="#111"/>
      </svg>`;
  }

  function quarterRestSVG() {
    return `<img class="note-svg rest-png" src="quarter-rest.png" alt="" aria-hidden="true">`;
  }

  function rhythmMarkup(color) {
    if (color === 'red') {
      return `<div class="rhythm-mark">${quarterNoteSVG()}<div class="rhythm-label">Red</div></div>`;
    }
    if (color === 'blue') {
      return `<div class="rhythm-mark">${quarterNoteSVG()}<div class="rhythm-label">Blue</div></div>`;
    }
    if (color === 'yellow') {
      return `<div class="rhythm-mark">${eighthPairSVG()}<div class="rhythm-label">Yellow</div></div>`;
    }
    return `<div class="rhythm-mark">${quarterRestSVG()}<div class="rhythm-label">Rest</div></div>`;
  }

  function choiceMarkup(color) {
    if (color === 'red') return `${quarterNoteSVG()}<div class="rhythm-label">Red</div>`;
    if (color === 'blue') return `${quarterNoteSVG()}<div class="rhythm-label">Blue</div>`;
    if (color === 'yellow') return `${eighthPairSVG()}<div class="rhythm-label">Yellow</div>`;
    return `${quarterRestSVG()}<div class="rhythm-label">Rest</div>`;
  }

  function makeGrid() {
    grid.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell white';
      cell.dataset.color = 'white';
      cell.setAttribute('aria-label', `Rectangle ${i + 1}, white`);
      cell.innerHTML = rhythmMarkup('white');

      cell.addEventListener('click', () => {
        selectedCell = cell;
        document.getElementById('pickerTitle').textContent =
          showRhythm ? 'Choose a Color and Rhythm' : 'Choose a Color';
        backdrop.classList.add('open');
      });

      grid.appendChild(cell);
    }
  }

  function setCellColor(cell, color) {
    cell.classList.remove('red','blue','yellow','white');
    cell.classList.add(color);
    cell.dataset.color = color;
    cell.innerHTML = rhythmMarkup(color);

    const spoken = color === 'white' ? 'white quarter rest' :
                   color === 'yellow' ? 'yellow two eighth notes' :
                   `${color} quarter note`;
    cell.setAttribute('aria-label', spoken);
  }

  document.querySelectorAll('.choice').forEach(choice => {
    const color = choice.dataset.color;
    choice.querySelector('.choice-rhythm').outerHTML = choiceMarkup(color);

    choice.addEventListener('click', () => {
      if (selectedCell) {
        setCellColor(selectedCell, color);
      }
      selectedCell = null;
      backdrop.classList.remove('open');
    });
  });

  rhythmToggle.addEventListener('click', () => {
    showRhythm = !showRhythm;
    document.body.classList.toggle('show-rhythm', showRhythm);
    rhythmToggle.textContent = showRhythm ? 'Hide Rhythm' : 'Show Rhythm';
  });

  resetBtn.addEventListener('click', () => {
    document.querySelectorAll('.cell').forEach(cell => setCellColor(cell, 'white'));
  });

  closePicker.addEventListener('click', () => {
    selectedCell = null;
    backdrop.classList.remove('open');
  });

  backdrop.addEventListener('click', (event) => {
    if (event.target === backdrop) {
      selectedCell = null;
      backdrop.classList.remove('open');
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      selectedCell = null;
      backdrop.classList.remove('open');
    }
  });

  makeGrid();
</script>
</body>
</html>
