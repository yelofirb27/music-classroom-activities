<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Milk and Cookie Rhythm</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
  }

  .stage-wrap {
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
  }

  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 1664 / 928));
    aspect-ratio: 1664 / 928;
    background: url("background.png") center / 100% 100% no-repeat;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  .box {
    position: absolute;
    top: 30.1%;
    height: 34.6%;
    width: 19.6%;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  #box1 { left: 5.35%; }
  #box2 { left: 27.55%; }
  #box3 { left: 49.95%; }
  #box4 { left: 72.15%; }

  .placed {
    max-width: 72%;
    max-height: 78%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.18));
  }

  .source {
    position: absolute;
    z-index: 8;
    cursor: grab;
    touch-action: none;
  }

  .source:active { cursor: grabbing; }

  /* Invisible drag zones laid over the crisp cookie and milk artwork */
  #cookieSource {
    left: 20.6%;
    top: 68.6%;
    width: 18%;
    height: 29%;
  }

  #milkSource {
    left: 61.7%;
    top: 65.6%;
    width: 17%;
    height: 31%;
  }

  .source img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    opacity: 0;
  }

  #resetBtn {
    position: absolute;
    z-index: 20;
    right: 1.4%;
    bottom: 1.7%;
    border: 3px solid #e31718;
    background: rgba(255,255,255,.97);
    color: #e31718;
    font-size: clamp(14px, 1.8vw, 25px);
    font-weight: 800;
    padding: .45em .85em;
    border-radius: .55em;
    cursor: pointer;
    box-shadow: 0 3px 7px rgba(0,0,0,.22);
  }

  #resetBtn:hover { transform: scale(1.03); }
  #resetBtn:active { transform: scale(.98); }

  #dragGhost {
    position: absolute;
    z-index: 50;
    display: none;
    pointer-events: none;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.25));
  }

  #dragGhost.cookie { width: 12%; }
  #dragGhost.milk { width: 10%; }

  .box.hover {
    outline: 5px solid rgba(255, 40, 40, .75);
    outline-offset: -5px;
  }

  .box.has-item {
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="stage-wrap">
  <main id="stage" aria-label="Milk and Cookie Rhythm activity">
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>

    <div class="source" id="cookieSource" data-type="cookie" aria-label="Cookie">
      <img src="cookie.png" alt="">
    </div>

    <div class="source" id="milkSource" data-type="milk" aria-label="Milk">
      <img src="milk-new.png" alt="">
    </div>

    <button id="resetBtn" type="button">RESET</button>
    <img id="dragGhost" alt="">
  </main>
</div>

<script>
(() => {
  const stage = document.getElementById("stage");
  const boxes = [...document.querySelectorAll(".box")];
  const resetBtn = document.getElementById("resetBtn");
  const ghost = document.getElementById("dragGhost");

  let dragging = null;

  function imageFor(type) {
    return type === "cookie" ? "cookie.png" : "milk-new.png";
  }

  function startDrag(e, type) {
    e.preventDefault();
    dragging = { type, pointerId: e.pointerId };

    ghost.src = imageFor(type);
    ghost.className = type;
    ghost.style.display = "block";

    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    moveGhost(e);
  }

  function moveGhost(e) {
    if (!dragging) return;

    const rect = stage.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    ghost.style.left = x + "%";
    ghost.style.top = y + "%";

    boxes.forEach(box => box.classList.remove("hover"));
    const target = getBoxAt(e.clientX, e.clientY);
    if (target) target.classList.add("hover");
  }

  function getBoxAt(clientX, clientY) {
    for (const box of boxes) {
      const r = box.getBoundingClientRect();
      if (
        clientX >= r.left && clientX <= r.right &&
        clientY >= r.top && clientY <= r.bottom
      ) return box;
    }
    return null;
  }

  function endDrag(e) {
    if (!dragging) return;

    const target = getBoxAt(e.clientX, e.clientY);

    if (target) {
      target.innerHTML = "";
      const placed = document.createElement("img");
      placed.src = imageFor(dragging.type);
      placed.className = "placed";
      placed.alt = dragging.type === "cookie" ? "Cookie" : "Milk";
      target.appendChild(placed);
      target.classList.add("has-item");
    }

    boxes.forEach(box => box.classList.remove("hover"));
    ghost.style.display = "none";
    ghost.removeAttribute("src");
    ghost.className = "";
    dragging = null;
  }

  document.querySelectorAll(".source").forEach(source => {
    source.addEventListener("pointerdown", e => startDrag(e, source.dataset.type));
    source.addEventListener("pointermove", moveGhost);
    source.addEventListener("pointerup", endDrag);
    source.addEventListener("pointercancel", endDrag);
  });

  window.addEventListener("pointermove", moveGhost, { passive: false });
  window.addEventListener("pointerup", endDrag, { passive: false });


  // Click or tap an occupied box to remove only that cookie or milk.
  // The empty box then functions visually like a silent rest.
  boxes.forEach(box => {
    box.addEventListener("click", () => {
      if (box.querySelector(".placed")) {
        box.innerHTML = "";
        box.classList.remove("has-item");
      }
    });
  });

  resetBtn.addEventListener("click", () => {
    boxes.forEach(box => {
      box.innerHTML = "";
      box.classList.remove("hover", "has-item");
    });
  });
})();
</script>
</body>
</html>
