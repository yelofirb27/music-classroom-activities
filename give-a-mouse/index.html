<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Milk and Cookie Rhythm</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
  }

  .stage-wrap {
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
  }

  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: url("background.png") center / 100% 100% no-repeat;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  .box {
    position: absolute;
    top: 33.0%;
    height: 33.7%;
    width: 20.2%;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  #box1 { left: 5.55%; }
  #box2 { left: 28.43%; }
  #box3 { left: 51.35%; }
  #box4 { left: 74.15%; }

  .placed {
    max-width: 72%;
    max-height: 76%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.15));
  }

  .source {
    position: absolute;
    z-index: 8;
    cursor: grab;
    touch-action: none;
  }

  .source:active { cursor: grabbing; }

  #cookieSource {
    left: 23.9%;
    top: 72.6%;
    width: 13.6%;
    height: 24.6%;
  }

  #milkSource {
    left: 63.5%;
    top: 68.2%;
    width: 12.3%;
    height: 29.7%;
  }

  .source img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  #resetBtn {
    position: absolute;
    z-index: 20;
    right: 1.4%;
    bottom: 2.3%;
    border: 3px solid #e31718;
    background: rgba(255,255,255,.96);
    color: #e31718;
    font-size: clamp(14px, 2vw, 25px);
    font-weight: 800;
    padding: .45em .85em;
    border-radius: .55em;
    cursor: pointer;
    box-shadow: 0 3px 7px rgba(0,0,0,.22);
  }

  #resetBtn:hover { transform: scale(1.03); }
  #resetBtn:active { transform: scale(.98); }

  #dragGhost {
    position: absolute;
    z-index: 50;
    display: none;
    pointer-events: none;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.25));
  }

  #dragGhost.cookie {
    width: 11.2%;
  }

  #dragGhost.milk {
    width: 8.7%;
  }

  .box.hover {
    outline: 5px solid rgba(255, 40, 40, .75);
    outline-offset: -5px;
  }

  @media (max-aspect-ratio: 4/5) {
    #resetBtn { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="stage-wrap">
  <main id="stage" aria-label="Milk and Cookie Rhythm activity">
    <div class="box" id="box1" data-box="1"></div>
    <div class="box" id="box2" data-box="2"></div>
    <div class="box" id="box3" data-box="3"></div>
    <div class="box" id="box4" data-box="4"></div>

    <div class="source" id="cookieSource" data-type="cookie" aria-label="Cookie">
      <img src="cookie.png" alt="Cookie">
    </div>

    <div class="source" id="milkSource" data-type="milk" aria-label="Milk">
      <img src="milk.png" alt="Milk">
    </div>

    <button id="resetBtn" type="button">RESET</button>
    <img id="dragGhost" alt="">
  </main>
</div>

<script>
(() => {
  const stage = document.getElementById("stage");
  const boxes = [...document.querySelectorAll(".box")];
  const resetBtn = document.getElementById("resetBtn");
  const ghost = document.getElementById("dragGhost");

  let dragging = null;

  function imageFor(type) {
    return type === "cookie" ? "cookie.png" : "milk.png";
  }

  function startDrag(e, type) {
    e.preventDefault();
    dragging = { type, pointerId: e.pointerId };

    ghost.src = imageFor(type);
    ghost.className = type;
    ghost.style.display = "block";

    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    moveGhost(e);
  }

  function moveGhost(e) {
    if (!dragging) return;

    const rect = stage.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    ghost.style.left = x + "%";
    ghost.style.top = y + "%";

    boxes.forEach(box => box.classList.remove("hover"));
    const target = getBoxAt(e.clientX, e.clientY);
    if (target) target.classList.add("hover");
  }

  function getBoxAt(clientX, clientY) {
    for (const box of boxes) {
      const r = box.getBoundingClientRect();
      if (
        clientX >= r.left && clientX <= r.right &&
        clientY >= r.top && clientY <= r.bottom
      ) return box;
    }
    return null;
  }

  function endDrag(e) {
    if (!dragging) return;

    const target = getBoxAt(e.clientX, e.clientY);
    if (target) {
      target.innerHTML = "";
      const img = document.createElement("img");
      img.src = imageFor(dragging.type);
      img.className = "placed";
      img.alt = dragging.type === "cookie" ? "Cookie" : "Milk";
      target.appendChild(img);
    }

    boxes.forEach(box => box.classList.remove("hover"));
    ghost.style.display = "none";
    ghost.removeAttribute("src");
    ghost.className = "";
    dragging = null;
  }

  document.querySelectorAll(".source").forEach(source => {
    source.addEventListener("pointerdown", e => startDrag(e, source.dataset.type));
    source.addEventListener("pointermove", moveGhost);
    source.addEventListener("pointerup", endDrag);
    source.addEventListener("pointercancel", endDrag);
  });

  // Also track movement across the whole window after dragging begins.
  window.addEventListener("pointermove", moveGhost, { passive: false });
  window.addEventListener("pointerup", endDrag, { passive: false });

  resetBtn.addEventListener("click", () => {
    boxes.forEach(box => {
      box.innerHTML = "";
      box.classList.remove("hover");
    });
  });
})();
</script>
</body>
</html>
