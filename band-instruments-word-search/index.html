<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Band Instruments Word Search</title>
<style>
:root{
  --cream:#fbf4e5;
  --cream-deep:#f2e6cc;
  --paper:#fffdf7;
  --navy:#0e2f55;
  --navy-2:#153f70;
  --gold:#d5a13c;
  --gold-soft:#ecd9a9;
  --ink:#14243c;
  --muted:#747b86;
  --blue:#2867c7;
  --blue-soft:#eaf2ff;
  --panel:#fffaf0;
  --line:#d8c69a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.92),transparent 34%),
    linear-gradient(180deg,#fffaf0 0%,#f8efdc 100%);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}
body{padding:10px}
.app{
  width:min(1240px,100%);
  height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  flex:0 0 auto;
  padding:2px 6px 10px;
}
h1{
  grid-column:2;
  margin:0;
  text-align:center;
  font-size:clamp(28px,3.5vw,48px);
  line-height:1;
  letter-spacing:.025em;
  color:var(--navy);
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
}
h1::before{
  content:"𝄞";
  color:var(--gold);
  margin-right:.3em;
  font-size:.92em;
  vertical-align:-.04em;
}
h1::after{
  content:"♪";
  color:var(--gold);
  margin-left:.3em;
  font-size:.72em;
  vertical-align:.08em;
}
.counter{
  justify-self:start;
  background:linear-gradient(180deg,#fffdf7,#fff7e6);
  border:2px solid var(--gold);
  outline:1px solid rgba(14,47,85,.18);
  color:var(--navy);
  border-radius:12px;
  padding:9px 15px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(13px,1.5vw,17px);
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 5px 12px rgba(14,47,85,.10);
}
.controls{
  justify-self:end;
  display:flex;
  gap:9px;
}
button{
  border:2px solid var(--gold);
  outline:1px solid var(--navy);
  border-radius:12px;
  padding:10px 15px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(12px,1.35vw,15px);
  font-weight:900;
  color:#fff;
  cursor:pointer;
  letter-spacing:.02em;
  box-shadow:0 5px 12px rgba(14,47,85,.15);
}
#fullscreenBtn{background:linear-gradient(180deg,#153f70,#0e2f55)}
#newPuzzleBtn{background:linear-gradient(180deg,#25568f,#173f70)}
button:active{transform:translateY(1px)}

.card{
  flex:1 1 auto;
  min-height:0;
  background:rgba(255,253,247,.78);
  border:1px solid rgba(213,161,60,.25);
  border-radius:20px;
  padding:16px 16px 10px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 16px 34px rgba(80,61,24,.10);
}
.game{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(165px,1fr) auto minmax(165px,1fr);
  gap:clamp(16px,2vw,30px);
  align-items:center;
}
.bank{
  position:relative;
  display:grid;
  grid-template-columns:1fr;
  gap:0;
  align-content:center;
  background:linear-gradient(180deg,#fffdf8,#fff8eb);
  border:2px solid var(--gold);
  outline:1px solid rgba(14,47,85,.28);
  border-radius:17px;
  padding:36px 14px 14px;
  box-shadow:
    inset 0 0 0 4px rgba(213,161,60,.08),
    0 8px 18px rgba(14,47,85,.08);
}
.bank::before{
  content:"INSTRUMENTS";
  position:absolute;
  top:0;
  left:50%;
  transform:translate(-50%,-48%);
  min-width:78%;
  text-align:center;
  background:linear-gradient(180deg,#153f70,#0e2f55);
  color:#f7d98a;
  border:2px solid var(--gold);
  outline:1px solid var(--navy);
  border-radius:12px;
  padding:7px 12px;
  font-size:clamp(12px,1.2vw,15px);
  font-weight:900;
  letter-spacing:.03em;
  box-shadow:0 4px 10px rgba(14,47,85,.16);
}
.word{
  text-align:center;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
  font-size:clamp(12px,1.32vw,17px);
  letter-spacing:.015em;
  padding:7px 4px;
  white-space:nowrap;
  color:var(--navy);
  border-bottom:1px dashed rgba(213,161,60,.50);
}
.word:last-child{border-bottom:none}
.word.found{
  color:#707783;
  text-decoration:line-through;
  text-decoration-thickness:2px;
  background:rgba(225,228,232,.45);
  border-radius:7px;
}

.grid-wrap{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:0;
  padding:12px;
  background:linear-gradient(180deg,#fffef9,#fff9ec);
  border:4px solid var(--navy);
  border-radius:18px;
  box-shadow:
    inset 0 0 0 2px var(--gold),
    inset 0 0 0 6px rgba(255,255,255,.85),
    0 10px 20px rgba(14,47,85,.10);
}
#grid{
  position:relative;
  z-index:2;
  width:min(62vw,calc(100dvh - 190px),680px);
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(12,1fr);
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  cursor:pointer;
}
.cell{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
  font-size:clamp(13px,1.7vw,22px);
  line-height:1;
  color:#17243a;
}
.cell.preview{
  background:var(--blue-soft);
  color:#1f5ebc;
  border-radius:8px;
}
.cell.found{text-decoration:none}

#strikeOverlay{
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:0;
  pointer-events:none;
  overflow:visible;
  z-index:1;
}
#strikeOverlay .capsule-outer{
  stroke:var(--blue);
  stroke-linecap:round;
  fill:none;
}
#strikeOverlay .capsule-inner{
  stroke:#fff9ec;
  stroke-linecap:round;
  fill:none;
}

.message{
  display:none;
}
.footer{
  flex:0 0 auto;
  margin-top:10px;
  background:linear-gradient(180deg,#123a66,#0c2a4c);
  border:2px solid var(--gold);
  border-radius:14px;
  color:white;
  min-height:72px;
  display:grid;
  grid-template-columns:1.4fr 1fr;
  align-items:center;
  gap:18px;
  padding:10px 18px;
  box-shadow:0 6px 14px rgba(14,47,85,.14);
}
.footer-left,
.footer-right{
  min-width:0;
}
.footer-right{
  border-left:1px solid rgba(247,217,138,.55);
  padding-left:20px;
}
.footer-title{
  color:#f7d98a;
  font-weight:900;
  font-size:clamp(14px,1.5vw,18px);
  margin-bottom:3px;
}
.footer-text{
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(11px,1.18vw,14px);
  line-height:1.35;
}
.legend-arrows{
  color:#f7d98a;
  font-weight:900;
  letter-spacing:.08em;
}

@media(max-width:760px){
  body{padding:6px}
  .topbar{
    grid-template-columns:1fr 1fr;
    gap:7px;
    padding-bottom:8px;
  }
  h1{
    grid-column:1/-1;
    grid-row:1;
    font-size:clamp(23px,6vw,34px);
  }
  .counter{grid-row:2;grid-column:1}
  .controls{grid-row:2;grid-column:2}
  .card{padding:12px 8px 8px}
  .game{
    grid-template-columns:minmax(112px,1fr) auto minmax(112px,1fr);
    gap:8px;
  }
  .bank{
    padding:32px 6px 9px;
  }
  .word{
    font-size:clamp(9px,2vw,13px);
    padding:5px 0;
  }
  .grid-wrap{padding:8px}
  #grid{
    width:min(60vw,calc(100dvh - 220px),560px);
  }
  .footer{
    padding:8px 12px;
    min-height:64px;
  }
}
@media(max-width:520px){
  html,body{overflow:auto;height:auto;min-height:100%}
  .app{height:auto;min-height:100dvh}
  .card{overflow:visible}
  .game{
    grid-template-columns:1fr 1fr;
  }
  .grid-wrap{
    grid-column:1/-1;
    grid-row:1;
  }
  .bank{grid-row:2}
  #grid{width:min(92vw,510px)}
  .footer{
    grid-template-columns:1fr;
    gap:6px;
  }
  .footer-right{
    border-left:none;
    border-top:1px solid rgba(247,217,138,.55);
    padding-left:0;
    padding-top:6px;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="counter" id="counter">FOUND: 0 / 20</div>
    <h1>BAND INSTRUMENTS</h1>
    <div class="controls">
      <button id="fullscreenBtn">FULL SCREEN</button>
      <button id="newPuzzleBtn">NEW PUZZLE</button>
    </div>
  </header>

  <section class="card">
    <div class="game">
      <div class="bank" id="bankLeft"></div>
      <div class="grid-wrap" id="gridWrap">
        <div id="grid" aria-label="Band instruments word search"></div>
        <svg id="strikeOverlay" aria-hidden="true"></svg>
      </div>
      <div class="bank" id="bankRight"></div>
    </div>
    <div class="message" id="message"></div>

    <div class="footer">
      <div class="footer-left">
        <div class="footer-title">HOW TO PLAY</div>
        <div class="footer-text">
          Find and drag your finger or mouse across a hidden instrument.<br>
          Words can go in any direction: <span class="legend-arrows">→ ← ↑ ↓ ↗ ↘ ↖ ↙</span>
        </div>
      </div>
      <div class="footer-right">
        <div class="footer-title">GOAL</div>
        <div class="footer-text">Find all 20 band instruments!</div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const SIZE = 12;
  const WORDS = [
    "FLUTE","OBOE","CLARINET","BASSOON","PICCOLO",
    "SAXOPHONE","TRUMPET","TROMBONE","FRENCHHORN","TUBA",
    "EUPHONIUM","BARITONE","SNAREDRUM","BASSDRUM","CYMBAL",
    "MARIMBA","TIMPANI","GONG","TRIANGLE","XYLOPHONE"
  ];

  const DISPLAY = {
    FRENCHHORN:"FRENCH HORN",
    SNAREDRUM:"SNARE DRUM",
    BASSDRUM:"BASS DRUM"
  };

  const HORIZONTAL_VERTICAL = [
    [0,1],[0,-1],[1,0],[-1,0]
  ];
  const DIAGONAL = [
    [1,1],[1,-1],[-1,1],[-1,-1]
  ];
  const ALL_DIRS = [...HORIZONTAL_VERTICAL,...DIAGONAL];

  const gridEl = document.getElementById("grid");
  const gridWrap = document.getElementById("gridWrap");
  const strikeOverlay = document.getElementById("strikeOverlay");
  const bankLeft = document.getElementById("bankLeft");
  const bankRight = document.getElementById("bankRight");
  const counterEl = document.getElementById("counter");
  const messageEl = document.getElementById("message");
  const newBtn = document.getElementById("newPuzzleBtn");
  const fullscreenBtn = document.getElementById("fullscreenBtn");

  let board = [];
  let found = new Set();
  let selecting = false;
  let start = null;
  let preview = [];

  const rint = n => Math.floor(Math.random()*n);

  function shuffle(a){
    const b=[...a];
    for(let i=b.length-1;i>0;i--){
      const j=rint(i+1);
      [b[i],b[j]]=[b[j],b[i]];
    }
    return b;
  }

  function blankBoard(){
    return Array.from({length:SIZE},()=>Array(SIZE).fill(""));
  }

  function canPlace(word,row,col,dr,dc,b){
    const er=row+dr*(word.length-1);
    const ec=col+dc*(word.length-1);
    if(er<0||er>=SIZE||ec<0||ec>=SIZE) return false;

    for(let i=0;i<word.length;i++){
      const r=row+dr*i,c=col+dc*i;
      if(b[r][c]!=="" && b[r][c]!==word[i]) return false;
    }
    return true;
  }

  function candidates(word,b,dirs){
    const list=[];
    for(const [dr,dc] of dirs){
      for(let row=0;row<SIZE;row++){
        for(let col=0;col<SIZE;col++){
          if(!canPlace(word,row,col,dr,dc,b)) continue;
          let overlap=0;
          for(let i=0;i<word.length;i++){
            const r=row+dr*i,c=col+dc*i;
            if(b[r][c]===word[i]) overlap++;
          }
          list.push({row,col,dr,dc,overlap});
        }
      }
    }
    return list;
  }

  function put(word,opt,b){
    for(let i=0;i<word.length;i++){
      b[opt.row+opt.dr*i][opt.col+opt.dc*i]=word[i];
    }
  }

  const VERIFIED_TEMPLATES = [
    [
      "BARITONE....",
      "XEEP.TRUMPET",
      "MYNUIABMIRAM",
      "EULOPCYMBALM",
      "TNROHHCNERFU",
      "BRODPPOO..IR",
      "GAIBSHONL.ND",
      "O.SAMSOXIOAE",
      "N..SNOANAUPR",
      "GEOBOGRBESMA",
      "FLUTEOLTU.IN",
      ".CLARINETTTS"
    ],
    [
      "ENOTIRABST..",
      "ABMIRAMNRE.E",
      "FABUT.AIN.NN",
      "LS..IRAO.ORT",
      "US..ENHNHOET",
      "TD.DGPOPHNIP",
      "ERRLOOOHIMIG",
      "PUEXSLCRPC.O",
      "MMASYNAACU.N",
      "USAXELNOBOEG",
      "RB.RCILABMYC",
      "T.FENOBMORT."
    ]
  ];

  function templateToBoard(rows){
    return rows.map(row => [...row].map(ch => ch === "." ? "" : ch));
  }

  function rotate90(b){
    const out = blankBoard();
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        out[c][SIZE-1-r] = b[r][c];
      }
    }
    return out;
  }

  function mirrorHorizontal(b){
    return b.map(row => [...row].reverse());
  }

  function transformBoard(b, code){
    let out = b.map(row => [...row]);

    // 0-3 = rotations; 4-7 = mirrored rotations.
    if(code >= 4){
      out = mirrorHorizontal(out);
      code -= 4;
    }
    for(let i=0;i<code;i++){
      out = rotate90(out);
    }
    return out;
  }

  function boardContainsWord(b, word){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        for(const [dr,dc] of ALL_DIRS){
          const er = r + dr*(word.length-1);
          const ec = c + dc*(word.length-1);
          if(er<0 || er>=SIZE || ec<0 || ec>=SIZE) continue;

          let good = true;
          for(let i=0;i<word.length;i++){
            if(b[r+dr*i][c+dc*i] !== word[i]){
              good = false;
              break;
            }
          }
          if(good) return true;
        }
      }
    }
    return false;
  }

  function verifyAllWords(b){
    return WORDS.every(word => boardContainsWord(b,word));
  }

  function generate(){
    /*
      Every displayed puzzle begins from a layout that has already been
      verified to contain all 20 instrument names. Random rotations and
      reflections change the directions/locations, and blank squares receive
      fresh random letters each time.
    */
    const source = VERIFIED_TEMPLATES[rint(VERIFIED_TEMPLATES.length)];
    let b = templateToBoard(source);
    b = transformBoard(b, rint(8));

    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(b[r][c]===""){
          b[r][c]=letters[rint(letters.length)];
        }
      }
    }

    // Hard safety check: never show a puzzle missing even one word.
    if(!verifyAllWords(b)){
      console.error("Verified template failed final word check.");
      return generate();
    }

    return b;
  }

  function renderGrid(){
    gridEl.innerHTML="";
    const frag=document.createDocumentFragment();
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const el=document.createElement("div");
        el.className="cell";
        el.textContent=board[r][c];
        el.dataset.r=r;
        el.dataset.c=c;
        frag.appendChild(el);
      }
    }
    gridEl.appendChild(frag);
  }

  function renderBanks(){
    bankLeft.innerHTML="";
    bankRight.innerHTML="";
    const mixed=shuffle(WORDS);

    mixed.forEach((word,i)=>{
      const el=document.createElement("div");
      el.className="word";
      el.dataset.word=word;
      el.textContent=DISPLAY[word]||word;
      (i<10?bankLeft:bankRight).appendChild(el);
    });
  }

  function updateCounter(){
    counterEl.textContent=`FOUND: ${found.size} / ${WORDS.length}`;
    messageEl.textContent=found.size===WORDS.length
      ? "Great job! You found all 20 band instruments! 🎵"
      : "";
  }

  function newPuzzle(){
    found.clear();
    selecting=false;
    start=null;
    preview=[];
    board=generate();
    strikeOverlay.innerHTML="";
    renderGrid();
    renderBanks();
    updateCounter();
  }

  function cellEl(r,c){
    return gridEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  }

  function clearPreview(){
    for(const [r,c] of preview){
      const el=cellEl(r,c);
      if(el) el.classList.remove("preview");
    }
    preview=[];
  }

  function getLine(a,b){
    const drRaw=b.r-a.r, dcRaw=b.c-a.c;
    const ar=Math.abs(drRaw), ac=Math.abs(dcRaw);

    if(!(drRaw===0 || dcRaw===0 || ar===ac)) return [];

    const dr=Math.sign(drRaw);
    const dc=Math.sign(dcRaw);
    const steps=Math.max(ar,ac);
    const cells=[];

    for(let i=0;i<=steps;i++){
      cells.push([a.r+dr*i,a.c+dc*i]);
    }
    return cells;
  }

  function pointCell(x,y){
    const el=document.elementFromPoint(x,y);
    if(!el || !el.classList.contains("cell")) return null;
    return {r:+el.dataset.r,c:+el.dataset.c};
  }

  function showPreview(end){
    clearPreview();
    if(!start||!end) return;
    preview=getLine(start,end);
    for(const [r,c] of preview){
      const el=cellEl(r,c);
      if(el) el.classList.add("preview");
    }
  }

  function lettersFor(cells){
    return cells.map(([r,c])=>board[r][c]).join("");
  }

  function drawContinuousOutline(cells){
    if(!cells.length) return;

    const first = cellEl(cells[0][0], cells[0][1]);
    const last = cellEl(cells[cells.length-1][0], cells[cells.length-1][1]);
    if(!first || !last) return;

    const wrapRect = gridWrap.getBoundingClientRect();
    const gridRect = gridEl.getBoundingClientRect();
    const firstRect = first.getBoundingClientRect();
    const lastRect = last.getBoundingClientRect();

    // Overlay matches the actual 12×12 grid exactly.
    const overlayLeft = gridRect.left - wrapRect.left;
    const overlayTop = gridRect.top - wrapRect.top;

    strikeOverlay.style.left = `${overlayLeft}px`;
    strikeOverlay.style.top = `${overlayTop}px`;
    strikeOverlay.style.width = `${gridRect.width}px`;
    strikeOverlay.style.height = `${gridRect.height}px`;
    strikeOverlay.setAttribute("viewBox", `0 0 ${gridRect.width} ${gridRect.height}`);

    // Use the exact center point of the first and last selected cells.
    const x1 = firstRect.left + firstRect.width / 2 - gridRect.left;
    const y1 = firstRect.top + firstRect.height / 2 - gridRect.top;
    const x2 = lastRect.left + lastRect.width / 2 - gridRect.left;
    const y2 = lastRect.top + lastRect.height / 2 - gridRect.top;

    const cellSize = Math.min(firstRect.width, firstRect.height);

    // Two round-ended lines create a perfectly centered hollow capsule.
    // Because the letters are layered above the SVG, the inside never obscures them.
    const outerWidth = cellSize * 0.78;
    const innerWidth = Math.max(outerWidth - 6.5, cellSize * 0.61);

    const outer = document.createElementNS("http://www.w3.org/2000/svg","line");
    outer.setAttribute("x1", x1);
    outer.setAttribute("y1", y1);
    outer.setAttribute("x2", x2);
    outer.setAttribute("y2", y2);
    outer.setAttribute("stroke-width", outerWidth);
    outer.setAttribute("class", "capsule-outer");

    const inner = document.createElementNS("http://www.w3.org/2000/svg","line");
    inner.setAttribute("x1", x1);
    inner.setAttribute("y1", y1);
    inner.setAttribute("x2", x2);
    inner.setAttribute("y2", y2);
    inner.setAttribute("stroke-width", innerWidth);
    inner.setAttribute("class", "capsule-inner");

    strikeOverlay.appendChild(outer);
    strikeOverlay.appendChild(inner);
  }

  function finish(){
    if(!selecting) return;
    selecting=false;

    const cells=[...preview];
    const text=lettersFor(cells);
    const reverse=[...text].reverse().join("");
    let match=null;

    if(WORDS.includes(text)) match=text;
    else if(WORDS.includes(reverse)) match=reverse;

    if(match && !found.has(match)){
      found.add(match);

      for(const [r,c] of cells){
        const el=cellEl(r,c);
        if(el){
          el.classList.remove("preview");
          el.classList.add("found");
        }
      }

      drawContinuousOutline(cells);

      document.querySelectorAll(`.word[data-word="${match}"]`)
        .forEach(el=>el.classList.add("found"));

      preview=[];
      updateCounter();
    }else{
      clearPreview();
    }

    start=null;
  }

  gridEl.addEventListener("pointerdown",e=>{
    const el=e.target.closest(".cell");
    if(!el) return;
    e.preventDefault();
    selecting=true;
    start={r:+el.dataset.r,c:+el.dataset.c};
    showPreview(start);
    try{gridEl.setPointerCapture(e.pointerId)}catch(_){}
  });

  gridEl.addEventListener("pointermove",e=>{
    if(!selecting) return;
    const end=pointCell(e.clientX,e.clientY);
    if(end) showPreview(end);
  });

  gridEl.addEventListener("pointerup",e=>{
    e.preventDefault();
    finish();
  });

  gridEl.addEventListener("pointercancel",finish);
  window.addEventListener("pointerup",finish);

  newBtn.addEventListener("click",newPuzzle);

  fullscreenBtn.addEventListener("click",async()=>{
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }else{
        await document.exitFullscreen();
      }
    }catch(_){}
  });

  document.addEventListener("fullscreenchange",()=>{
    fullscreenBtn.textContent=document.fullscreenElement
      ? "EXIT FULL SCREEN"
      : "FULL SCREEN";
  });

  newPuzzle();
})();
</script>
</body>
</html>
