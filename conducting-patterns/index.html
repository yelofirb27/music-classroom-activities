
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Basic Conducting Patterns</title>
<style>
:root {
  --gold:#f3cf5a;
  --gold2:#fff0a6;
  --panel:#08131f;
  --line:#314354;
  --text:#f7f7f7;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 60% 25%,rgba(31,67,98,.25),transparent 35%),
    linear-gradient(135deg,#02070c,#06111d 55%,#02070c);
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:22px 28px 14px;
  border-bottom:1px solid rgba(243,207,90,.35);
}
h1{
  margin:0;
  color:var(--gold);
  font-size:clamp(1.8rem,3.5vw,3rem);
  letter-spacing:.03em;
}
.subtitle{margin:4px 0 0;color:#cad4de}
.app{
  width:min(1450px,96vw);
  margin:18px auto 28px;
  display:grid;
  grid-template-columns:320px 1fr;
  gap:18px;
}
.panel{
  background:linear-gradient(180deg,rgba(9,22,34,.98),rgba(4,12,20,.98));
  border:1px solid rgba(243,207,90,.45);
  border-radius:18px;
  box-shadow:0 18px 42px rgba(0,0,0,.35);
}
.controls{padding:18px}
.section-title{
  text-align:center;
  color:#f9e59d;
  font-weight:800;
  letter-spacing:.04em;
  margin:4px 0 13px;
}
.meter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.meter-btn{
  min-height:82px;
  border:1px solid #52677b;
  border-radius:12px;
  background:#0b1724;
  color:white;
  font-size:1.75rem;
  font-weight:900;
  cursor:pointer;
}
.meter-btn.active{
  color:var(--gold);
  border:2px solid var(--gold);
  box-shadow:0 0 16px rgba(243,207,90,.28);
}
.meter-btn:disabled{
  opacity:.38;
  cursor:not-allowed;
  color:#a6b0b9;
  border-color:#344453;
  box-shadow:none;
}
.control-block{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #263848;
}
.control-label{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  margin-bottom:10px;
}
#tempo{width:100%;accent-color:var(--gold)}
.range-labels{display:flex;justify-content:space-between;color:#cbd4dc}
.check-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0;
}
.check-row input{width:20px;height:20px;accent-color:var(--gold)}
.action{
  width:100%;
  min-height:58px;
  margin-top:11px;
  border-radius:11px;
  font-size:1.1rem;
  font-weight:900;
  cursor:pointer;
}
#startBtn{
  background:linear-gradient(90deg,#f0cb54,#ffe99b);
  color:#111;
  border:0;
}
#stopBtn,#restartBtn{
  background:#07121d;
  color:white;
  border:1px solid #4d6071;
}
.stage{
  min-height:760px;
  padding:16px;
  display:flex;
  flex-direction:column;
}
.stage-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:4px 6px 12px;
}
.pattern-name{
  color:var(--gold);
  font-size:1.35rem;
  font-weight:900;
}
.status{
  min-width:170px;
  text-align:center;
  padding:10px 14px;
  border-radius:999px;
  background:#0a1724;
  border:1px solid #40566a;
  color:#edf3f8;
  font-weight:800;
}
.visual{
  position:relative;
  flex:1;
  min-height:680px;
  overflow:hidden;
  border-radius:14px;
  border:1px solid #263b4e;
  background:#000;
}
#sourceCanvas,#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#sourceCanvas{object-fit:contain}
#overlay{overflow:visible}
.glow{
  fill:rgba(255,215,55,.24);
  filter:drop-shadow(0 0 12px #ffd43b) drop-shadow(0 0 30px rgba(255,212,59,.95));
}
.ball{
  fill:#ffe86b;
  stroke:white;
  stroke-width:2.5;
  filter:drop-shadow(0 0 8px #ffd43b) drop-shadow(0 0 18px #ffd43b);
}
.beat-marker{
  fill:none;
  stroke:#ffe66c;
  stroke-width:2.5;
  opacity:0;
}
.beat-marker.active{
  opacity:1;
  filter:drop-shadow(0 0 8px #ffd43b);
}
.guide-path{
  fill:none;
  stroke:#111;
  stroke-width:5;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:0;
  pointer-events:none;
}
.guide-path.visible{opacity:1}
.trail-dot{
  fill:#ffd83d;
  pointer-events:none;
  filter:drop-shadow(0 0 5px #ffd83d);
}
.countdown{
  position:absolute;
  left:22px;
  top:20px;
  width:230px;
  padding:18px;
  border-radius:14px;
  background:rgba(3,12,21,.91);
  border:1px solid rgba(243,207,90,.75);
  text-align:center;
  opacity:0;
  transform:translateY(-8px);
  transition:.18s ease;
}
.countdown.show{opacity:1;transform:translateY(0)}
.countdown small{display:block;color:#f7dc80;font-size:1.05rem}
#countNum{font-size:4rem;font-weight:900;line-height:1.05}
.hint{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 15px;
  border-radius:10px;
  background:rgba(4,12,20,.85);
  border:1px solid #31485a;
  color:#dbe5ec;
  white-space:nowrap;
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .stage{min-height:620px}
  .visual{min-height:560px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Basic Conducting Patterns</h1>
    <p class="subtitle">Follow the original conducting diagrams with synchronized clicks.</p>
  </div>
</header>

<main class="app">
  <aside class="panel controls">
    <div class="section-title">CHOOSE PATTERN</div>
    <div class="meter-grid">
      <button class="meter-btn" data-meter="2/4">2/4</button>
      <button class="meter-btn" data-meter="3/4">3/4</button>
      <button class="meter-btn active" data-meter="4/4">4/4</button>
      <button class="meter-btn" data-meter="6/8">6/8</button>
    </div>

    <div class="control-block">
      <div class="control-label">
        <span>TEMPO</span>
        <span><span id="tempoValue">80</span> BPM</span>
      </div>
      <input id="tempo" type="range" min="40" max="180" value="80">
      <div class="range-labels"><span>40</span><span>180</span></div>
    </div>

    <div class="control-block">
      <label class="check-row"><input id="showBall" type="checkbox" checked> Show glowing marker</label>
      <label class="check-row"><input id="showGuide" type="checkbox"> Show pattern guide</label>
      <label class="check-row"><input id="soundOn" type="checkbox" checked> Metronome clicks</label>
      <label class="check-row"><input id="accentOne" type="checkbox" checked> Accent beat 1</label>
    </div>

    <button class="action" id="startBtn">▶ START</button>
    <button class="action" id="stopBtn">■ STOP</button>
    <button class="action" id="restartBtn">↻ RESTART</button>
  </aside>

  <section class="panel stage">
    <div class="stage-top">
      <div class="pattern-name" id="patternName">4/4 Conducting Pattern</div>
      <div class="status" id="status">Ready</div>
    </div>

    <div class="visual">
      <canvas id="sourceCanvas"></canvas>
      <svg id="overlay"></svg>

      <div class="countdown" id="countdown">
        <small>Get ready...</small>
        <div id="countNum">8</div>
        <div>8 clicks before we start</div>
      </div>

      <div class="hint">The glowing marker follows the pattern printed in your original image.</div>
    </div>
  </section>
</main>

let meter="4/4";
let running=false;
let raf=null;
let timers=[];
let audioCtx=null;
let bgImage=new Image();

const canvas=document.getElementById("sourceCanvas");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const tempo=document.getElementById("tempo");
const tempoValue=document.getElementById("tempoValue");
const statusEl=document.getElementById("status");
const patternName=document.getElementById("patternName");
const countdown=document.getElementById("countdown");
const countNum=document.getElementById("countNum");
const showGuide=document.getElementById("showGuide");
let trailDots=[];
let trailPositions=[];

bgImage.onload=render;
bgImage.src=embeddedImage;

function beatMs(){ return 60000/Number(tempo.value); }

function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
}

function clickSound(accent=false){
  if(!document.getElementById("soundOn").checked) return;
  ensureAudio();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  const now=audioCtx.currentTime;
  osc.type="sine";
  osc.frequency.value=accent?1300:850;
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(accent?.26:.14,now+.004);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.06);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+.07);
}

function render(){
  stop(false);
  const p=patterns[meter];
  const [sx,sy,sw,sh]=p.crop;

  canvas.width=sw*2;
  canvas.height=sh*2;
  canvas.style.aspectRatio=`${sw}/${sh}`;
  overlay.setAttribute("viewBox",`0 0 ${sw} ${sh}`);

  ctx.setTransform(2,0,0,2,0,0);
  ctx.clearRect(0,0,sw,sh);

  if(p.custom){
    ctx.fillStyle=showGuide.checked ? "#ffffff" : "#000000";
    ctx.fillRect(0,0,sw,sh);
  }else{
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,sw,sh);
    ctx.drawImage(bgImage,sx,sy,sw,sh,0,0,sw,sh);
  }

  overlay.innerHTML="";

  if(p.custom && p.guide){
    const guide=document.createElementNS("http://www.w3.org/2000/svg","path");
    guide.setAttribute("d",p.guide);
    guide.setAttribute("class","guide-path"+(showGuide.checked?" visible":""));
    overlay.appendChild(guide);
  }

  p.beats.forEach(b=>{
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",b.p[0]);
    c.setAttribute("cy",b.p[1]);
    c.setAttribute("r",p.custom ? "18" : "15");
    c.setAttribute("class","beat-marker");
    c.dataset.beat=b.n;
    overlay.appendChild(c);
  });

  trailDots=[];
  trailPositions=[];
  for(let i=0;i<26;i++){
    const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("class","trail-dot");
    dot.setAttribute("r",Math.max(1.2,6-i*.18));
    dot.style.opacity=String(Math.max(0,.68-i*.026));
    overlay.appendChild(dot);
    trailDots.push(dot);
  }

  const halo=document.createElementNS("http://www.w3.org/2000/svg","circle");
  halo.id="halo";
  halo.setAttribute("r",p.custom?"27":"19");
  halo.setAttribute("class","glow");

  const ball=document.createElementNS("http://www.w3.org/2000/svg","circle");
  ball.id="ball";
  ball.setAttribute("r",p.custom?"12":"8");
  ball.setAttribute("class","ball");

  overlay.append(halo,ball);
  setBall(...p.start,true);
  updateBallVisibility();

  patternName.textContent=`${meter} Conducting Pattern`;
  statusEl.textContent="Ready";
}

function setBall(x,y,resetTrail=false){
  ["ball","halo"].forEach(id=>{
    const el=document.getElementById(id);
    if(el){
      el.setAttribute("cx",x);
      el.setAttribute("cy",y);
    }
  });

  if(resetTrail || trailPositions.length===0){
    trailPositions=Array.from({length:trailDots.length},()=>[x,y]);
  }else{
    const last=trailPositions[0] || [x,y];
    if(Math.hypot(x-last[0],y-last[1])>2.2){
      trailPositions.unshift([x,y]);
      trailPositions=trailPositions.slice(0,trailDots.length);
    }
  }

  trailDots.forEach((dot,i)=>{
    const pos=trailPositions[Math.min(i,trailPositions.length-1)] || [x,y];
    dot.setAttribute("cx",pos[0]);
    dot.setAttribute("cy",pos[1]);
  });
}

function updateBallVisibility(){
  const visible=document.getElementById("showBall").checked;
  ["ball","halo"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=visible?"block":"none";
  });
  trailDots.forEach(dot=>dot.style.display=visible?"block":"none");
}

function clearBeat(){
  overlay.querySelectorAll(".beat-marker").forEach(x=>x.classList.remove("active"));
}

function flashBeat(n){
  clearBeat();
  const el=overlay.querySelector(`[data-beat="${n}"]`);
  if(el){
    el.classList.add("active");
    setTimeout(()=>el.classList.remove("active"),160);
  }
}

function lerp(a,b,t){return a+(b-a)*t}
function cubic(p0,p1,p2,p3,t){
  const u=1-t;
  return [
    u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],
    u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]
  ];
}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

function animateSegment(from,seg,duration){
  return new Promise(resolve=>{
    const begin=performance.now();
    function frame(now){
      if(!running) return resolve(false);
      let t=Math.min(1,(now-begin)/duration);
      t=ease(t);
      let pos;
      if(seg.type==="line"){
        pos=[lerp(from[0],seg.to[0],t),lerp(from[1],seg.to[1],t)];
      }else{
        pos=cubic(from,seg.c1,seg.c2,seg.to,t);
      }
      setBall(pos[0],pos[1]);
      if(t<1) raf=requestAnimationFrame(frame);
      else resolve(true);
    }
    raf=requestAnimationFrame(frame);
  });
}

function sleep(ms){
  return new Promise(resolve=>{
    const id=setTimeout(resolve,ms);
    timers.push(id);
  });
}

async function countIn(){
  countdown.classList.add("show");
  statusEl.textContent="8-click count-in";
  for(let i=8;i>=1;i--){
    if(!running) return false;
    countNum.textContent=i;
    clickSound(i===8||i===4);
    countNum.animate(
      [{transform:"scale(.75)",opacity:.4},{transform:"scale(1)",opacity:1}],
      {duration:180,easing:"ease-out"}
    );
    if(i > 1) await sleep(beatMs());
  }
  countdown.classList.remove("show");
  return running;
}

async function run(){
  ensureAudio();
  const ok=await countIn();
  if(!ok) return;

  statusEl.textContent="Conducting";
  const p=patterns[meter];

  while(running){
    let from=[...p.start];
    for(const seg of p.segments){
      const done=await animateSegment(from,seg,beatMs());
      if(!done||!running) break;
      from=[...seg.to];
      if(seg.beat){
        flashBeat(seg.beat);
        clickSound(document.getElementById("accentOne").checked && seg.beat===1);
      }
    }
  }
}

function start(){
  stop(false);
  running=true;
  run();
}

function stop(reset=true){
  running=false;
  cancelAnimationFrame(raf);
  timers.forEach(clearTimeout);
  timers=[];
  countdown.classList.remove("show");
  clearBeat();
  const p=patterns[meter];
  setBall(...p.start,true);
  if(reset) statusEl.textContent="Stopped";
}

document.querySelectorAll(".meter-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(btn.disabled) return;
    document.querySelectorAll(".meter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    meter=btn.dataset.meter;
    render();
  });
});

tempo.addEventListener("input",()=>tempoValue.textContent=tempo.value);
document.getElementById("showBall").addEventListener("change",updateBallVisibility);
showGuide.addEventListener("change",render);
document.getElementById("startBtn").addEventListener("click",start);
document.getElementById("stopBtn").addEventListener("click",()=>stop(true));
document.getElementById("restartBtn").addEventListener("click",start);
</script>
