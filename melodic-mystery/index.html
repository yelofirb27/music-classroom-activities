<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melodic Mystery</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: #2d2d2d;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    width: min(1500px, 98vw);
    min-height: 100dvh;
    margin: 0 auto;
    padding: clamp(4px, 1vh, 12px) clamp(6px, 1vw, 14px);
    text-align: center;
  }

  h1 {
    margin: 0 0 clamp(2px, .8vh, 8px);
    color: #49ad4e;
    font-size: clamp(2rem, 4vw, 3.7rem);
    line-height: 1;
  }

  .setup-screen {
    width: min(700px, 94vw);
    margin: clamp(28px, 8vh, 70px) auto 0;
    padding: clamp(22px, 4vw, 34px);
    border: 1px solid #d8d8d8;
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(0,0,0,.08);
  }

  .setup-screen h2 {
    margin: 0 0 24px;
    font-size: 1.8rem;
  }

  .clef-options {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .clef-option {
    min-width: 210px;
    background: #49ad4e;
    color: white;
  }

  .clef-option:hover {
    background: #3d9742;
  }

  .staff-wrap {
    width: 100%;
    margin: 0 auto;
  }

  #mysteryStaff {
    display: block;
    width: 100%;
    height: clamp(180px, 29dvh, 285px);
    object-fit: fill;
  }

  .reference-title {
    margin: -2px 0 0;
    font-size: clamp(1.35rem, 2.5vw, 2rem);
    font-weight: 800;
  }

  .reference-image {
    display: block;
    width: min(1040px, 96%);
    height: clamp(150px, 23dvh, 225px);
    object-fit: contain;
    margin: -4px auto 0;
  }

  canvas.reference-image {
    max-width: 1040px;
  }

  .score {
    margin: 0 0 8px;
    font-size: 1.12rem;
  }

  .guess-controls {
    display: flex;
    justify-content: center;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }

  #wordInput {
    width: min(480px, 90vw);
    min-height: 54px;
    border: 3px solid #1474dc;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 1.25rem;
    outline: none;
  }

  button {
    border: 0;
    border-radius: 7px;
    padding: 14px 24px;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
  }

  #submitBtn,
  #restartBtn {
    background: #49ad4e;
    color: #fff;
  }

  #nextBtn {
    background: #1474dc;
    color: #fff;
  }

  #nextBtn:disabled {
    background: #b9c9dc;
    cursor: default;
  }

  #submitBtn:hover,
  #restartBtn:hover {
    background: #3d9742;
  }

  #submitBtn:disabled {
    background: #c9c9c9;
    cursor: default;
  }

  #definitionPanel {
    margin: 0 calc(50% - 50vw);
    min-height: 50px;
    padding: 11px 18px;
    background: #def5f3;
    color: #007c72;
    font-size: 1.22rem;
  }

  #messagePanel {
    margin: 8px calc(50% - 50vw) 0;
    min-height: 42px;
    padding: 8px 18px;
    font-size: 1.18rem;
    font-weight: 800;
  }

  #messagePanel.success {
    background: #d7efda;
    color: #185f2b;
  }

  #messagePanel.error {
    background: #f9dddd;
    color: #8b1f1f;
  }

  #messagePanel.info {
    background: #eaf3ff;
    color: #24517c;
  }

  #restartBtn {
    margin-top: 8px;
  }


  @media (max-width: 900px) {
    .page {
      width: 100%;
      padding-inline: 8px;
    }

    #mysteryStaff {
      height: clamp(170px, 26dvh, 235px);
    }

    .reference-image {
      height: clamp(145px, 21dvh, 195px);
    }

    .guess-controls {
      gap: 8px;
    }
  }

  @media (max-width: 600px) {
    h1 {
      font-size: clamp(2rem, 10vw, 2.8rem);
    }

    #mysteryStaff {
      height: clamp(150px, 24dvh, 210px);
    }

    .reference-image {
      height: clamp(135px, 20dvh, 180px);
    }

    .guess-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(100%, 560px);
      margin-inline: auto;
    }

    #wordInput {
      grid-column: 1 / -1;
      width: 100%;
    }

    #submitBtn,
    #nextBtn {
      width: 100%;
    }

    #definitionPanel,
    #messagePanel {
      font-size: 1rem;
    }
  }

  @media (max-height: 650px) and (orientation: landscape) {
    h1 {
      font-size: 2rem;
    }

    #mysteryStaff {
      height: 180px;
    }

    .reference-image {
      height: 140px;
    }

    .reference-title,
    .score {
      margin-block: 2px;
    }

    #definitionPanel,
    #messagePanel {
      padding-block: 7px;
      min-height: 38px;
    }

    #restartBtn {
      margin-top: 5px;
    }
  }

  @media (max-width: 700px) {
    .page { width: 100%; }
    .staff-wrap { overflow-x: auto; }
    #mysteryStaff { min-width: 0; }
    .reference-image { min-width: 0; }
    .reference-scroll { overflow: visible; }
  }
</style>
</head>
<body>

  function redrawStaff() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw one continuous, clean five-line staff.
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 5;
    ctx.lineCap = "butt";

    for (let line = 0; line < 5; line++) {
      const y = staffBottomY - line * staffLineGap;
      ctx.beginPath();
      ctx.moveTo(36, y);
      ctx.lineTo(2165, y);
      ctx.stroke();
    }

    // Draw the selected clef with a music font.
    ctx.save();
    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    if (currentClef === "treble") {
      ctx.font = '505px "Noto Music", "Bravura Text", "Segoe UI Symbol", "Arial Unicode MS", serif';
      ctx.fillText("𝄞", 180, 474);
    } else {
      ctx.font = '310px "Noto Music", "Bravura Text", "Segoe UI Symbol", "Arial Unicode MS", serif';
      ctx.fillText("𝄢", 175, 380);
    }

    ctx.restore();

    const count = noteSequence.length;
    if (!count) return;

    // Always begin near the clef, then keep one consistent gap between notes.
    // Long words automatically use a slightly smaller gap only when needed.
    const availableWidth = safeNoteEndX - safeNoteStartX;
    const spacing = count > 1
      ? Math.min(preferredSpacing, availableWidth / (count - 1))
      : 0;
    const startX = safeNoteStartX;

    noteSequence.forEach((position, index) => {
      drawFilledNotehead(startX + index * spacing, yForPosition(position));
    });
  }

  function setMessage(text, type = "") {
    messagePanel.textContent = text;
    messagePanel.className = type;
  }

  function drawBassReference() {
    const c = bassReference;
    const bctx = bassReferenceCtx;

    bctx.clearRect(0, 0, c.width, c.height);
    bctx.fillStyle = "#fff";
    bctx.fillRect(0, 0, c.width, c.height);

    const left = 40;
    const right = 1360;
    const bottomY = 230;
    const lineGap = 42;

    // One clean, continuous five-line staff.
    bctx.strokeStyle = "#000";
    bctx.lineWidth = 5;
    bctx.lineCap = "butt";

    for (let line = 0; line < 5; line++) {
      const y = bottomY - line * lineGap;
      bctx.beginPath();
      bctx.moveTo(left, y);
      bctx.lineTo(right, y);
      bctx.stroke();
    }

    // Bass clef aligned to the staff.
    bctx.save();
    bctx.fillStyle = "#000";
    bctx.textAlign = "center";
    bctx.textBaseline = "alphabetic";
    bctx.font = '250px "Noto Music", "Bravura Text", "Segoe UI Symbol", "Arial Unicode MS", serif';
    bctx.fillText("𝄢", 125, 214);
    bctx.restore();

    // Match the treble reference layout:
    // line notes rise across the left/middle, then space notes rise across the right.
    const lineNotes = [
      { letter: "G", x: 255, y: bottomY },
      { letter: "B", x: 390, y: bottomY - lineGap },
      { letter: "D", x: 530, y: bottomY - lineGap * 2 },
      { letter: "F", x: 675, y: bottomY - lineGap * 3 },
      { letter: "A", x: 820, y: bottomY - lineGap * 4 }
    ];

    const spaceNotes = [
      { letter: "A", x: 790, y: bottomY - lineGap * 0.5 },
      { letter: "C", x: 950, y: bottomY - lineGap * 1.5 },
      { letter: "E", x: 1110, y: bottomY - lineGap * 2.5 },
      { letter: "G", x: 1270, y: bottomY - lineGap * 3.5 }
    ];

    bctx.font = "bold 72px Arial, Helvetica, sans-serif";
    bctx.textAlign = "center";
    bctx.textBaseline = "middle";

    function drawReferenceLetter(item) {
      bctx.lineWidth = 18;
      bctx.strokeStyle = "#fff";
      bctx.strokeText(item.letter, item.x, item.y);

      bctx.fillStyle = "#000";
      bctx.fillText(item.letter, item.x, item.y);
    }

    lineNotes.forEach(drawReferenceLetter);
    spaceNotes.forEach(drawReferenceLetter);
  }

  function startGame(selectedClef) {
    currentClef = selectedClef;
    successfulGuesses = 0;
    usedWords.clear();
    scoreEl.textContent = "Successful Guesses: 0";

    referenceTitle.textContent =
      selectedClef === "treble"
        ? "Treble Clef Note Reference"
        : "Bass Clef Note Reference";

    trebleReference.style.display = selectedClef === "treble" ? "block" : "none";
    bassReference.style.display = selectedClef === "bass" ? "block" : "none";

    if (selectedClef === "bass") {
      drawBassReference();
    }

    setupScreen.style.display = "none";
    gameScreen.style.display = "block";
    startNewRound();
  }

  function startNewRound() {
    if (usedWords.size >= WORD_LIST.length) usedWords.clear();

    const available = WORD_LIST.filter(item => !usedWords.has(item.word));
    const choice = available[Math.floor(Math.random() * available.length)];
    chosenWord = choice.word;

    noteSequence = [...chosenWord].map(letter => {
      const choices = NOTE_POSITIONS[currentClef][letter];
      return choices[Math.floor(Math.random() * choices.length)];
    });

    locked = false;
    wordInput.disabled = false;
    submitBtn.disabled = false;
    nextBtn.disabled = true;
    wordInput.value = "";
    definitionPanel.textContent = "";
    setMessage("Guess the word based on the notes!", "info");
    redrawStaff();
    requestAnimationFrame(() => wordInput.focus());
  }

  function submitGuess() {
    if (locked) return;

    const guess = wordInput.value.trim().toUpperCase();

    if (!guess) {
      setMessage("Enter a word before submitting.", "error");
      return;
    }

    if (guess === chosenWord) {
      successfulGuesses++;
      usedWords.add(chosenWord);
      scoreEl.textContent = `Successful Guesses: ${successfulGuesses}`;
      definitionPanel.textContent = `Definition: ${WORD_MAP.get(chosenWord)}`;
      setMessage(`Correct! The word was ${chosenWord}!`, "success");

      locked = true;
      wordInput.disabled = true;
      submitBtn.disabled = true;
      nextBtn.disabled = false;

      // Keep the result and definition visible until the student chooses Next
      // or presses Enter again.
      nextRoundTimer = null;
    } else {
      definitionPanel.textContent = "";
      setMessage("Incorrect guess. Try again!", "error");
      wordInput.select();
    }
  }

  submitBtn.addEventListener("click", submitGuess);

  nextBtn.addEventListener("click", () => {
    if (nextBtn.disabled) return;
    clearTimeout(nextRoundTimer);
    startNewRound();
  });

  wordInput.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;

    // Prevent this same Enter press from also reaching the document-level
    // listener after submitGuess disables the input.
    event.preventDefault();
    event.stopPropagation();

    if (locked && !nextBtn.disabled) {
      clearTimeout(nextRoundTimer);
      startNewRound();
    } else {
      submitGuess();
    }
  });

  // Keep Enter working even after the answer field becomes disabled.
  document.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    if (document.activeElement === wordInput) return;

    if (locked && !nextBtn.disabled) {
      event.preventDefault();
      clearTimeout(nextRoundTimer);
      startNewRound();
    }
  });

  restartBtn.addEventListener("click", () => {
    clearTimeout(nextRoundTimer);
    successfulGuesses = 0;
    usedWords.clear();
    scoreEl.textContent = "Successful Guesses: 0";
    gameScreen.style.display = "none";
    setupScreen.style.display = "block";
    definitionPanel.textContent = "";
    setMessage("");
  });

  document.querySelectorAll(".clef-option").forEach(button => {
    button.addEventListener("click", () => startGame(button.dataset.clef));
  });

});

</script>
</body>
</html>
