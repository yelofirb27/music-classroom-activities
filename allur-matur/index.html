<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iceland Food Patterns</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183c58}body{display:grid;place-items:center;font-family:Georgia,serif}.stage{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;background:url('assets/market.png') center/100% 100% no-repeat;overflow:hidden}.choice{position:absolute;top:22%;height:37%;width:15.1%;border:0;background:transparent;cursor:pointer;border-radius:14px}.choice:hover{background:#fff5d31a;outline:3px solid #e9bd61}.choice:focus-visible,.slot:focus-visible,button:focus-visible{outline:4px solid #e5b14d;outline-offset:1px}.lower{position:absolute;left:12.5%;right:6.8%;top:73.7%;bottom:3.6%;display:flex;gap:.7%;background:#fff5e6;border-radius:12px;padding:.3%}.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8%;flex:1;min-width:0}.slot{background:#fff8eb;border:2px solid #24587d;border-radius:10px;min-width:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1%;color:#163b58;font-weight:bold}.slot img{width:88%;height:48%;object-fit:contain}.slot .name{font-size:clamp(9px,1.38vw,20px);text-align:center;line-height:1.05}.slot .notes{background:white;border:1px solid #d3bca0;border-radius:5px;width:96%;height:25%;margin-top:auto;display:flex;align-items:center;justify-content:center}.notes svg{width:100%;height:100%}.slot .syll{font:700 clamp(8px,1vw,15px) Arial,sans-serif;white-space:nowrap}.slot.empty{border-style:dashed;color:#7d7b6e;font-size:clamp(10px,1.5vw,23px)}.controls{width:16%;display:flex;flex-direction:column;gap:4%;}.controls button{flex:1;min-height:0;background:#0c3d67;border:2px solid #a9c5d5;border-radius:8px;color:white;font:700 clamp(9px,1.2vw,18px) Georgia,serif;cursor:pointer}.controls button:nth-child(2){background:#a72729;border-color:#d8a5a5}.hide-top{position:absolute;top:46.7%;height:12.5%;left:2.8%;right:2.8%;pointer-events:none;display:none}.hidden-rhythm .hide-top{display:block}.hidden-rhythm .hide-top span{position:absolute;width:15.5%;height:100%;background:#f7e8d1;border-radius:5px}.hidden-rhythm .hide-top span:nth-child(1){left:0}.hidden-rhythm .hide-top span:nth-child(2){left:16.8%}.hidden-rhythm .hide-top span:nth-child(3){left:33.6%}.hidden-rhythm .hide-top span:nth-child(4){left:50.4%}.hidden-rhythm .hide-top span:nth-child(5){left:67.2%}.hidden-rhythm .hide-top span:nth-child(6){left:84%}@media(max-aspect-ratio:1/1){.stage{width:100vw}.slot .name{font-size:9px}.slot .syll{font-size:8px}.controls button{font-size:8px}}
</style></head><body><div class="stage" id="stage" role="application" aria-label="Iceland food rhythm patterns"><div id="choices"></div><div class="hide-top"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="lower"><div class="slots" id="slots"></div><div class="controls"><button id="rhythm">Hide Rhythm</button><button id="reset">Reset</button><button id="full">Fullscreen</button></div></div></div><script>
const foods=[['Shark','ta-a-a-a',[4]],['Sheep’s head','ta-a ta-a',[2,2]],['Smoked mutton','ta-a ta ta',[2,1,1]],['Wind-dried fish','ta ta ta-a',[1,1,2]],['Liver','ta ta rest rest',[1,1,-1,-1]],['Pickled herring','ta ta ta ta',[1,1,1,1]]];
let chosen=[null,null,null,null],visible=true;const stage=document.getElementById('stage');const choices=document.getElementById('choices');foods.forEach((f,i)=>{const b=document.createElement('button');b.className='choice';b.style.left=(2.6+i*16.15)+'%';b.setAttribute('aria-label','Add '+f[0]);b.onclick=()=>{let k=chosen.indexOf(null);if(k!==-1){chosen[k]=i;render()}};choices.append(b)});
function notes(seq){let svg='',x=10;for(let n of seq){const width=Math.abs(n)*40,c=x+width/2;if(n===4){svg+=`<ellipse cx="${c}" cy="25" rx="12" ry="7" transform="rotate(-20 ${c} 25)" fill="white" stroke="#142d42" stroke-width="2.7"/>`;}else if(n===2||n===1){svg+=`<ellipse cx="${c}" cy="29" rx="8.7" ry="6" transform="rotate(-20 ${c} 29)" fill="${n===1?'#142d42':'white'}" stroke="#142d42" stroke-width="2.5"/><path d="M${c+8} 27V6" stroke="#142d42" stroke-width="2.8"/>`;}else{svg+=`<path d="M${c-3} 5 l8 12 -7 7 6 6 -7 10" stroke="#142d42" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;}x+=width;}return `<svg viewBox="0 0 180 45" aria-hidden="true">${svg}</svg>`}
function render(){const slots=document.getElementById('slots');slots.innerHTML='';chosen.forEach((id,i)=>{let b=document.createElement('button');b.className='slot'+(id===null?' empty':'');if(id===null){b.textContent='Measure '+(i+1)+'  +';b.setAttribute('aria-label','Empty measure '+(i+1))}else{const f=foods[id];b.innerHTML=`<img src="assets/food${id}.png" alt=""><div class="name">${f[0]}</div>${visible?`<div class="notes">${notes(f[2])}</div><div class="syll">${f[1]}</div>`:''}`;b.setAttribute('aria-label','Remove '+f[0]+' from measure '+(i+1));b.onclick=()=>{chosen[i]=null;render()}}slots.append(b)});stage.classList.toggle('hidden-rhythm',!visible);document.getElementById('rhythm').textContent=visible?'Hide Rhythm':'Show Rhythm'}document.getElementById('rhythm').onclick=()=>{visible=!visible;render()};document.getElementById('reset').onclick=()=>{chosen=[null,null,null,null];render()};document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};render();
</script></body></html>
