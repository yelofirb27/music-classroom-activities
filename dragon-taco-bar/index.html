<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Taco Bar</title><meta name="description" content="Choose four taco toppings for three hungry dragon friends."><style>
*{box-sizing:border-box}body{margin:0;background:#fffef9;color:#473d34;font-family:'Comic Sans MS','Chalkboard SE',cursive}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:4px solid #207e91;outline-offset:3px}.app{max-width:1400px;padding:10px 24px 15px;margin:auto}header{text-align:center;position:relative;padding:0 160px}h1{margin:0;height:84px;display:flex;justify-content:center;align-items:center}h1 img{height:100%;width:min(100%,540px);object-fit:contain}header p{font-size:clamp(14px,1.6vw,20px);margin:0 0 8px;line-height:1.3}.actions{position:absolute;right:0;top:22px;display:flex;gap:8px}.action{border:2px solid #736154;border-radius:7px 12px 8px 10px;background:#fff8de;padding:8px 11px;font-size:14px;box-shadow:2px 3px #d6c6a2}.action:hover{background:#f7dc83}.customer-scene{height:clamp(175px,27vh,285px);overflow:hidden;margin:0 auto -3px}.customer-scene img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.bar{background:#eedcba;border:3px solid #987450;border-radius:10px 6px 13px 8px;padding:16px 14px 8px;box-shadow:0 6px #bc9366;position:relative}.bar:before{content:'MILD TOPPINGS ONLY!';position:absolute;top:-12px;left:20px;transform:rotate(-2deg);background:#ffdf73;border:2px solid #9d7b35;padding:3px 10px;font-size:11px;letter-spacing:1px}.ingredients{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px 14px}.ingredient{border:0;background:none;padding:0;min-width:0;position:relative;transition:transform .15s}.ingredient:hover{transform:translateY(-3px)}.label{display:inline-block;background:#fffdf2;border:2px solid #897763;padding:4px 7px;border-radius:4px 2px 5px 3px;font-size:clamp(12px,1.2vw,18px);white-space:nowrap;transform:rotate(-2deg);box-shadow:1px 2px #b9a082}.ingredient:nth-child(even) .label{transform:rotate(2deg)}.ingredient img{display:block;width:100%;height:clamp(55px,8vh,90px);object-fit:contain;mix-blend-mode:multiply}.ingredient[aria-pressed=true] .label{background:#dce8b4;border-color:#5f803e}.ingredient[aria-pressed=true]:after{content:'✓';position:absolute;right:3px;bottom:3px;background:#648740;color:white;border-radius:50%;width:23px;height:23px;font:bold 17px system-ui}.ingredient:last-child{grid-column:auto}.taco-zone{text-align:center;margin-top:17px}.recipe{max-width:1040px;margin:auto}.recipe h2{margin:0;font-size:clamp(21px,2vw,28px);font-weight:normal;color:#317a89}.counter{font-size:13px;color:#807150;margin:3px 0}.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin:9px 0}.slot{min-height:clamp(125px,19vh,195px);border:3px dashed #c3ab7b;border-radius:12px 17px 10px 15px;background:#fffae9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-width:0;font-size:clamp(17px,1.7vw,25px);transition:transform .15s}.slot:nth-child(odd){transform:rotate(-1deg)}.slot:nth-child(even){transform:rotate(1deg)}.slot.filled{background:#fffdf4;border:3px solid #849c5a}.slot.filled:hover{transform:translateY(-3px)}.slot img{width:100%;height:clamp(75px,11vh,130px);object-fit:contain;mix-blend-mode:multiply}.slot.empty{color:#c1aa73;font-size:38px}.slot small{font:11px system-ui;color:#8a795b;margin-top:3px}.message{font-size:14px;min-height:23px;margin:0;color:#75644f}@media(max-width:700px){.app{padding:10px}header{padding:0}h1{height:74px}header p{font-size:14px;max-width:360px;margin:0 auto 8px}.actions{position:static;justify-content:center;margin:6px 0}.action{padding:6px 12px;font-size:12px}.customer-scene{height:180px}.ingredients{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px 5px}.ingredient:last-child{grid-column:auto}.ingredient img{height:57px}.label{font-size:11px;padding:3px 5px}.bar{padding:15px 7px 8px}.slots{gap:7px}.slot{min-height:120px;padding:4px;font-size:14px}.slot img{height:70px}.slot small{font-size:9px}.recipe h2{font-size:22px}.message{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.rhythm-toggle{background:#b7cff2;margin:7px 0 5px;font:bold 14px system-ui}.rhythm-toggle:hover{background:#a5c4ef}.slot.filled{padding:0;position:relative;perspective:900px;display:block;background:none;border:0}.card-flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s ease}.show-rhythm .card-flipper{transform:rotateY(180deg)}.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fffdf4;border:3px solid #849c5a;border-radius:12px 17px 10px 15px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:8px}.card-back{transform:rotateY(180deg);background:white;border:2px solid #222;border-radius:10px;box-shadow:0 5px 11px #0003;padding:8%}.card-back img{width:100%;height:100%;object-fit:contain;mix-blend-mode:normal}.show-rhythm .card-front{pointer-events:none}.card-back{pointer-events:none}.show-rhythm .card-back{pointer-events:auto}@media(prefers-reduced-motion:reduce){.card-flipper{transition:none}}
.papel-picado{width:100%;height:clamp(60px,9vh,100px);margin:-7px auto 5px;overflow:hidden}.papel-picado img{display:block;width:100%;height:100%;object-fit:fill}header h1{height:74px}.customer-scene{height:clamp(165px,24vh,260px)}@media(max-width:700px){.papel-picado{height:52px;margin:-5px 0 5px}.customer-scene{height:180px}}

.customer-scene{position:relative;isolation:isolate;overflow:hidden;height:clamp(200px,29vh,310px);margin-top:4px}.papel-picado{position:absolute;left:0;right:0;top:-25px;width:100%;height:auto;margin:0;overflow:visible;z-index:0;pointer-events:none}.customer-scene .papel-picado img{display:block;width:100%;height:auto;object-fit:contain;mix-blend-mode:normal}.customer-scene .dragons{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;object-position:center bottom;mix-blend-mode:normal}header{z-index:2}@media(max-width:700px){.customer-scene{height:180px}.papel-picado{top:0;height:auto;margin:0}}

/* Allocate the available screen height across the activity, including card backs. */
@media(min-width:701px){
html,body{height:100%;margin:0}body{overflow:hidden}.app{height:100dvh;min-height:0;padding:clamp(5px,1vh,12px) 20px;display:grid;grid-template-rows:minmax(0,16fr) minmax(0,28fr) minmax(0,27fr) minmax(0,29fr);gap:clamp(4px,1vh,10px)}
header{min-height:0;padding:0 175px;display:flex;flex-direction:column;justify-content:center}header h1{height:55%;min-height:0;flex:1}header p{font-size:clamp(12px,2.1vh,20px);line-height:1.18;margin:3px 0 0}.actions{top:50%;transform:translateY(-50%)}.action{font-size:clamp(12px,1.8vh,16px);padding:clamp(5px,1vh,9px) 11px}
.customer-scene{height:100%;min-height:0;margin:0}.bar{min-height:0;padding:clamp(8px,1.8vh,16px) 12px 5px;box-shadow:0 3px #bc9366}.bar:before{font-size:clamp(8px,1.3vh,11px);padding:2px 8px;top:-9px}.ingredients{height:100%;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(3px,.7vh,8px) 12px}.ingredient{height:100%;min-height:0;display:flex;flex-direction:column;align-items:center}.label{flex:none;font-size:clamp(11px,1.8vh,18px);padding:3px 6px}.ingredient img{height:0;min-height:0;flex:1;width:100%;object-fit:contain}.ingredient[aria-pressed=true]:after{width:19px;height:19px;font-size:14px}
.taco-zone{height:100%;min-height:0;margin:0}.recipe{height:100%;min-height:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;justify-items:center}.recipe h2{font-size:clamp(16px,2.6vh,28px);line-height:1.15}.rhythm-toggle{margin:3px 0;padding:4px 11px;font-size:clamp(10px,1.5vh,14px)}.counter{font-size:clamp(10px,1.5vh,13px);margin:0}.slots{align-self:stretch;width:100%;height:auto;min-height:0;margin:5px 0;gap:15px}.slot{height:100%;min-height:0;font-size:clamp(14px,2.3vh,25px)}.slot.empty{font-size:clamp(22px,4vh,38px)}.card-face{padding:5px}.card-front img{height:0;min-height:0;flex:1;width:100%;object-fit:contain}.card-front span{flex:none;line-height:1.1}.slot small{font-size:clamp(8px,1.2vh,11px);margin-top:2px}.card-back{padding:8%}.card-back img{height:100%;width:100%;min-height:0;object-fit:contain}.message{font-size:clamp(10px,1.7vh,14px);line-height:1.2;min-height:0;margin:2px 0 0}
}
@media(min-width:701px) and (max-width:1000px){header{padding:0 140px}.actions{gap:5px}.action{padding-left:8px;padding-right:8px}.label{font-size:11px}.ingredients{gap:4px 6px}.slots{gap:10px}}

.ingredient:disabled{cursor:default}.ingredient:disabled:hover{transform:none}.ingredient:disabled .label{opacity:.7}.action[hidden]{display:none}
@media(min-width:701px){.app{max-width:1600px;grid-template-rows:minmax(0,13fr) minmax(0,20fr) minmax(0,33fr) minmax(0,34fr);gap:clamp(4px,.8vh,8px)}header{padding:0 240px}.recipe{max-width:1300px;width:100%}.ingredients{gap:5px 8px}.ingredient img{width:100%}.card-front img{width:100%;transform:scale(1.13)}.card-front{padding:6px 8px}.slot.filled span{position:relative;background:#fffdf4}.actions{gap:6px}.label{font-size:clamp(12px,2vh,19px)}.card-back{padding:6%}}
@media(min-width:701px) and (max-width:1000px){header{padding:0 200px}.actions{gap:4px}.action{font-size:11px;padding:5px 7px}}

.customer-scene .papel-picado{top:auto;bottom:25%}.card-front img{transform:none!important;object-position:center center}.card-front{display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;gap:2px}.card-front img{width:100%;height:100%;min-height:0;object-fit:contain}.card-front span{width:100%;text-align:center}.ingredient img{object-position:center center}@media(max-width:700px){.customer-scene .papel-picado{top:auto;bottom:30%}}
.customer-scene .papel-picado{top:auto;bottom:20%;height:auto}.customer-scene .papel-picado img{height:auto;width:100%}
.ingredient img[src*="food-white-"],.card-front img[src*="food-white-"]{mix-blend-mode:normal}
.customer-scene .papel-picado{width:82%;left:9%;right:auto;bottom:32%}@media(max-width:700px){.customer-scene .papel-picado{width:92%;left:4%;bottom:38%}}
</style></head><body><main class="app"><header><h1><img src="assets/title.png" alt="Dragon Taco Bar"></h1><p>Our hungry friends are waiting! Choose up to four toppings for their taco.</p><div class="actions"><button class="action" id="startPrompt">START</button><button class="action" id="reset">Reset</button><button class="action" id="fullscreen">Fullscreen</button></div></header><div class="customer-scene"><div class="papel-picado" aria-hidden="true"><img src="assets/taco-papel-trimmed.png" alt=""></div><img class="dragons" src="assets/dragon-friends-cutout.png" alt="Three different dragon friends eagerly wait across the protective glass, their claws resting on its rail."></div><section class="bar" aria-label="Taco toppings"><div class="ingredients" id="ingredients"></div></section><section class="taco-zone" aria-label="Chosen taco toppings"><div class="recipe"><h2>Let’s make their taco!</h2><button class="action rhythm-toggle" id="rhythmToggle" type="button" aria-pressed="false">SHOW RHYTHM</button><div class="counter" id="counter">0 of 4 toppings</div><div class="slots" id="slots"></div><p class="message" id="message" role="status" aria-live="polite">Tap START, listen, then choose your first topping!</p></div></section></main><audio id="tacoPrompt" src="assets/taco-prompt-v3.m4a" preload="auto"></audio><script>
const foods=['Chicken','Beef','Onion','Cilantro','Lime','Radish','Guacamole','Sour cream','Tomato','Cotija','Queso fresco','Lettuce','Nopales','Cheese'];let selected=Array(4).fill(null);let showRhythm=false;
const rhythms=["qq","qr","qq","qee","qr","qq","eeee","eeq","qee","qee","eeee","qq","qee","qr"];
const rhythmNames={qq:"two quarter notes",qr:"quarter note and quarter rest",eeee:"four eighth notes",eeq:"two eighth notes and a quarter note",qee:"quarter note and two eighth notes"};
function foodImage(i){return `assets/${[7,9,10].includes(i)?'food-white-':'food-even-'}${i}.png`}
const ingredients=document.getElementById('ingredients'),slots=document.getElementById('slots'),message=document.getElementById('message');
foods.forEach((name,i)=>{const b=document.createElement('button');b.className='ingredient';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',`Add ${name}`);b.innerHTML=`<span class="label">${name}</span><img src="${foodImage(i)}" alt="" draggable="false">`;b.onclick=()=>toggle(i);ingredients.append(b)});
const promptAudio=document.getElementById('tacoPrompt'),startPrompt=document.getElementById('startPrompt');
let canChoose=false,playingPrompt=false,promptRun=0;
function updateGate(){[...ingredients.querySelectorAll('button')].forEach((b,i)=>{b.disabled=!selected.includes(i)&&(!canChoose||playingPrompt||selected.every(x=>x!==null))});startPrompt.hidden=playingPrompt||canChoose||selected.every(x=>x!==null);startPrompt.textContent='START'}
async function playPrompt(){if(playingPrompt||selected.every(x=>x!==null))return;const run=++promptRun;canChoose=false;playingPrompt=true;promptAudio.currentTime=0;updateGate();message.textContent='Listen… What would you like on your taco?';try{await promptAudio.play()}catch{if(run!==promptRun)return;playingPrompt=false;canChoose=false;updateGate();message.textContent='Tap START or PLAY PROMPT to hear the recording.'}}
promptAudio.onended=()=>{if(!playingPrompt)return;playingPrompt=false;canChoose=true;updateGate();message.textContent=`Choose up to four toppings!`};
promptAudio.onerror=()=>{playingPrompt=false;canChoose=false;updateGate();message.textContent='Audio could not load. Refresh and try again.'};startPrompt.onclick=playPrompt;
function toggle(i){if(!canChoose||playingPrompt)return;const existing=selected.indexOf(i);if(existing!==-1){selected[existing]=null;render();message.textContent=`${foods[i]} removed. Choose a replacement for box ${existing+1}.`;return}const empty=selected.indexOf(null);if(empty===-1)return;selected[empty]=i;render();message.textContent=selected.every(x=>x!==null)?'Your taco is ready! Tap any card to replace that topping.':`${foods[i]} added to box ${empty+1}. Choose another topping!`}

function render(){[...ingredients.querySelectorAll('button')].forEach((b,i)=>{const on=selected.includes(i);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',`${on?'Remove':'Add'} ${foods[i]}`)});document.getElementById('counter').textContent=`${selected.filter(x=>x!==null).length} of 4 toppings`;slots.replaceChildren();for(let n=0;n<4;n++){const i=selected[n],b=document.createElement(i===null?'div':'button');b.className='slot '+(i===null?'empty':'filled');if(i===null){b.textContent=n+1;b.setAttribute('aria-label',`Empty food slot ${n+1}`)}else{b.innerHTML=`<div class="card-flipper"><div class="card-face card-front"><img src="${foodImage(i)}" alt=""><span>${foods[i]}</span><small>tap to remove</small></div><div class="card-face card-back"><img src="assets/rhythm-${rhythms[i]}.png" alt="${rhythmNames[rhythms[i]]}"></div></div>`;b.setAttribute('aria-label',`${foods[i]}${showRhythm ? ": "+rhythmNames[rhythms[i]] : ""}. Tap to remove`);b.onclick=()=>toggle(i);}slots.append(b)}updateGate()}
const rhythmToggle=document.getElementById('rhythmToggle');
function setRhythm(on){showRhythm=on;document.body.classList.toggle('show-rhythm',on);rhythmToggle.textContent=on?'SHOW FOOD':'SHOW RHYTHM';rhythmToggle.setAttribute('aria-pressed',String(on));render()}
rhythmToggle.onclick=()=>setRhythm(!showRhythm);
document.getElementById('reset').onclick=()=>{promptRun++;promptAudio.pause();promptAudio.currentTime=0;playingPrompt=false;canChoose=false;selected=Array(4).fill(null);setRhythm(false);playPrompt()};document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{message.textContent='Fullscreen is unavailable in this browser.'}};document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen');render();
</script></body></html>
